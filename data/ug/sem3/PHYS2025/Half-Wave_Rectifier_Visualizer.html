<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half-Wave Rectifier Simulator | Physics Lab</title>
    <style>
        :root {
            --bg-color: #0b141d;
            --panel-bg: #141e27;
            --accent-blue: #4fc3f7;
            --wire-color: #546e7a;
            --current-color: #00e676;
            --sine-color: #ff5252;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #263238;
        }

        h1 { text-align: center; color: var(--accent-blue); margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.9rem; color: #90a4ae; margin-bottom: 20px; }

        .lab-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .circuit-view, .graph-view {
            background: #050a0f;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #37474f;
        }

        svg { width: 100%; height: auto; }

        /* Animation Styles */
        .electron {
            fill: var(--current-color);
            filter: drop-shadow(0 0 3px var(--current-color));
        }

        .hidden { display: none; }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #1c2a35;
            padding: 15px;
            border-radius: 40px;
        }

        .btn {
            background: #263238;
            border: 2px solid var(--accent-blue);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { background: var(--accent-blue); color: #0b141d; }

        .data-readout {
            text-align: center;
            margin-top: 15px;
            font-family: monospace;
            color: var(--accent-blue);
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .forward-bias { color: var(--current-color); font-weight: bold; animation: pulse 0.5s infinite alternate; }
        .reverse-bias { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Half-Wave Rectifier Visualizer</h1>
    <div class="subtitle">Observation of PN-Junction behavior during AC cycles</div>

    <div class="lab-layout">
        <div class="circuit-view">
            <h3 style="text-align: center; font-size: 0.8rem; color: #cfd8dc;">CIRCUIT DIAGRAM</h3>
            <svg viewBox="0 0 300 180">
                <circle cx="40" cy="90" r="15" fill="none" stroke="white" stroke-width="2"/>
                <path d="M 33 90 Q 40 75 47 90 T 40 105" fill="none" stroke="white" stroke-width="1.5"/>
                
                <path d="M 70 60 Q 80 75 70 90 Q 80 105 70 120" fill="none" stroke="#90a4ae" stroke-width="3"/>
                <path d="M 100 60 Q 90 75 100 90 Q 90 105 100 120" fill="none" stroke="#90a4ae" stroke-width="3"/>

                <g id="diode-group">
                    <line x1="150" y1="60" x2="180" y2="60" stroke="var(--wire-color)" stroke-width="2"/>
                    <polygon points="170,50 170,70 185,60" fill="#4fc3f7" id="diode-arrow"/>
                    <line x1="185" y1="50" x2="185" y2="70" stroke="white" stroke-width="3"/>
                </g>

                <path d="M 240 60 L 240 80 L 230 85 L 250 95 L 230 105 L 250 115 L 240 120 L 240 150" fill="none" stroke="#ffb74d" stroke-width="2"/>
                <text x="255" y="100" fill="#ffb74d" font-size="10">RL</text>

                <path d="M 55 90 L 70 90 M 100 60 L 150 60 M 185 60 L 240 60 M 100 120 L 240 120 L 240 150" fill="none" stroke="var(--wire-color)" stroke-width="2"/>
                <path d="M 100 120 L 100 150 L 240 150" fill="none" stroke="var(--wire-color)" stroke-width="2"/>

                <circle id="electron" r="3" class="electron hidden" />
            </svg>
        </div>

        <div class="graph-view">
            <h3 style="text-align: center; font-size: 0.8rem; color: #cfd8dc;">OSCILLOSCOPE OUTPUT</h3>
            <canvas id="scopeCanvas" width="400" height="180"></canvas>
        </div>
    </div>

    <div class="data-readout" id="status-text">
        Status: Circuit Idle
    </div>

    <div class="controls">
        <button class="btn" onclick="toggleSimulation()" id="powerBtn">START POWER</button>
        <button class="btn" onclick="resetSim()" style="border-color: #78909c;">RESET</button>
    </div>
</div>

<script>
    let isRunning = false;
    let time = 0;
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');
    const electron = document.getElementById('electron');
    const statusText = document.getElementById('status-text');

    function drawScope() {
        if (!isRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Grid
        ctx.strokeStyle = '#1e293b';
        ctx.beginPath();
        for(let i=0; i<canvas.width; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
        for(let j=0; j<canvas.height; j+=40) { ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); }
        ctx.stroke();

        // Draw Input Sine Wave (Red)
        ctx.strokeStyle = '#ff525255';
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x++) {
            let y = 60 + Math.sin((x + time) * 0.05) * 40;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Draw Rectified Output (Green)
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x++) {
            let sineVal = Math.sin((x + time) * 0.05);
            let y = 140 - (sineVal > 0 ? sineVal * 40 : 0);
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.lineWidth = 1;

        // Animate Circuit Logic
        let currentSine = Math.sin(time * 0.05);
        if (currentSine > 0) {
            electron.classList.remove('hidden');
            statusText.innerHTML = "Cycle: <span class='forward-bias'>Positive Half (Forward Bias) - Diode Conducts</span>";
            moveElectron(time);
        } else {
            electron.classList.add('hidden');
            statusText.innerHTML = "Cycle: <span class='reverse-bias'>Negative Half (Reverse Bias) - Diode Blocks</span>";
        }

        time += 2;
        requestAnimationFrame(drawScope);
    }

    function moveElectron(t) {
        // Path following logic for electron animation
        // Simple bounding box logic for the circuit loop
        let progress = (t % 100) / 100;
        if(progress < 0.25) { // Top wire
            electron.setAttribute('cx', 100 + (progress * 4 * 140));
            electron.setAttribute('cy', 60);
        } else if (progress < 0.5) { // Down load
            electron.setAttribute('cx', 240);
            electron.setAttribute('cy', 60 + (progress - 0.25) * 4 * 90);
        } else { // Bottom return
            electron.setAttribute('cx', 240 - (progress - 0.5) * 2 * 140);
            electron.setAttribute('cy', 150);
        }
    }

    function toggleSimulation() {
        isRunning = !isRunning;
        document.getElementById('powerBtn').innerText = isRunning ? "STOP POWER" : "START POWER";
        if (isRunning) drawScope();
    }

    function resetSim() {
        isRunning = false;
        time = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        electron.classList.add('hidden');
        statusText.innerText = "Status: Circuit Idle";
        document.getElementById('powerBtn').innerText = "START POWER";
    }
</script>

</body>
</html>
