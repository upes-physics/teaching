<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Field Splitting Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .canvas-container { position: relative; width: 100%; height: 400px; background-color: #1e293b; border-radius: 0.5rem; overflow: hidden; box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05); }
        canvas { display: block; width: 100%; height: 100%; }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .slider-thumb::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
        .slider-thumb::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: none; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center min-h-screen">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Controls & Theory -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <h1 class="text-2xl font-bold text-white mb-2">Magnetic Field Splitting</h1>
                <p class="text-sm text-slate-400 mb-6">Explore the Normal Zeeman, Anomalous Zeeman, and Paschen-Back effects.</p>

                <!-- Tabs -->
                <div class="flex space-x-2 mb-6">
                    <button id="tab-normal" class="tab-btn active flex-1 py-2 px-3 text-sm font-medium border border-slate-600 rounded-lg hover:bg-slate-700 focus:outline-none" onclick="setMode('normal')">Normal</button>
                    <button id="tab-anomalous" class="tab-btn flex-1 py-2 px-3 text-sm font-medium border border-slate-600 rounded-lg hover:bg-slate-700 focus:outline-none" onclick="setMode('anomalous')">Anomalous</button>
                    <button id="tab-paschen" class="tab-btn flex-1 py-2 px-3 text-sm font-medium border border-slate-600 rounded-lg hover:bg-slate-700 focus:outline-none" onclick="setMode('paschen')">Paschen-Back</button>
                </div>

                <!-- Controls -->
                <div class="mb-6">
                    <label for="b-field" class="block text-sm font-medium text-slate-300 mb-2">
                        Magnetic Field Strength ($B$): <span id="b-field-val" class="font-bold text-blue-400">0.0</span> Tesla
                    </label>
                    <input type="range" id="b-field" min="0" max="5" step="0.1" value="0" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb">
                    <div class="flex justify-between text-xs text-slate-500 mt-1">
                        <span>0 T</span>
                        <span>Weak (Zeeman)</span>
                        <span>Strong (P-B)</span>
                        <span>5 T</span>
                    </div>
                </div>

                <!-- Active Selection Rules -->
                <div class="mb-6 bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-300 mb-2 uppercase tracking-wider flex items-center">
                        <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Selection Rules
                    </h3>
                    <div id="selection-rules" class="text-sm font-mono text-blue-300 leading-relaxed">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Shift Formulas -->
                <div class="mb-6 bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-300 mb-2 uppercase tracking-wider flex items-center">
                        <svg class="w-4 h-4 mr-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        Energy Shift Formulas
                    </h3>
                    <div id="active-formula" class="text-sm font-mono text-center text-green-300 bg-slate-950 py-3 px-4 rounded border border-slate-800 overflow-x-auto">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Live Data Readout -->
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-300 mb-2 uppercase tracking-wider">Calculated Shifts</h3>
                    <div id="data-readout" class="space-y-2 text-sm font-mono text-green-400">
                        <!-- Data will be populated here -->
                    </div>
                </div>
            </div>

            <!-- Theory Panel -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex-1 overflow-y-auto max-h-[400px]">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-slate-600 pb-2">Theory</h2>
                <div id="theory-content" class="text-sm text-slate-300 space-y-4">
                    <!-- Theory content populated by JS -->
                </div>
            </div>
        </div>

        <!-- Right Column: Visualization -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            <!-- Energy Level Canvas -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex-1 flex flex-col">
                <h2 class="text-lg font-bold text-white mb-4">Energy Level Diagram</h2>
                <div class="canvas-container flex-1" id="energy-container">
                    <canvas id="energyCanvas"></canvas>
                </div>
            </div>

            <!-- Spectral Lines Canvas -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 h-48 flex flex-col">
                <h2 class="text-lg font-bold text-white mb-4">Spectral Lines (Simulated)</h2>
                <div class="canvas-container flex-1 bg-black" id="spectrum-container">
                    <canvas id="spectrumCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Physics Constants (Simplified/Scaled for visualization)
        const BohrMagneton = 5.788e-5; // eV/T
        const PlanckConstant = 4.135e-15; // eV s
        const BaseEnergyLevel = 0; // Relative base energy
        const TransitionEnergy = 2.0; // eV (Base transition energy, e.g., optical range)

        // State variables
        let currentMode = 'normal';
        let bField = 0;

        // Canvas setup
        const energyCanvas = document.getElementById('energyCanvas');
        const energyCtx = energyCanvas.getContext('2d');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const spectrumCtx = spectrumCanvas.getContext('2d');

        function resizeCanvas() {
            energyCanvas.width = document.getElementById('energy-container').clientWidth;
            energyCanvas.height = document.getElementById('energy-container').clientHeight;
            spectrumCanvas.width = document.getElementById('spectrum-container').clientWidth;
            spectrumCanvas.height = document.getElementById('spectrum-container').clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        const theoryData = {
            normal: `
                <p><strong>Normal Zeeman Effect</strong> occurs in transitions where the total spin S=0 (e.g., singlet states). Only the orbital angular momentum L interacts with the external magnetic field B.</p>
                <p class="mt-2">The energy shift is given by: <br><span class="text-blue-300 font-mono inline-block mt-1">&Delta;E = m<sub>l</sub> &mu;<sub>B</sub> B</span></p>
                <p class="mt-2">Where m<sub>l</sub> is the magnetic quantum number, and &mu;<sub>B</sub> is the Bohr magneton.</p>
                <p class="mt-2">Selection rules &Delta;m<sub>l</sub> = 0, &plusmn;1 dictate that a single spectral line splits into exactly <strong>three</strong> lines.</p>
            `,
            anomalous: `
                <p><strong>Anomalous Zeeman Effect</strong> occurs when the total spin S &ne; 0 (e.g., doublet states like Sodium D-lines) in a <em>weak</em> magnetic field.</p>
                <p class="mt-2">The interaction is described by the total angular momentum J = L + S. The Landé g-factor accounts for different gyromagnetic ratios of spin and orbit.</p>
                <p class="mt-2">Energy shift: <br><span class="text-blue-300 font-mono inline-block mt-1">&Delta;E = g<sub>J</sub> m<sub>j</sub> &mu;<sub>B</sub> B</span></p>
                <p class="mt-2">Where g<sub>J</sub> = 1 + [J(J+1) + S(S+1) - L(L+1)] / [2J(J+1)]. This leads to complex splitting patterns with more than three lines.</p>
            `,
            paschen: `
                <p><strong>Paschen-Back Effect</strong> occurs in a <em>strong</em> magnetic field where the interaction with B overwhelms the internal spin-orbit coupling (L &middot; S).</p>
                <p class="mt-2">L and S decouple and precess independently around B. The quantum numbers m<sub>l</sub> and m<sub>s</sub> become good quantum numbers.</p>
                <p class="mt-2">Energy shift: <br><span class="text-blue-300 font-mono inline-block mt-1">&Delta;E = (m<sub>l</sub> + 2m<sub>s</sub>) &mu;<sub>B</sub> B</span></p>
                <p class="mt-2">The pattern simplifies back to a structure resembling the normal Zeeman effect (a triplet), but with subtle fine structure shifts.</p>
            `
        };

        // UI Interaction
        function setMode(mode) {
            currentMode = mode;
            
            // Update tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');
            
            // Update theory
            document.getElementById('theory-content').innerHTML = theoryData[mode];
            
            // Update Selection Rules & Formulas display
            const rulesDiv = document.getElementById('selection-rules');
            const formulaDiv = document.getElementById('active-formula');
            
            if(rulesDiv && formulaDiv) {
                // Helper strings to build textbook-style fractions using Tailwind CSS
                const fracUB = `<span class="inline-flex flex-col items-center justify-center align-middle text-[11px] mx-1 font-sans"><span class="border-b border-green-300 pb-[1px] mb-[1px] leading-none px-1">&mu;<sub>B</sub> B</span><span class="leading-none">h</span></span>`;
                const fracEB = `<span class="inline-flex flex-col items-center justify-center align-middle text-[11px] mx-1 font-sans"><span class="border-b border-green-300 pb-[1px] mb-[1px] leading-none px-1">e B</span><span class="leading-none">4&pi; m<sub>e</sub></span></span>`;

                if (mode === 'normal') {
                    rulesDiv.innerHTML = `&Delta;m<sub>l</sub> = 0 (&pi;), &plusmn;1 (&sigma;)`;
                    formulaDiv.innerHTML = `
                        <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Energy Level Shift</span>
                        &Delta;E = m<sub>l</sub> &mu;<sub>B</sub> B
                        <hr class="border-slate-800 my-2">
                        <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Frequency Shift (&Delta;&nu;)</span>
                        &Delta;&nu; = &Delta;m<sub>l</sub> ${fracUB} = &Delta;m<sub>l</sub> ${fracEB}
                    `;
                } else if (mode === 'anomalous') {
                    rulesDiv.innerHTML = `&Delta;m<sub>j</sub> = 0 (&pi;), &plusmn;1 (&sigma;)<br><span class="text-xs text-slate-400 mt-1 block font-sans">(&Delta;J=0 &rArr; m<sub>j</sub>=0 &rarr; 0 forbidden)</span>`;
                    formulaDiv.innerHTML = `
                        <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Energy Level Shift</span>
                        &Delta;E = g<sub>J</sub> m<sub>j</sub> &mu;<sub>B</sub> B
                        <hr class="border-slate-800 my-2">
                        <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Frequency Shift (&Delta;&nu;)</span>
                        &Delta;&nu; = (m<sub>j,i</sub> g<sub>i</sub> - m<sub>j,f</sub> g<sub>f</sub>) ${fracUB}
                    `;
                } else if (mode === 'paschen') {
                    rulesDiv.innerHTML = `&Delta;m<sub>s</sub> = 0<br>&Delta;m<sub>l</sub> = 0 (&pi;), &plusmn;1 (&sigma;)`;
                    formulaDiv.innerHTML = `
                        <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Energy Level Shift</span>
                        &Delta;E = (m<sub>l</sub> + 2m<sub>s</sub>) &mu;<sub>B</sub> B
                        <hr class="border-slate-800 my-2">
                        <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Frequency Shift (&Delta;&nu;)</span>
                        &Delta;&nu; = &Delta;m<sub>l</sub> ${fracUB}
                    `;
                }
            }
            
            // Adjust B-field slider limits based on mode to emphasize the physics
            const slider = document.getElementById('b-field');
            if(mode === 'normal') { slider.max = 5; }
            if(mode === 'anomalous') { slider.max = 2; slider.value = Math.min(slider.value, 2); } // Weak field
            if(mode === 'paschen') { slider.max = 10; slider.value = Math.max(slider.value, 3); } // Strong field
            
            updateBField();
        }

        document.getElementById('b-field').addEventListener('input', updateBField);

        function updateBField() {
            bField = parseFloat(document.getElementById('b-field').value);
            document.getElementById('b-field-val').innerText = bField.toFixed(1);
            draw();
            updateReadout();
        }

        // Physics Calculations
        function calculateLevels() {
            let initialLevels = []; // { energy, label, baseE, baseLabel }
            let finalLevels = [];
            let transitions = [];   // { energyDiff, intensity, label }

            // Visualization scaling factor
            const scale = 0.5; 

            if (currentMode === 'normal') {
                // Final state (s, L=0, ml=0)
                finalLevels.push({ e: BaseEnergyLevel, baseE: BaseEnergyLevel, l: 'ml=0', baseLabel: '¹S₀' });
                
                // Initial state (p, L=1, ml=-1, 0, 1)
                const baseInitial = BaseEnergyLevel + TransitionEnergy;
                [-1, 0, 1].forEach(ml => {
                    const shift = ml * scale * bField;
                    initialLevels.push({ e: baseInitial + shift, baseE: baseInitial, l: `ml=${ml}`, ml: ml, baseLabel: '¹P₁' });
                });

                // Transitions (delta ml = 0, +/-1)
                initialLevels.forEach(init => {
                    const deltaE = init.e - finalLevels[0].e;
                    const shiftVal = init.ml * bField;
                    let type = init.ml === 0 ? 'π' : 'σ';
                    transitions.push({ e: deltaE, initE: init.e, finE: finalLevels[0].e, type: type, shift: shiftVal, color: type === 'π' ? '#fff' : '#3b82f6' });
                });

            } else if (currentMode === 'anomalous') {
                // Ground 2S_1/2
                const gS12 = 2;
                [-0.5, 0.5].forEach(mj => {
                    finalLevels.push({ e: BaseEnergyLevel + mj * gS12 * scale * bField, baseE: BaseEnergyLevel, l: `mj=${mj > 0 ? '+1/2' : '-1/2'}`, mj: mj, baseLabel: '²S₁/₂' });
                });

                // Excited 2P_1/2
                const baseP12 = BaseEnergyLevel + TransitionEnergy - 0.2;
                const gP12 = 2/3;
                [-0.5, 0.5].forEach(mj => {
                    initialLevels.push({ e: baseP12 + mj * gP12 * scale * bField, baseE: baseP12, l: `mj=${mj > 0 ? '+1/2' : '-1/2'}`, mj: mj, state: 'P12', baseLabel: '²P₁/₂' });
                });

                // Excited 2P_3/2
                const baseP32 = BaseEnergyLevel + TransitionEnergy + 0.2;
                const gP32 = 4/3;
                [-1.5, -0.5, 0.5, 1.5].forEach(mj => {
                    let mjStr = mj > 0 ? `+${mj}` : `${mj}`;
                    initialLevels.push({ e: baseP32 + mj * gP32 * scale * bField, baseE: baseP32, l: `mj=${mjStr}`, mj: mj, state: 'P32', baseLabel: '²P₃/₂' });
                });

                // Transitions
                initialLevels.forEach(init => {
                    finalLevels.forEach(fin => {
                        const dmj = init.mj - fin.mj;
                        if (Math.abs(dmj) <= 1 && !(init.mj === 0 && fin.mj === 0 && init.state === 'P12')) {
                            transitions.push({ 
                                e: init.e - fin.e, 
                                initE: init.e,
                                finE: fin.e,
                                type: dmj === 0 ? 'π' : 'σ', 
                                state: init.state,
                                color: init.state === 'P12' ? '#f59e0b' : '#ef4444' 
                            });
                        }
                    });
                });

            } else if (currentMode === 'paschen') {
                // Final state L=0
                [-0.5, 0.5].forEach(ms => {
                    finalLevels.push({ e: BaseEnergyLevel + (0 + 2*ms) * scale * bField, baseE: BaseEnergyLevel, l: `ms=${ms > 0 ? '+1/2' : '-1/2'}`, ml:0, ms:ms, baseLabel: '²S' });
                });

                // Initial state L=1
                const base = BaseEnergyLevel + TransitionEnergy;
                [-1, 0, 1].forEach(ml => {
                    [-0.5, 0.5].forEach(ms => {
                        const so_residual = 0.05 * ml * ms; 
                        initialLevels.push({ e: base + (ml + 2*ms) * scale * bField + so_residual, baseE: base, l: `ml=${ml}, ms=${ms > 0 ? '+1/2' : '-1/2'}`, ml:ml, ms:ms, baseLabel: '²P' });
                    });
                });

                // Transitions
                initialLevels.forEach(init => {
                    finalLevels.forEach(fin => {
                        if (init.ms === fin.ms && Math.abs(init.ml - fin.ml) <= 1) {
                            let type = (init.ml - fin.ml) === 0 ? 'π' : 'σ';
                            transitions.push({ 
                                e: init.e - fin.e, 
                                initE: init.e,
                                finE: fin.e,
                                type: type,
                                color: type === 'π' ? '#fff' : '#10b981'
                            });
                        }
                    });
                });
            }

            return { initialLevels, finalLevels, transitions };
        }

        // Drawing logic
        function draw() {
            // Clear Canvases
            energyCtx.clearRect(0, 0, energyCanvas.width, energyCanvas.height);
            spectrumCtx.clearRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);

            const data = calculateLevels();
            
            // --- Draw Energy Levels ---
            const w = energyCanvas.width;
            const h = energyCanvas.height;
            
            // Layout zones: Unsplit (left), Fanning (middle), Split (right)
            const leftX_start = w * 0.12; // Shifted right to make room for Y-axis
            const leftX_end = w * 0.30;
            const rightX_start = w * 0.50;
            const rightX_end = w * 0.88; 
            
            // Y-axis scaling
            const yMin = BaseEnergyLevel - 2.5;
            const yMax = BaseEnergyLevel + TransitionEnergy + 2.5;
            const mapY = (e) => h - ((e - yMin) / (yMax - yMin)) * h;

            // 0. Draw Energy Axis (Y-axis)
            energyCtx.strokeStyle = '#94a3b8'; // Slate-400
            energyCtx.lineWidth = 2;
            energyCtx.beginPath();
            energyCtx.moveTo(w * 0.05, h - 20); // Bottom
            energyCtx.lineTo(w * 0.05, 30);     // Top
            
            // Arrowhead
            energyCtx.lineTo(w * 0.05 - 5, 40);
            energyCtx.moveTo(w * 0.05, 30);
            energyCtx.lineTo(w * 0.05 + 5, 40);
            energyCtx.stroke();
            
            // Y-axis label
            energyCtx.fillStyle = '#cbd5e1'; // Slate-300
            energyCtx.font = 'bold 14px sans-serif';
            energyCtx.textAlign = 'center';
            energyCtx.save();
            energyCtx.translate(w * 0.03, h / 2);
            energyCtx.rotate(-Math.PI / 2);
            energyCtx.fillText("Energy (E)", 0, 0);
            energyCtx.restore();

            // 1. Draw connecting fan lines (Splitting effect)
            const drawConnections = (levels, color) => {
                levels.forEach(lvl => {
                    const startY = mapY(lvl.baseE);
                    const endY = mapY(lvl.e);
                    
                    energyCtx.strokeStyle = color;
                    energyCtx.lineWidth = 1.5;
                    energyCtx.setLineDash([4, 4]); // Dashed
                    energyCtx.globalAlpha = 0.4;
                    
                    energyCtx.beginPath();
                    energyCtx.moveTo(leftX_end, startY);
                    energyCtx.lineTo(rightX_start, endY);
                    energyCtx.stroke();
                    
                    energyCtx.setLineDash([]); // Reset
                    energyCtx.globalAlpha = 1.0;
                });
            };

            drawConnections(data.finalLevels, '#60a5fa'); // Lower state fanning
            drawConnections(data.initialLevels, '#f87171'); // Upper state fanning

            // 2. Draw Base Levels (B=0, Left side)
            const baseLevelsSet = new Map();
            data.initialLevels.forEach(l => baseLevelsSet.set(l.baseE, {e: l.baseE, label: l.baseLabel, color: '#ef4444'}));
            data.finalLevels.forEach(l => baseLevelsSet.set(l.baseE, {e: l.baseE, label: l.baseLabel, color: '#3b82f6'}));

            // Draw zero-field reference lines extending to the right
            baseLevelsSet.forEach(base => {
                const y = mapY(base.e);
                energyCtx.strokeStyle = '#334155'; // Slate-700
                energyCtx.lineWidth = 1;
                energyCtx.setLineDash([2, 4]); // Dotted
                energyCtx.beginPath();
                energyCtx.moveTo(leftX_end, y);
                energyCtx.lineTo(rightX_end, y);
                energyCtx.stroke();
                energyCtx.setLineDash([]); // Reset
            });

            baseLevelsSet.forEach(base => {
                const y = mapY(base.e);
                
                // Solid un-split line
                energyCtx.strokeStyle = base.color;
                energyCtx.lineWidth = 3;
                energyCtx.lineCap = 'round';
                energyCtx.beginPath();
                energyCtx.moveTo(leftX_start, y);
                energyCtx.lineTo(leftX_end, y);
                energyCtx.stroke();
                
                // Label for Un-split state (Spectroscopic Term)
                energyCtx.fillStyle = '#f8fafc';
                energyCtx.font = 'italic bold 16px "Times New Roman", Times, serif';
                energyCtx.textAlign = 'right';
                energyCtx.fillText(base.label, leftX_start - 8, y + 5);
            });

            // 3. Draw Split Levels (B>0, Right side)
            const drawSplitLevels = (levels, isUpper) => {
                levels.forEach(lvl => {
                    const y = mapY(lvl.e);
                    
                    // Solid split line
                    energyCtx.strokeStyle = isUpper ? '#ef4444' : '#3b82f6';
                    energyCtx.lineWidth = 2;
                    energyCtx.lineCap = 'round';
                    energyCtx.beginPath();
                    energyCtx.moveTo(rightX_start, y);
                    energyCtx.lineTo(rightX_end, y);
                    energyCtx.stroke();

                    // Label for individual Quantum Numbers
                    energyCtx.fillStyle = '#94a3b8';
                    energyCtx.font = '10px monospace';
                    energyCtx.textAlign = 'left';
                    energyCtx.fillText(lvl.l, rightX_end + 5, y + 4);
                });
            };

            drawSplitLevels(data.finalLevels, false);
            drawSplitLevels(data.initialLevels, true);

            // 4. Draw transitions (vertical arrows)
            if (data.transitions.length > 0) {
                const arrowZoneW = rightX_end - rightX_start;
                const sortedTransitions = [...data.transitions].sort((a,b) => a.e - b.e);
                const stepX = arrowZoneW / (sortedTransitions.length + 1);

                sortedTransitions.forEach((trans, i) => {
                    const x = rightX_start + stepX * (i + 1);
                    const yStart = mapY(trans.initE); 
                    const yEnd = mapY(trans.finE);

                    energyCtx.strokeStyle = trans.color;
                    energyCtx.fillStyle = trans.color;
                    energyCtx.lineWidth = 1.5;
                    energyCtx.globalAlpha = 0.8;
                    
                    // Draw vertical transition line
                    energyCtx.beginPath();
                    energyCtx.moveTo(x, yStart);
                    energyCtx.lineTo(x, yEnd);
                    energyCtx.stroke();
                    
                    // Draw arrowhead pointing down
                    energyCtx.beginPath();
                    energyCtx.moveTo(x, yEnd);
                    energyCtx.lineTo(x - 4, yEnd - 6); 
                    energyCtx.lineTo(x + 4, yEnd - 6);
                    energyCtx.fill();
                    
                    energyCtx.globalAlpha = 1.0;
                });
            }

            // 5. Draw Header Labels for the Diagram
            energyCtx.fillStyle = '#e2e8f0';
            energyCtx.font = 'bold 13px sans-serif';
            energyCtx.textAlign = 'center';
            energyCtx.fillText("B = 0", (leftX_start + leftX_end)/2, 18);
            energyCtx.fillStyle = '#94a3b8';
            energyCtx.font = 'italic 11px sans-serif';
            energyCtx.fillText("Unperturbed Terms", (leftX_start + leftX_end)/2, 32);
            
            energyCtx.fillStyle = '#e2e8f0';
            energyCtx.font = 'bold 13px sans-serif';
            energyCtx.fillText(bField > 0 ? `B = ${bField.toFixed(1)} T` : "B = 0 T", (rightX_start + rightX_end)/2, 18);
            energyCtx.fillStyle = '#94a3b8';
            energyCtx.font = 'italic 11px sans-serif';
            energyCtx.fillText("Magnetic Sublevels", (rightX_start + rightX_end)/2, 32);

            // 6. Draw Grotrian Legend
            const legX = w - 100;
            const legY = 10;
            energyCtx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            energyCtx.strokeStyle = '#475569';
            energyCtx.lineWidth = 1;
            energyCtx.beginPath();
            if (energyCtx.roundRect) {
                energyCtx.roundRect(legX, legY, 90, 45, 4);
            } else {
                energyCtx.rect(legX, legY, 90, 45); // Fallback
            }
            energyCtx.fill();
            energyCtx.stroke();
            
            energyCtx.fillStyle = '#cbd5e1';
            energyCtx.font = 'bold 10px sans-serif';
            energyCtx.textAlign = 'left';
            energyCtx.fillText("Transitions:", legX + 8, legY + 14);
            
            // Pi transition line
            energyCtx.strokeStyle = '#fff';
            energyCtx.lineWidth = 1.5;
            energyCtx.beginPath(); energyCtx.moveTo(legX + 8, legY + 26); energyCtx.lineTo(legX + 24, legY + 26); energyCtx.stroke();
            energyCtx.fillStyle = '#94a3b8';
            energyCtx.font = '10px sans-serif';
            energyCtx.fillText("π (Δm=0)", legX + 30, legY + 29);
            
            // Sigma transition line
            let sigColor = '#3b82f6';
            if(currentMode === 'anomalous') sigColor = '#ef4444';
            if(currentMode === 'paschen') sigColor = '#10b981';
            
            energyCtx.strokeStyle = sigColor;
            energyCtx.beginPath(); energyCtx.moveTo(legX + 8, legY + 38); energyCtx.lineTo(legX + 24, legY + 38); energyCtx.stroke();
            energyCtx.fillText("σ (Δm=±1)", legX + 30, legY + 41);

            // --- Draw Spectrum ---
            const sw = spectrumCanvas.width;
            const sh = spectrumCanvas.height;
            const midE = TransitionEnergy;
            
            // X-axis scaling for spectrum
            let sRange = 2.0; // Energy spread to show
            if(currentMode === 'paschen') sRange = 6.0;
            const mapX = (e) => sw/2 + ((e - midE) / sRange) * (sw/2);

            // Draw continuum background
            let gradient = spectrumCtx.createLinearGradient(0, 0, sw, 0);
            gradient.addColorStop(0, '#111');
            gradient.addColorStop(0.5, '#222');
            gradient.addColorStop(1, '#111');
            spectrumCtx.fillStyle = gradient;
            spectrumCtx.fillRect(0, 0, sw, sh);

            // Draw lines
            data.transitions.forEach(trans => {
                const x = mapX(trans.e);
                
                // Draw glow
                spectrumCtx.shadowBlur = 10;
                spectrumCtx.shadowColor = trans.color;
                
                spectrumCtx.strokeStyle = trans.color;
                spectrumCtx.lineWidth = 3;
                spectrumCtx.beginPath();
                spectrumCtx.moveTo(x, 20); // Adjusted top margin
                spectrumCtx.lineTo(x, sh - 30); // Adjusted bottom margin to leave room for text
                spectrumCtx.stroke();
                
                spectrumCtx.shadowBlur = 0; // reset
                
                // Draw Selection Rule Type (π or σ)
                if (bField > 0.05) {
                    spectrumCtx.fillStyle = trans.color;
                    spectrumCtx.font = '14px sans-serif';
                    spectrumCtx.textAlign = 'center';
                    spectrumCtx.fillText(trans.type, x, sh - 10);
                }
            });
            
            // Center unshifted reference line
            spectrumCtx.strokeStyle = 'rgba(255,255,255,0.2)';
            spectrumCtx.lineWidth = 1;
            spectrumCtx.setLineDash([2,2]);
            spectrumCtx.beginPath();
            spectrumCtx.moveTo(sw/2, 0);
            spectrumCtx.lineTo(sw/2, sh);
            spectrumCtx.stroke();
            spectrumCtx.setLineDash([]);
        }

        function updateReadout() {
            const readout = document.getElementById('data-readout');
            let html = '';
            
            if (bField === 0) {
                html = '<div>Field off: Single unshifted line.</div>';
            } else {
                const data = calculateLevels();
                const numLines = data.transitions.length;
                html += `<div>Detected Lines: <span class="text-white font-bold">${numLines}</span></div>`;
                
                if(currentMode === 'normal') {
                    const shift = bField; // simplified units
                    html += `<div>&Delta;&nu; (Lorentz Unit): <br>&plusmn; ${shift.toFixed(2)} &mu;<sub>B</sub> B</div>`;
                } else if (currentMode === 'anomalous') {
                    html += `<div>Complex multiplet structure.</div>`;
                    html += `<div class="text-xs text-slate-500 mt-1">Sodium D1/D2 lines shown.</div>`;
                } else if (currentMode === 'paschen') {
                    html += `<div>Spin-orbit coupling overcome.</div>`;
                    html += `<div>Approaching normal triplet.</div>`;
                }
            }
            readout.innerHTML = html;
        }

        // Initialize
        window.onload = () => {
            setMode('normal');
            resizeCanvas();
        };

    </script>
</body>
</html>
