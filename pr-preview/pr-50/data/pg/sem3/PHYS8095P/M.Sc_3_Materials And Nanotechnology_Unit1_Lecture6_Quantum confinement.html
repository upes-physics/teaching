<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Dimensionality Lab | 0D, 1D, 2D Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #05050a;
            --panel: rgba(15, 15, 30, 0.9);
            --accent: #00f2ff;
            --text: #e0e0e0;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, sans-serif; overflow: hidden;
        }

        #app-container {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            height: 100vh;
            gap: 10px; padding: 10px; box-sizing: border-box;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }

        .header {
            padding: 15px; background: rgba(255, 255, 255, 0.05);
            font-size: 0.8rem; letter-spacing: 2px; color: var(--accent);
            text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Viewport */
        #main-viewport { grid-column: 2; position: relative; }
        #canvas-container { width: 100%; height: 100%; cursor: move; }

        /* Dashboard */
        #stats-content { padding: 20px; font-family: monospace; font-size: 0.9rem; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px ridge rgba(255,255,255,0.05); }
        .stat-val { color: var(--accent); font-weight: bold; }

        /* Controls */
        #controls { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.75rem; opacity: 0.7; }

        select, input[type=range] {
            width: 100%; background: #1a1a2e; color: white; border: 1px solid #333;
            padding: 8px; border-radius: 4px; accent-color: var(--accent);
        }

        .btn-mode {
            padding: 10px; border: 1px solid var(--accent); background: transparent;
            color: var(--accent); cursor: pointer; transition: 0.3s; border-radius: 4px;
            font-weight: bold; margin-bottom: 5px;
        }
        .btn-mode.active { background: var(--accent); color: #000; }

        #density-graph { flex-grow: 1; padding: 10px; }

        .formula { font-style: italic; color: #888; font-size: 0.8rem; margin-top: 10px; }

        #hud {
            position: absolute; bottom: 20px; left: 20px; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="panel">
        <div class="header">Confinement Control</div>
        <div id="controls">
            <div class="control-group">
                <label>Select Structure</label>
                <button class="btn-mode" onclick="setMode('3D')">Bulk (3D)</button>
                <button class="btn-mode" onclick="setMode('2D')">Quantum Well (2D)</button>
                <button class="btn-mode" onclick="setMode('1D')">Quantum Wire (1D)</button>
                <button class="btn-mode active" onclick="setMode('0D')">Quantum Dot (0D)</button>
            </div>

            <div class="control-group">
                <label>Confinement Dimension (L): <span id="dim-readout">5.0</span> nm</label>
                <input type="range" id="size-slider" min="2" max="50" step="0.1" value="5">
            </div>

            <div class="control-group">
                <label>Material System</label>
                <select id="mat-select">
                    <option value="GaAs">GaAs (Gallium Arsenide)</option>
                    <option value="Si">Si (Silicon)</option>
                    <option value="InP">InP (Indium Phosphide)</option>
                    <option value="CdSe">CdSe (Cadmium Selenide)</option>
                </select>
            </div>
        </div>

        <div class="header" style="border-top: 1px solid rgba(255,255,255,0.1)">Density of States</div>
        <div id="density-graph">
            <canvas id="dosChart"></canvas>
        </div>
    </div>

    <div class="panel" id="main-viewport">
        <div class="header">Spatial Wavefunction & Probability Cloud</div>
        <div id="canvas-container"></div>
        <div id="hud">
            <div id="hud-dim">DIMENSIONALITY: 0D</div>
            <div id="hud-conf">CONFINEMENT: 3-AXIS</div>
        </div>
    </div>

    <div class="panel">
        <div class="header">Physics Dashboard</div>
        <div id="stats-content">
            <div class="stat-row"><span>Degrees of Freedom:</span> <span class="stat-val" id="val-dof">0</span></div>
            <div class="stat-row"><span>Effective Gap (Eg):</span> <span class="stat-val" id="val-eg">2.14 eV</span></div>
            <div class="stat-row"><span>Wavelength (λ):</span> <span class="stat-val" id="val-wl">580 nm</span></div>
            <div class="stat-row"><span>Confinement Energy:</span> <span class="stat-val" id="val-ec">0.42 eV</span></div>
            
            <div class="formula" id="formula-box">
                E<sub>n</sub> = h²n² / (8m*L²)
            </div>
        </div>

        <div class="header" style="border-top: 1px solid rgba(255,255,255,0.1)">Energy Band Diagram</div>
        <div style="flex-grow: 1; padding: 10px;">
            <canvas id="bandChart"></canvas>
        </div>
    </div>
</div>

<script>
    /** * PHYSICS DATA & CONSTANTS */
    const materials = {
        GaAs: { eg: 1.42, me: 0.067, color: 0xff3300 },
        Si: { eg: 1.12, me: 0.19, color: 0xaaaaaa },
        InP: { eg: 1.35, me: 0.08, color: 0x00ffcc },
        CdSe: { eg: 1.74, me: 0.13, color: 0xffcc00 }
    };

    let currentMode = '0D';
    let scene, camera, renderer, modelGroup, wavefunction;
    let dosChart, bandChart;

    /** * INITIALIZATION */
    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 40);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        handleResize();

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        modelGroup = new THREE.Group();
        scene.add(modelGroup);

        initCharts();
        updateSimulation();
        animate();
    }

    function initCharts() {
        // Density of States Chart
        const dosCtx = document.getElementById('dosChart').getContext('2d');
        dosChart = new Chart(dosCtx, {
            type: 'line',
            data: { labels: Array.from({length: 50}, (_, i) => i), datasets: [{ 
                label: 'ρ(E)', borderColor: '#00f2ff', data: [], fill: true, backgroundColor: 'rgba(0, 242, 255, 0.1)', tension: 0.1 
            }]},
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { beginAtZero: true } }, animation: false }
        });

        // Band Diagram Chart
        const bandCtx = document.getElementById('bandChart').getContext('2d');
        bandChart = new Chart(bandCtx, {
            type: 'scatter',
            data: { datasets: [
                { label: 'CB', backgroundColor: '#00f2ff', data: [] },
                { label: 'VB', backgroundColor: '#ff3300', data: [] }
            ]},
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { min: -1, max: 4 } }, animation: false }
        });
    }

    /** * SIMULATION ENGINE */
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.btn-mode').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(mode));
        });
        updateSimulation();
    }

    function updateSimulation() {
        const L = parseFloat(document.getElementById('size-slider').value);
        const matKey = document.getElementById('mat-select').value;
        const mat = materials[matKey];
        
        document.getElementById('dim-readout').innerText = L.toFixed(1);
        
        // Physics Calculations (Brus-like scaling)
        let dof = 0, confinementScale = 0;
        let formula = "";

        if(currentMode === '3D') { dof = 3; confinementScale = 0; formula = "ρ(E) ∝ √E (Bulk)"; }
        else if(currentMode === '2D') { dof = 2; confinementScale = 1; formula = "ρ(E) = Step Function"; }
        else if(currentMode === '1D') { dof = 1; confinementScale = 2; formula = "ρ(E) ∝ 1/√E"; }
        else if(currentMode === '0D') { dof = 0; confinementScale = 3; formula = "ρ(E) = δ-Function"; }

        const ec = (confinementScale * 12.5) / (mat.me * L * L); // Simplified units
        const egTotal = mat.eg + ec;
        const wavelength = 1240 / egTotal;

        document.getElementById('val-dof').innerText = dof;
        document.getElementById('val-eg').innerText = egTotal.toFixed(2) + " eV";
        document.getElementById('val-wl').innerText = Math.round(wavelength) + " nm";
        document.getElementById('val-ec').innerText = ec.toFixed(2) + " eV";
        document.getElementById('formula-box').innerHTML = formula;
        document.getElementById('hud-dim').innerText = `DIMENSIONALITY: ${currentMode}`;

        update3D(L, confinementScale, wavelength);
        updateDOS(currentMode);
        updateBands(egTotal, currentMode);
    }

    function update3D(L, conf, wl) {
        while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);

        const visualScale = L / 2;
        const color = new THREE.Color(`hsl(${Math.max(0, (wl-400)*0.6)}, 100%, 50%)`);

        let geom;
        if(currentMode === '0D') {
            geom = new THREE.SphereGeometry(visualScale, 32, 32);
        } else if(currentMode === '1D') {
            geom = new THREE.CylinderGeometry(2, 2, 40, 32);
            geom.rotateZ(Math.PI/2);
        } else if(currentMode === '2D') {
            geom = new THREE.BoxGeometry(40, visualScale, 40);
        } else {
            geom = new THREE.BoxGeometry(30, 30, 30);
        }

        const mat = new THREE.MeshPhongMaterial({ 
            color: color, transparent: true, opacity: 0.6, wireframe: false,
            emissive: color, emissiveIntensity: 0.5
        });
        const mesh = new THREE.Mesh(geom, mat);
        modelGroup.add(mesh);

        // Wavefunction visual (Inner core)
        const waveGeom = geom.clone();
        waveGeom.scale(0.8, 0.8, 0.8);
        const waveMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, wireframe: true });
        wavefunction = new THREE.Mesh(waveGeom, waveMat);
        modelGroup.add(wavefunction);
    }

    function updateDOS(mode) {
        let data = [];
        for(let i=0; i<50; i++) {
            let val = 0;
            if(mode === '3D') val = Math.sqrt(i);
            else if(mode === '2D') val = Math.floor(i/10) + 1;
            else if(mode === '1D') val = 1 / (Math.sqrt(i % 10) + 0.5) + Math.floor(i/10);
            else { val = (i % 12 === 0) ? 10 : 0; }
            data.push(val);
        }
        dosChart.data.datasets[0].data = data;
        dosChart.update();
    }

    function updateBands(eg, mode) {
        let cb = [], vb = [];
        if(mode === '0D') {
            for(let i=0; i<4; i++) {
                cb.push({x: 0, y: eg + i*0.5});
                vb.push({x: 0, y: -i*0.5});
            }
        } else {
            for(let i=-10; i<=10; i++) {
                cb.push({x: i, y: eg + (i*i)*0.01});
                vb.push({x: i, y: -(i*i)*0.01});
            }
        }
        bandChart.data.datasets[0].data = cb;
        bandChart.data.datasets[1].data = vb;
        bandChart.update();
    }

    /** * ANIMATION LOOP */
    function animate() {
        requestAnimationFrame(animate);
        if(modelGroup) {
            modelGroup.rotation.y += 0.005;
            if(wavefunction) {
                const s = 0.8 + Math.sin(Date.now() * 0.002) * 0.05;
                wavefunction.scale.set(s, s, s);
            }
        }
        renderer.render(scene, camera);
    }

    function handleResize() {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.addEventListener('resize', handleResize);
    document.getElementById('size-slider').oninput = updateSimulation;
    document.getElementById('mat-select').onchange = updateSimulation;

    init();
</script>
</body>
</html>
