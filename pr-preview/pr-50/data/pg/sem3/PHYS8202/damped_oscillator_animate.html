<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carlo Integration for π</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:#00e5ff;
}

.container{
    display:flex;
    gap:20px;
    margin-top:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.panel{
    background:#1d1d1d;
    padding:20px;
    border-radius:12px;
    width:320px;
}

canvas{
    background:white;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,255,255,.25);
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#00e5ff;
    font-weight:bold;
}

button:hover{
    background:#00c4dd;
}

.result{
    margin-top:15px;
    line-height:1.7;
}

.math{
    background:#252525;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
}
</style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>
<body>

<h1>Monte Carlo Integration Estimate of π</h1>

<div class="container">

<div class="panel">

<div class="math">
\[
\pi \approx 4\frac{N_{inside}}{N}
\]

where

\[
x^2+y^2 \le 1
\]

inside a unit quarter-circle.
</div>

<h3>Sample Size N (points)</h3>

<button onclick="runSimulation(100)">100</button>
<button onclick="runSimulation(1000)">1000</button>
<button onclick="runSimulation(10000)">10000</button>
<button onclick="runSimulation(100000)">100000</button>

<div class="result">
<p><b>N:</b> <span id="nVal">0</span> points</p>
<p><b>Points Inside:</b> <span id="insideVal">0</span></p>
<p><b>Estimated π:</b> <span id="piVal">0</span></p>
<p><b>True π:</b> 3.14159265359</p>
<p><b>Absolute Error:</b> <span id="errorVal">0</span></p>
</div>

</div>

<canvas id="canvas" width="600" height="600"></canvas>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

function drawBase(){

    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="white";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="black";
    ctx.lineWidth=2;
    ctx.strokeRect(0,0,W,H);

    ctx.beginPath();
    ctx.arc(0,H,H,Math.PI*1.5,Math.PI*2);
    ctx.strokeStyle="blue";
    ctx.lineWidth=3;
    ctx.stroke();
}

drawBase();

async function runSimulation(N){

    drawBase();

    let inside=0;

    let chunk = Math.max(10,Math.floor(N/100));

    for(let i=0;i<N;i++){

        let x=Math.random();
        let y=Math.random();

        let r2=x*x+y*y;

        if(r2<=1){
            inside++;

            ctx.fillStyle="limegreen";
        }
        else{
            ctx.fillStyle="crimson";
        }

        ctx.fillRect(
            x*W,
            H-(y*H),
            2,
            2
        );

        if(i % chunk === 0){

            let piEstimate = 4*inside/(i+1);

            document.getElementById("nVal").textContent=(i+1);
            document.getElementById("insideVal").textContent=inside;
            document.getElementById("piVal").textContent=
                piEstimate.toFixed(8);

            document.getElementById("errorVal").textContent=
                Math.abs(Math.PI-piEstimate).toFixed(8);

            await new Promise(r=>setTimeout(r,1));
        }
    }

    let piEstimate = 4*inside/N;

    document.getElementById("nVal").textContent=N;
    document.getElementById("insideVal").textContent=inside;
    document.getElementById("piVal").textContent=
        piEstimate.toFixed(10);

    document.getElementById("errorVal").textContent=
        Math.abs(Math.PI-piEstimate).toFixed(10);
}

drawBase();

</script>

</body>
</html>
