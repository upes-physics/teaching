<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase Space: Simple Harmonic Oscillator Ensemble</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            overflow: hidden; /* Prevent scrolling, full app view */
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.85); /* Slate 800 with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #090e17; /* Deep space background */
        }

        /* Custom scrollbar for the control panel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen">

    <!-- Control Panel -->
    <aside class="glass-panel w-full md:w-80 h-auto md:h-full z-10 flex flex-col shadow-2xl shrink-0 overflow-y-auto">
        <div class="p-6 flex-1 flex flex-col gap-6">
            
            <!-- Header -->
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400 tracking-tight">Phase Space</h1>
                <p class="text-sm text-slate-400 mt-1">Simple Harmonic Oscillator</p>
            </div>

            <!-- Stats -->
            <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Time (t)</span>
                    <span id="timeDisplay" class="font-mono text-pink-400 font-bold">0.00</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm font-medium">Active Particles</span>
                    <span id="particleCountDisplay" class="font-mono text-purple-400 font-bold">10,000</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-5">
                <!-- ND Selector -->
                <div class="space-y-2">
                    <label for="ndSelect" class="block text-sm font-semibold text-slate-300">Ensemble Size (N)</label>
                    <select id="ndSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all">
                        <option value="100">100 (Sparse)</option>
                        <option value="1000">1,000</option>
                        <option value="10000" selected>10,000 (Dense)</option>
                        <option value="100000">100,000 (Fluid)</option>
                        <option value="1000000">1,000,000 (Intensive)</option>
                    </select>
                </div>

                <!-- Simulation Speed -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label for="speedSlider" class="block text-sm font-semibold text-slate-300">Simulation Speed</label>
                        <span id="speedDisplay" class="text-xs text-slate-400 font-mono">1.0x</span>
                    </div>
                    <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1" class="w-full accent-purple-500">
                </div>

                <!-- Frequency Ranges -->
                <div class="space-y-4 pt-4 border-t border-slate-700">
                    <label class="block text-sm font-semibold text-slate-300">Natural Frequency (&omega;)</label>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <span class="text-xs text-slate-400">Minimum &omega;</span>
                            <span id="wMinDisplay" class="text-xs font-mono text-pink-400">0.50</span>
                        </div>
                        <input type="range" id="wMinSlider" min="0.10" max="3.90" step="0.05" value="0.50" class="w-full accent-pink-500">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <span class="text-xs text-slate-400">Maximum &omega;</span>
                            <span id="wMaxDisplay" class="text-xs font-mono text-pink-400">2.00</span>
                        </div>
                        <input type="range" id="wMaxSlider" min="0.20" max="4.00" step="0.05" value="2.00" class="w-full accent-pink-500">
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-auto pt-6 flex gap-3">
                <button id="playPauseBtn" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors shadow-lg shadow-purple-500/30">
                    Pause
                </button>
                <button id="resetBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors border border-slate-600">
                    Reset
                </button>
            </div>
            
            <div class="text-xs text-slate-500 text-center leading-relaxed">
                Equation: d²x/dt² + &omega;²x = 0<br>
                No Damping / No Friction
            </div>
        </div>
    </aside>

    <!-- Simulation Canvas Area -->
    <main class="relative flex-1 overflow-hidden">
        <canvas id="simCanvas"></canvas>
        
        <!-- Axis Labels overlaid on canvas -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 text-slate-400 text-xs font-mono tracking-widest uppercase bg-slate-900/50 px-2 py-1 rounded">Velocity (v)</div>
        <div class="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 text-xs font-mono tracking-widest uppercase rotate-90 origin-right bg-slate-900/50 px-2 py-1 rounded">Position (x)</div>
    </main>

    <script>
        // DOM Elements
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const ndSelect = document.getElementById('ndSelect');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const wMinSlider = document.getElementById('wMinSlider');
        const wMaxSlider = document.getElementById('wMaxSlider');
        const wMinDisplay = document.getElementById('wMinDisplay');
        const wMaxDisplay = document.getElementById('wMaxDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const particleCountDisplay = document.getElementById('particleCountDisplay');

        // Physics Constants & State
        let w_min = 0.50;
        let w_max = 2.00;
        const x0 = 1.0; // Initial displacement
        
        let N_D = 10000;
        let t = 0;
        let dt = 0.02; // Base time step
        let speedMult = 1.0;
        let isPlaying = true;
        let animationId;

        // Pre-allocated array for frequencies for extreme performance
        let omegas;

        // Rendering configuration
        let canvasWidth, canvasHeight;
        let scaleX, scaleV; 
        let originX, originY;

        // Resize canvas correctly for high-DPI displays
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            
            canvasWidth = rect.width;
            canvasHeight = rect.height;
            
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            
            ctx.scale(dpr, dpr);
            
            originX = canvasWidth / 2;
            originY = canvasHeight / 2;
            
            // Scale dynamically based on window size
            const minDimension = Math.min(canvasWidth, canvasHeight);
            scaleX = minDimension / 2.5; 
            scaleV = minDimension / 5.0; // Scale velocity down to fit larger ellipses
            
            if (!isPlaying) drawFrame();
        }

        window.addEventListener('resize', resize);

        // Initialize particle array
        function initEnsemble() {
            N_D = parseInt(ndSelect.value);
            particleCountDisplay.innerText = N_D.toLocaleString();
            
            omegas = new Float32Array(N_D);

            // Populate frequencies linearly between min and max
            const dw = N_D > 1 ? (w_max - w_min) / (N_D - 1) : 0;
            for (let i = 0; i < N_D; i++) {
                omegas[i] = w_min + (i * dw);
            }
        }

        // Main Drawing Function
        function drawFrame() {
            // 1. Clear Background
            ctx.fillStyle = '#090e17';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // 2. Draw Grid and Axes
            ctx.strokeStyle = '#1e293b'; // Slate 800
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            // Vertical & Horizontal Grid
            for(let x = -1.5; x <= 1.5; x += 0.5) {
                let px = originX + x * scaleX;
                ctx.moveTo(px, 0); ctx.lineTo(px, canvasHeight);
            }
            for(let y = -3.0; y <= 3.0; y += 1.0) {
                let py = originY - y * scaleV; 
                ctx.moveTo(0, py); ctx.lineTo(canvasWidth, py);
            }
            ctx.stroke();

            // Main Axes
            ctx.strokeStyle = '#334155'; // Slate 700
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(originX, 0); ctx.lineTo(originX, canvasHeight);
            ctx.moveTo(0, originY); ctx.lineTo(canvasWidth, originY);
            ctx.stroke();

            // 3. Draw Particles
            let pSize = 1.5;
            let alpha = 0.8;
            
            // Adjust visual density based on count
            if (N_D > 1000) { pSize = 1.0; alpha = 0.4; }
            if (N_D >= 100000) { pSize = 0.8; alpha = 0.05; }

            ctx.fillStyle = `rgba(168, 85, 247, ${alpha})`; // Purple 500
            ctx.beginPath();

            // High-speed batch rendering loop
            for (let i = 0; i < N_D; i++) {
                let w = omegas[i];
                
                // Kinematics for SHO: x(t) = x0*cos(wt), v(t) = -x0*w*sin(wt)
                let px = x0 * Math.cos(w * t);
                let pv = -x0 * w * Math.sin(w * t);
                
                // Screen mapping
                let screenX = originX + px * scaleX;
                let screenY = originY - pv * scaleV;

                ctx.rect(screenX, screenY, pSize, pSize);
            }
            ctx.fill();

            // Update Time UI
            timeDisplay.innerText = t.toFixed(2);
        }

        // Simulation Loop
        function loop() {
            if (isPlaying) {
                drawFrame();
                t += dt * speedMult;
            }
            animationId = requestAnimationFrame(loop);
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseBtn.innerText = isPlaying ? "Pause" : "Play";
            playPauseBtn.className = isPlaying 
                ? "flex-1 bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors shadow-lg shadow-purple-500/30"
                : "flex-1 bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors shadow-lg shadow-pink-500/30";
        });

        resetBtn.addEventListener('click', () => {
            t = 0;
            if (!isPlaying) drawFrame(); 
        });

        ndSelect.addEventListener('change', () => {
            initEnsemble();
            t = 0; 
            if (!isPlaying) drawFrame();
        });

        speedSlider.addEventListener('input', (e) => {
            speedMult = parseFloat(e.target.value);
            speedDisplay.innerText = speedMult.toFixed(1) + 'x';
        });

        function updateFrequencyRange(e) {
            let minVal = parseFloat(wMinSlider.value);
            let maxVal = parseFloat(wMaxSlider.value);
            
            // Prevent crossover
            if (minVal > maxVal) {
                if (e.target.id === 'wMinSlider') {
                    wMaxSlider.value = minVal;
                    maxVal = minVal;
                } else {
                    wMinSlider.value = maxVal;
                    minVal = maxVal;
                }
            }
            
            w_min = minVal;
            w_max = maxVal;
            
            wMinDisplay.innerText = w_min.toFixed(2);
            wMaxDisplay.innerText = w_max.toFixed(2);
            
            initEnsemble();
            if (!isPlaying) drawFrame();
        }

        wMinSlider.addEventListener('input', updateFrequencyRange);
        wMaxSlider.addEventListener('input', updateFrequencyRange);

        // Boot up
        initEnsemble();
        resize();
        loop();

    </script>
</body>
</html>
