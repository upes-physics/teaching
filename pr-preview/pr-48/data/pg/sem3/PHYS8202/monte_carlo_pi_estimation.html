<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Integration: Estimating Pi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        #sidebar { 
            width: 320px; 
            background: #1e293b; 
            padding: 25px; 
            box-shadow: 2px 0 15px rgba(0,0,0,0.5); 
            z-index: 10; 
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }
        #canvas-container { 
            flex-grow: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #020617;
            position: relative;
        }
        canvas {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h2 { margin-top: 0; font-size: 1.4rem; color: #38bdf8; }
        .equation { 
            background: #0f172a; 
            padding: 15px; 
            border-radius: 6px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 1rem; 
            text-align: center; 
            margin-bottom: 25px; 
            color: #facc15;
            border: 1px solid #334155;
        }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; color: #cbd5e1; }
        select, input[type="range"] { 
            width: 100%; 
            padding: 8px;
            border-radius: 4px;
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            cursor: pointer;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            border-radius: 6px; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s; 
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        
        .stats-box {
            margin-top: auto;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .stat-value { font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        .val-inside { color: #4ade80; }
        .val-total { color: #f8fafc; }
        .val-pi { color: #facc15; font-size: 1.4rem; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Monte Carlo Integration</h2>
    <div class="equation">
        Area = ∫∫ dx dy<br>
        π ≈ 4 × (N_inside / N_total)
    </div>
    
    <div class="control-group">
        <label for="n-select">Total Points (N):</label>
        <select id="n-select">
            <option value="100">100</option>
            <option value="1000">1,000</option>
            <option value="10000">10,000</option>
            <option value="100000" selected>100,000</option>
        </select>
    </div>

    <div class="control-group">
        <label>Animation Speed: <span id="speed-val" style="float:right; color:#38bdf8;">Fast</span></label>
        <input type="range" id="speed-slider" min="1" max="5" step="1" value="4">
    </div>

    <button id="start-btn">Start Simulation</button>
    <button id="reset-btn" style="background:#475569; color:#fff;">Reset Canvas</button>

    <div class="stats-box">
        <div class="stat-row">
            <span>Points Inside:</span>
            <span class="stat-value val-inside" id="stat-inside">0</span>
        </div>
        <div class="stat-row">
            <span>Total Points:</span>
            <span class="stat-value val-total" id="stat-total">0</span>
        </div>
        <div class="stat-row" style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
            <span>Estimated π:</span>
            <span class="stat-value val-pi" id="stat-pi">0.00000</span>
        </div>
        <div class="stat-row" style="margin-top: 5px; font-size: 0.8rem; color: #94a3b8;">
            <span>Actual π:</span>
            <span>3.14159...</span>
        </div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="simCanvas" width="700" height="700"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    const width = canvas.width;
    const height = canvas.height;
    const cx = width / 2;
    const cy = height / 2;
    
    // Padding around the drawing area
    const padding = 20;
    // Radius of the circle (and half-width of the square) in pixels
    const r = (width / 2) - padding;

    // UI Elements
    const nSelect = document.getElementById('n-select');
    const speedSlider = document.getElementById('speed-slider');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    
    const statInside = document.getElementById('stat-inside');
    const statTotal = document.getElementById('stat-total');
    const statPi = document.getElementById('stat-pi');
    const speedLabels = ["Very Slow", "Slow", "Medium", "Fast", "Instant"];

    // Simulation State
    let animationId = null;
    let targetN = parseInt(nSelect.value);
    let pointsDrawn = 0;
    let pointsInside = 0;
    let isRunning = false;

    // Draw the static background, axes, and bounds
    function drawBackground() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        // Draw Square Bounds [-1, 1] x [-1, 1]
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);

        // Draw Coordinate Axes
        ctx.strokeStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); // X-axis
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); // Y-axis
        ctx.stroke();

        // Draw Unit Circle Boundary
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.stroke();
    }

    function updateStats() {
        statInside.innerText = pointsInside.toLocaleString();
        statTotal.innerText = pointsDrawn.toLocaleString();
        
        if (pointsDrawn > 0) {
            const piEstimate = 4 * (pointsInside / pointsDrawn);
            statPi.innerText = piEstimate.toFixed(5);
        } else {
            statPi.innerText = "0.00000";
        }
    }

    function resetSimulation() {
        if (animationId) cancelAnimationFrame(animationId);
        isRunning = false;
        pointsDrawn = 0;
        pointsInside = 0;
        startBtn.disabled = false;
        drawBackground();
        updateStats();
    }

    function animate() {
        if (!isRunning) return;

        let speedLevel = parseInt(speedSlider.value);
        let batchSize = 1;

        // Scale the batch size based on target N to ensure it finishes in a reasonable time
        if (speedLevel === 1) batchSize = Math.max(1, Math.floor(targetN / 1000));
        else if (speedLevel === 2) batchSize = Math.max(5, Math.floor(targetN / 500));
        else if (speedLevel === 3) batchSize = Math.max(20, Math.floor(targetN / 100));
        else if (speedLevel === 4) batchSize = Math.max(100, Math.floor(targetN / 20));
        else if (speedLevel === 5) batchSize = targetN; // Draw all remaining at once

        for (let i = 0; i < batchSize && pointsDrawn < targetN; i++) {
            // Generate random x, y in range [-1, 1]
            let px = (Math.random() * 2) - 1;
            let py = (Math.random() * 2) - 1;
            
            // Check if point is inside the unit circle
            let inside = (px * px + py * py) <= 1.0;
            if (inside) {
                pointsInside++;
            }

            // Convert to canvas coordinates
            let canvasX = cx + px * r;
            let canvasY = cy - py * r; // Invert Y for standard Cartesian plane

            // Draw the point
            ctx.fillStyle = inside ? '#4ade80' : '#f87171';
            
            // Adjust point size based on total points for better visibility
            let pointSize = targetN > 10000 ? 1 : 2.5;
            
            // Use arc for larger dots, raw fillRect for speed on high N
            if (pointSize > 1) {
                ctx.beginPath();
                ctx.arc(canvasX, canvasY, pointSize, 0, 2 * Math.PI);
                ctx.fill();
            } else {
                ctx.fillRect(canvasX, canvasY, 1, 1);
            }
            
            pointsDrawn++;
        }

        updateStats();

        if (pointsDrawn < targetN) {
            animationId = requestAnimationFrame(animate);
        } else {
            isRunning = false;
            startBtn.disabled = false;
        }
    }

    // Event Listeners
    startBtn.addEventListener('click', () => {
        if (pointsDrawn >= targetN) resetSimulation();
        targetN = parseInt(nSelect.value);
        isRunning = true;
        startBtn.disabled = true;
        animate();
    });

    resetBtn.addEventListener('click', resetSimulation);

    nSelect.addEventListener('change', () => {
        targetN = parseInt(nSelect.value);
        if(!isRunning) resetSimulation();
    });

    speedSlider.addEventListener('input', (e) => {
        document.getElementById('speed-val').innerText = speedLabels[parseInt(e.target.value) - 1];
    });

    // Initialize Canvas
    drawBackground();
</script>
</body>
</html>
