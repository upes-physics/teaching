# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - "!gh-pages/**"
    - "!pr-preview/**"

  path_instructions:
    - path: "**/*.js"
      instructions: |
        Focus on runtime errors, invalid syntax, broken DOM selectors, unsafe innerHTML usage,
        incorrect event handling, and relative URL behavior under both the production site and
        nested pr-preview/pr-N paths. Suggest the smallest safe patch and avoid unrelated refactoring.

    - path: "**/*.html"
      instructions: |
        Check paired and correctly nested tags, valid document structure, accessibility basics,
        working relative asset paths, and compatibility with GitHub Pages subdirectory previews.
        Provide an exact suggested change when a markup correction is clear.

    - path: "**/*.json"
      instructions: |
        Check valid JSON syntax and consistency of course data cards. Verify local simulator links
        resolve relative to the datacard.json location and identify missing or misspelled files.

    - path: ".github/workflows/**"
      instructions: |
        Review permissions using least privilege, preserve merge-blocking behavior, pin third-party
        actions to immutable commits where practical, and ensure production and PR preview jobs do
        not overwrite each other's gh-pages content.

  finishing_touches:
    fix_ci:
      enabled: false

chat:
  auto_reply: true
