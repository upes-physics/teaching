<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Transport Explorer | Advanced Physics Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --sidebar: rgba(13, 17, 23, 0.95);
            --accent: #00f2ff;
            --panel-border: #30363d;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            grid-template-rows: 1fr 320px;
            height: 100vh; gap: 8px; padding: 8px; box-sizing: border-box;
        }

        .panel {
            background: var(--sidebar);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }

        .panel-header {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--panel-border);
            font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--accent);
            display: flex; justify-content: space-between;
        }

        /* 3D Viewport */
        #viewport { grid-column: 2; grid-row: 1; }
        #canvas-3d { width: 100%; height: 100%; cursor: crosshair; }

        /* Sidebar Controls */
        #controls { grid-column: 1; grid-row: 1 / 3; padding: 16px; overflow-y: auto; }
        
        .control-item { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-dim); }
        
        select, input[type=range] {
            width: 100%; background: #0d1117; color: #fff; border: 1px solid var(--panel-border);
            padding: 8px; border-radius: 6px; accent-color: var(--accent);
        }

        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mode-btn {
            padding: 10px; background: #21262d; border: 1px solid var(--panel-border);
            color: #fff; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s;
        }
        .mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

        /* Dashboard */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .stat-card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; border: 1px solid var(--panel-border); }
        .stat-label { font-size: 0.65rem; color: var(--text-dim); display: block; margin-bottom: 4px; }
        .stat-val { font-size: 1rem; color: var(--accent); font-family: 'SFMono-Regular', Consolas, monospace; }

        /* Charts */
        #charts { grid-column: 2; grid-row: 2; padding: 12px; }

        #hud {
            position: absolute; bottom: 20px; left: 20px; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="layout">
    <div class="panel" id="controls">
        <div class="panel-header">Physics Engine Config</div>
        
        <div class="control-item">
            <label>Confinement Geometry</label>
            <div class="button-grid">
                <button class="mode-btn" onclick="app.setGeom('3D')">Bulk</button>
                <button class="mode-btn" onclick="app.setGeom('2D')">Well</button>
                <button class="mode-btn" onclick="app.setGeom('1D')">Wire</button>
                <button class="mode-btn active" onclick="app.setGeom('0D')">Dot</button>
            </div>
        </div>

        <div class="control-item">
            <label>Material System</label>
            <select id="mat-select" onchange="app.updatePhysics()">
                <option value="GaAs">GaAs (Gallium Arsenide)</option>
                <option value="Si">Silicon (Si)</option>
                <option value="InP">InP (Indium Phosphide)</option>
            </select>
        </div>

        <div class="control-item">
            <label>Channel Length (L): <span id="l-readout">10</span> nm</label>
            <input type="range" id="l-slider" min="2" max="50" step="1" value="10" oninput="app.updatePhysics()">
        </div>

        <div class="control-item">
            <label>Applied Bias: <span id="v-readout">0.1</span> V</label>
            <input type="range" id="v-slider" min="0" max="1" step="0.01" value="0.1" oninput="app.updatePhysics()">
        </div>

        <div class="panel-header">Live Output</div>
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-label">Effective Mass</span><span class="stat-val" id="st-me">0.067 m₀</span></div>
            <div class="stat-card"><span class="stat-label">Fermi Energy</span><span class="stat-val" id="st-ef">24 meV</span></div>
            <div class="stat-card"><span class="stat-label">Conductance</span><span class="stat-val" id="st-g">2 G₀</span></div>
            <div class="stat-card"><span class="stat-label">Transmission</span><span class="stat-val" id="st-t">0.98</span></div>
        </div>
    </div>

    <div class="panel" id="viewport">
        <div class="panel-header">Wavefunction Propagator</div>
        <canvas id="canvas-3d"></canvas>
        <div id="hud">
            <div style="font-size: 1.5rem; font-weight: 800; color: #fff;" id="hud-title">Quantum Dot Array</div>
            <div style="color: var(--accent); font-size: 0.9rem;" id="hud-desc">Quantized Conductance Regime</div>
        </div>
    </div>

    <div class="panel" id="charts">
        <div class="panel-header">Transport Characteristics</div>
        <div style="height: 100%; width: 100%;">
            <canvas id="transportChart"></canvas>
        </div>
    </div>
</div>

<script>
    /**
     * SIMULATOR CORE
     */
    const app = {
        materials: {
            GaAs: { me: 0.067, eg: 1.42, color: 0x00f2ff },
            Si: { me: 1.08, eg: 1.12, color: 0x8b949e },
            InP: { me: 0.08, eg: 1.34, color: 0x3fb950 }
        },
        currentGeom: '0D',
        scene: null,
        camera: null,
        renderer: null,
        objects: [],
        chart: null,

        init() {
            this.initThree();
            this.initChart();
            this.updatePhysics();
            this.animate();
            window.addEventListener('resize', () => this.onResize());
        },

        initThree() {
            const canvas = document.getElementById('canvas-3d');
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            this.camera.position.set(20, 15, 25);
            this.camera.lookAt(0, 0, 0);

            this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            this.renderer.setSize(canvas.clientWidth, canvas.clientHeight);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7.5);
            this.scene.add(light);
            this.scene.add(new THREE.AmbientLight(0x404040));
            
            this.group = new THREE.Group();
            this.scene.add(this.group);
        },

        setGeom(type) {
            this.currentGeom = type;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(type));
            });
            
            const titles = { '3D': 'Bulk Semiconductor', '2D': 'Quantum Well', '1D': 'Quantum Wire', '0D': 'Quantum Dot' };
            document.getElementById('hud-title').innerText = titles[type];
            this.updatePhysics();
        },

        updatePhysics() {
            const mKey = document.getElementById('mat-select').value;
            const mat = this.materials[mKey];
            const L = parseFloat(document.getElementById('l-slider').value);
            const V = parseFloat(document.getElementById('v-slider').value);

            document.getElementById('l-readout').innerText = L;
            document.getElementById('v-readout').innerText = V;

            // Simple Physics Calcs
            const h_bar = 6.582e-16; // eV*s
            const m0 = 0.511e6; // eV/c^2
            const ef = (Math.pow(h_bar * Math.PI, 2) / (2 * mat.me * m0 * Math.pow(L * 1e-9, 2))) * 1e3; // meV
            const conductance = Math.floor(25 / L) + 1;

            document.getElementById('st-me').innerText = `${mat.me} m₀`;
            document.getElementById('st-ef').innerText = `${ef.toFixed(1)} meV`;
            document.getElementById('st-g').innerText = `${conductance} G₀`;

            this.update3D(mat, L);
            this.updateChart(conductance);
        },

        update3D(mat, L) {
            while(this.group.children.length > 0) this.group.remove(this.group.children[0]);
            
            const geometry = new THREE.SphereGeometry(0.4, 16, 16);
            const material = new THREE.MeshPhongMaterial({ color: mat.color, emissive: mat.color, emissiveIntensity: 0.2 });

            const spacing = 2;
            const count = Math.min(L / 2, 10);

            if(this.currentGeom === '3D') {
                for(let x=-2; x<=2; x++) for(let y=-2; y<=2; y++) for(let z=-2; z<=2; z++) {
                    const m = new THREE.Mesh(geometry, material);
                    m.position.set(x*spacing, y*spacing, z*spacing);
                    this.group.add(m);
                }
            } else if(this.currentGeom === '2D') {
                for(let x=-4; x<=4; x++) for(let z=-4; z<=4; z++) {
                    const m = new THREE.Mesh(geometry, material);
                    m.position.set(x*spacing, 0, z*spacing);
                    this.group.add(m);
                }
            } else if(this.currentGeom === '1D') {
                for(let x=-count; x<=count; x++) {
                    const m = new THREE.Mesh(geometry, material);
                    m.position.set(x*spacing, 0, 0);
                    this.group.add(m);
                }
            } else {
                const m = new THREE.Mesh(new THREE.SphereGeometry(spacing, 32, 32), material);
                this.group.add(m);
            }
        },

        initChart() {
            const ctx = document.getElementById('transportChart').getContext('2d');
            this.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 50}, (_, i) => i),
                    datasets: [{
                        label: 'Conductance (G/G₀)',
                        borderColor: '#00f2ff',
                        data: [],
                        stepped: true,
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        x: { grid: { color: '#30363d' }, ticks: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        },

        updateChart(g) {
            const data = Array.from({length: 50}, (_, i) => Math.floor(i / (60/g)));
            this.chart.data.datasets[0].data = data;
            this.chart.update();
        },

        animate() {
            requestAnimationFrame(() => this.animate());
            this.group.rotation.y += 0.005;
            this.renderer.render(this.scene, this.camera);
        },

        onResize() {
            const canvas = document.getElementById('canvas-3d');
            this.camera.aspect = canvas.clientWidth / canvas.clientHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }
    };

    app.init();
</script>
</body>
</html>
