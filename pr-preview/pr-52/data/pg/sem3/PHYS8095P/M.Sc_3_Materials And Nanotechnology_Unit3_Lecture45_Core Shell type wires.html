<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core–Shell Quantum Wire Transport Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #050509;
            --panel-bg: rgba(10, 10, 20, 0.9);
            --accent-cyan: #00f2ff;
            --electron-blue: #0077ff;
            --hole-red: #ff3333;
            --text-main: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        #app-container {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            height: 100vh; gap: 8px; padding: 8px; box-sizing: border-box;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .panel-header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--accent-cyan);
        }

        /* Center Panel - 3D Viewport */
        #viewport-3d { grid-column: 2; position: relative; }
        #canvas-container { width: 100%; height: 100%; cursor: move; }
        
        #hud-display {
            position: absolute; bottom: 20px; left: 20px; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px;
        }

        /* Sidebar - Controls */
        #sidebar-controls { grid-column: 1; padding: 15px; gap: 15px; overflow-y: auto; }
        .control-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 8px; opacity: 0.8; }
        
        select, input[type=range] {
            width: 100%; background: #111; color: #fff; border: 1px solid #333;
            padding: 8px; border-radius: 4px; accent-color: var(--accent-cyan);
        }

        .btn-mode {
            width: 100%; padding: 10px; margin-bottom: 5px; cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff;
            border-radius: 4px; transition: 0.3s; font-size: 0.85rem;
        }
        .btn-mode:hover { background: rgba(0, 242, 255, 0.1); border-color: var(--accent-cyan); }
        .btn-mode.active { background: var(--accent-cyan); color: #000; font-weight: bold; border-color: var(--accent-cyan); }

        /* Data Panel - Graphs & Stats */
        #data-panel { grid-column: 3; gap: 10px; padding: 10px; }
        #band-chart-container { height: 280px; width: 100%; border-radius: 4px; background: #000; overflow: hidden; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: monospace; font-size: 0.85rem; }
        .stat-item { background: #080810; padding: 8px; border-radius: 4px; border: 1px solid #1a1a2a; }
        .stat-label { color: #888; display: block; margin-bottom: 2px; }
        .stat-value { color: var(--accent-cyan); font-weight: bold; }

        #formula-display { margin-top: 10px; padding: 10px; background: #000; border-radius: 4px; font-size: 0.8rem; color: #aaa; font-style: italic;}
    </style>
</head>
<body>

<div id="app-container">
    <div class="panel" id="sidebar-controls">
        <div class="panel-header">System Parameters</div>
        
        <div class="control-group">
            <label>Heterostructure System</label>
            <select id="mat-select" onchange="updateSystem()">
                <option value="GaAs_AlGaAs">GaAs Core / AlGaAs Shell (Type-I)</option>
                <option value="Si_Ge">Si Core / Ge Shell (Type-II)</option>
                <option value="InP_InGaP">InP Core / InGaP Shell (Type-I)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Physics Regime</label>
            <button class="btn-mode active" onclick="setRegime('drift')">Diffusive Drift (Classical)</button>
            <button class="btn-mode" onclick="setRegime('ballistic')">Ballistic Transport (Quantum)</button>
        </div>

        <div class="control-group">
            <label>Core Diameter (d_c): <span id="val-dc">8.0</span> nm</label>
            <input type="range" id="dc-slider" min="2" max="20" step="0.5" value="8">
        </div>

        <div class="control-group">
            <label>Shell Thickness (t_s): <span id="val-ts">4.0</span> nm</label>
            <input type="range" id="ts-slider" min="1" max="15" step="0.5" value="4">
        </div>

        <div class="control-group">
            <label>Applied Axis Bias (V/μm): <span id="val-bias">0.5</span></label>
            <input type="range" id="bias-slider" min="0" max="5" step="0.1" value="0.5">
        </div>
    </div>

    <div class="panel" id="viewport-3d">
        <div class="panel-header">3D Core–Shell Wire Morphology</div>
        <div id="canvas-container"></div>
        <div id="hud-display">
            <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent-cyan);" id="hud-mat">GaAs / AlGaAs</div>
            <div style="font-size: 0.8rem; opacity: 0.8;" id="hud-align">Alignment: Type-I</div>
        </div>
    </div>

    <div class="panel" id="data-panel">
        <div class="panel-header">Electronic Data & Band Diagram</div>
        <div id="band-chart-container">
            <canvas id="bandChart"></canvas>
        </div>
        
        <div class="stat-grid">
            <div class="stat-item"><span class="stat-label">Core Gap (Eg,c)</span><span class="stat-value" id="res-egc">1.42 eV</span></div>
            <div class="stat-item"><span class="stat-label">Shell Gap (Eg,s)</span><span class="stat-value" id="res-egs">1.85 eV</span></div>
            <div class="stat-item"><span class="stat-label">CBO (ΔEc)</span><span class="stat-value" id="res-cbo">0.32 eV</span></div>
            <div class="stat-item"><span class="stat-label">VBO (ΔEv)</span><span class="stat-value" id="res-vbo">0.11 eV</span></div>
            <div class="stat-item"><span class="stat-label">Current (I_ds)</span><span class="stat-value" id="res-current">42.5 μA</span></div>
            <div class="stat-item"><span class="stat-label">Separation</span><span class="stat-value" id="res-sep">Low</span></div>
        </div>
        
        <div id="formula-display">
            Type-I Confinement: Electrons & Holes co-localized in Core.
        </div>
    </div>
</div>

<script>
    /** * PHYSICS DATA & MODELS
     */
    const systems = {
        GaAs_AlGaAs: { name: "GaAs / AlGaAs", align: "Type-I", egc: 1.42, egs: 1.85, cbo: 0.32, vbo: 0.11, mu_e: 8500, mu_h: 400, colorC: 0x00ffcc, colorS: 0xaa88ff },
        Si_Ge: { name: "Si / Ge", align: "Type-II", egc: 1.12, egs: 0.66, cbo: 0.05, vbo: 0.51, mu_e: 1400, mu_h: 1900, colorC: 0x555577, colorS: 0xcccc00 },
        InP_InGaP: { name: "InP / InGaP", align: "Type-I", egc: 1.35, egs: 1.89, cbo: 0.24, vbo: 0.30, mu_e: 5400, mu_h: 200, colorC: 0xffcc00, colorS: 0xffaa88 }
    };

    let scene, camera, renderer, wireCore, wireShell, electrons = [], holes = [];
    let bandChart, currentRegime = 'drift';

    /** * INITIALIZATION
     */
    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(30, 20, 50);
        camera.lookAt(0,0,0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(20, 30, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        initCharts();
        updateSystem(true);
        animate();
    }

    function buildNanowire(dc, ts, mat) {
        if(wireCore) scene.remove(wireCore);
        if(wireShell) scene.remove(wireShell);

        const L = 60; // Wire Length visual scaling
        const r_c = dc / 2;
        const r_s = r_c + ts;

        // Core Geometry
        const coreGeo = new THREE.CylinderGeometry(r_c, r_c, L, 32, 1, false);
        const coreMat = new THREE.MeshPhongMaterial({ color: mat.colorC, transparent: true, opacity: 0.8, shininess: 50 });
        wireCore = new THREE.Mesh(coreGeo, coreMat);
        wireCore.rotation.z = Math.PI / 2;
        scene.add(wireCore);

        // Shell Geometry
        const shellGeo = new THREE.CylinderGeometry(r_s, r_s, L, 32, 1, false);
        // Using stencil or boolean would be better, but simpler transparent approach here
        const shellMat = new THREE.MeshPhongMaterial({ color: mat.colorS, transparent: true, opacity: 0.3, side: THREE.DoubleSide, shininess: 10 });
        wireShell = new THREE.Mesh(shellGeo, shellMat);
        wireShell.rotation.z = Math.PI / 2;
        scene.add(wireShell);

        updateCarriers(countCarriers(dc, ts, mat));
    }

    /** * CARRIER DYNAMICS
     */
    function countCarriers(dc, ts, mat) {
        // Simple scaling model: volume-dependent carrier count
        const volC = Math.PI * Math.pow(dc/2, 2) * 60;
        const volS = Math.PI * (Math.pow((dc/2+ts), 2) - Math.pow(dc/2, 2)) * 60;
        return {
            ne: Math.ceil(volC * 0.005 + volS * 0.001), // assume n-doping primarily in core
            nh: Math.ceil(volC * 0.001 + volS * 0.003)
        };
    }

    function updateCarriers(counts) {
        electrons.forEach(e => scene.remove(e));
        holes.forEach(h => scene.remove(h));
        electrons = []; holes = [];

        const eGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const eMat = new THREE.MeshBasicMaterial({ color: 0x0077ff, transparent: true, opacity: 0.8 });
        
        for(let i=0; i<counts.ne; i++) {
            const e = new THREE.Mesh(eGeo, eMat);
            resetCarrier(e, 'e');
            scene.add(e);
            electrons.push(e);
        }

        const hGeo = new THREE.SphereGeometry(0.18, 8, 8);
        const hMat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.8 });
        
        for(let i=0; i<counts.nh; i++) {
            const h = new THREE.Mesh(hGeo, hMat);
            resetCarrier(h, 'h');
            scene.add(h);
            holes.push(h);
        }
    }

    function resetCarrier(c, type) {
        const dc = parseFloat(document.getElementById('dc-slider').value);
        const ts = parseFloat(document.getElementById('ts-slider').value);
        const mat = systems[document.getElementById('mat-select').value];
        const L = 30; // Half-length visual

        let r_limit;
        if(mat.align === "Type-I") {
            // Type-I: Everything prefers core
            r_limit = (type === 'e') ? (dc/2 * 0.9) : (dc/2 * 0.8);
        } else {
            // Type-II Si/Ge: Electrons -> Core (Si), Holes -> Shell (Ge)
            r_limit = (type === 'e') ? (dc/2 * 0.9) : (dc/2 + ts * 0.8);
        }

        const angle = Math.random() * Math.PI * 2;
        const r = (type === 'h' && mat.align === "Type-II") ? (dc/2 + Math.random()*ts*0.8) : (Math.random() * r_limit);
        
        c.position.set(-L + Math.random()*L/10, r * Math.cos(angle), r * Math.sin(angle));
        c.userData = { vx: 0.2 + Math.random()*0.1, vy: (Math.random()-0.5)*0.02, vz: (Math.random()-0.5)*0.02, type: type, scatter: 0 };
    }

    function animateCarriers() {
        const L = 30; // visual half-length boundary
        const bias = parseFloat(document.getElementById('bias-slider').value);
        const mat = systems[document.getElementById('mat-select').value];

        [...electrons, ...holes].forEach(c => {
            const data = c.userData;
            const mu = (data.type === 'e') ? mat.mu_e : mat.mu_h;
            
            // Apply bias force (drift)
            if(currentRegime === 'drift') {
                data.vx += bias * mu * 1e-6; // scaled force
            }

            // Scattering effect
            data.scatter--;
            if(data.scatter <= 0) {
                // Randomize lateral velocity (diffusive/scattering event)
                data.vy = (Math.random()-0.5)*0.04;
                data.vz = (Math.random()-0.5)*0.04;
                data.scatter = 10 + Math.random()*40; // Collision time scaling
                if(data.type === 'h' && mat.align === "Type-I") data.vy *= 0.5; // Holes heavier/slower
            }

            c.position.x += data.vx;
            c.position.y += data.vy;
            c.position.z += data.vz;

            // Simple interface boundary confinement
            const r = Math.sqrt(c.position.y**2 + c.position.z**2);
            const dc = parseFloat(document.getElementById('dc-slider').value);
            const ts = parseFloat(document.getElementById('ts-slider').value);
            
            let r_max = (data.type === 'h' && mat.align === "Type-II") ? (dc/2 + ts) : (dc/2);
            if(currentRegime === 'ballistic') r_max *= 0.9; // stronger quantum confinement viz

            if(r > r_max * 0.98) {
                c.position.y *= 0.9; c.position.z *= 0.9;
                data.vy *= -0.8; data.vz *= -0.8; // Bounce off interface/surface
            }

            // End-to-end injection/wrap
            if(c.position.x > L) {
                resetCarrier(c, data.type);
            }
        });
    }

    /** * PHYSICS & INTERACTIVE UPDATES
     */
    function updateSystem(initCall = false) {
        const matKey = document.getElementById('mat-select').value;
        const mat = systems[matKey];
        const dc = parseFloat(document.getElementById('dc-slider').value);
        const ts = parseFloat(document.getElementById('ts-slider').value);
        const bias = parseFloat(document.getElementById('bias-slider').value);

        // Update UI Text
        document.getElementById('val-dc').innerText = dc.toFixed(1);
        document.getElementById('val-ts').innerText = ts.toFixed(1);
        document.getElementById('val-bias').innerText = bias.toFixed(1);
        document.getElementById('hud-mat').innerText = mat.name;
        document.getElementById('hud-align').innerText = "Alignment: " + mat.align;

        // Data reads
        document.getElementById('res-egc').innerText = mat.egc.toFixed(2) + " eV";
        document.getElementById('res-egs').innerText = mat.egs.toFixed(2) + " eV";
        document.getElementById('res-cbo').innerText = mat.cbo.toFixed(2) + " eV";
        document.getElementById('res-vbo').innerText = mat.vbo.toFixed(2) + " eV";
        document.getElementById('res-sep').innerText = (mat.align === "Type-II") ? "High (e-Core, h-Shell)" : "Low (Co-localized)";

        // Simple current scaling model I ~ mu * V * Area / L
        const area = Math.PI * Math.pow(dc/2, 2);
        const current = 1e-4 * mat.mu_e * bias * area; // simplified scaling factor
        document.getElementById('res-current').innerText = current.toFixed(1) + " μA";

        const formulaBox = document.getElementById('formula-display');
        if(mat.align === "Type-I") {
            formulaBox.innerText = "Type-I Confinement: Electrons & Holes co-localized in Core. Efficient recombination.";
        } else {
            formulaBox.innerText = "Type-II Charge Separation: Electrons localize in Core, Holes in Shell. Suppressed recombination, good for PV.";
        }

        // 3D Build
        buildNanowire(dc, ts, mat);
        updateBandChart(mat, dc, ts);
    }

    function setRegime(regime) {
        currentRegime = regime;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        // Reset carrier userdata velocity profiles for ballistic effect
        [...electrons, ...holes].forEach(c => {
            if(regime === 'ballistic') {
                c.userData.vx *= 2.5; // Ballistic viz speedup
                c.userData.scatter = 1000; // suppress lateral scattering
            } else {
                c.userData.vx /= 2.5;
                c.userData.scatter = 10;
            }
        });
    }

    /** * CHARTS (Band Structure)
     */
    function initCharts() {
        const ctx = document.getElementById('bandChart').getContext('2d');
        bandChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // X-axis radial distance
                datasets: [
                    { label: 'CB (Core)', data: [], borderColor: '#aaa', borderWidth: 2, fill: false, tension: 0, pointRadius: 0 },
                    { label: 'VB (Core)', data: [], borderColor: '#aaa', borderWidth: 2, fill: false, tension: 0, pointRadius: 0 },
                    { label: 'CB (Shell)', data: [], borderColor: '#fff', borderWidth: 3, fill: false, tension: 0, pointRadius: 0 },
                    { label: 'VB (Shell)', data: [], borderColor: '#fff', borderWidth: 3, fill: false, tension: 0, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 10, left: 10, right: 20, bottom: 10 } },
                scales: {
                    x: { title: { display: true, text: 'Radial Distance (nm)', color: '#fff' }, grid: { color: '#222' }, ticks: { color: '#ccc' } },
                    y: { title: { display: true, text: 'Energy (eV)', color: '#fff' }, grid: { color: '#222' }, ticks: { color: '#ccc' } }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function updateBandChart(mat, dc, ts) {
        const r_c = dc / 2;
        const r_s = r_c + ts;
        const maxR = Math.ceil(r_s * 1.2);
        
        const labels = [];
        const ds_cbc = [], ds_vbc = [], ds_cbs = [], ds_vbs = [];

        // Reference Level definitions for visualization
        const baseLevel = 0; // Vacuum reference set to 0 for convenience

        // Step-function approximation of band edges
        for (let r = 0; r <= maxR; r += 0.2) {
            labels.push(r.toFixed(1));
            
            if (r <= r_c) {
                // Inside Core
                ds_cbc.push(mat.egc);
                ds_vbc.push(baseLevel);
                ds_cbs.push(null); // Hide shell lines inside core
                ds_vbs.push(null);
            } else if (r <= r_s) {
                // Inside Shell
                ds_cbc.push(null);
                ds_vbc.push(null);
                if(mat.align === "Type-I") {
                    ds_cbs.push(mat.egc + mat.cbo);
                    ds_vbs.push(baseLevel - mat.vbo);
                } else {
                    // Type-II (Si/Ge model where Ge shell valence band is higher)
                    // Note: Simplified visualization alignment
                    ds_cbs.push(mat.egc - mat.cbo); // DeltaEc pushes CB down slightly maybe
                    ds_vbs.push(baseLevel + mat.vbo); // DeltaEv pushes VB up significantly
                }
            } else {
                // Beyond surface
                ds_cbc.push(null); ds_vbc.push(null); ds_cbs.push(null); ds_vbs.push(null);
            }
        }

        bandChart.data.labels = labels;
        bandChart.data.datasets[0].data = ds_cbc;
        bandChart.data.datasets[1].data = ds_vbc;
        bandChart.data.datasets[2].data = ds_cbs;
        bandChart.data.datasets[3].data = ds_vbs;
        bandChart.update('none'); // Update without animation for smoothness
    }

    function animate() {
        requestAnimationFrame(animate);
        animateCarriers();
        if(wireCore) wireCore.rotation.y += 0.001;
        if(wireShell) wireShell.rotation.y += 0.001;
        renderer.render(scene, camera);
    }

    init();

    // Setup input listeners (Chart updates on end for performance)
    document.getElementById('mat-select').addEventListener('change', () => updateSystem());
    document.getElementById('dc-slider').addEventListener('input', (e) => { document.getElementById('val-dc').innerText = e.target.value; });
    document.getElementById('dc-slider').addEventListener('change', () => updateSystem());
    document.getElementById('ts-slider').addEventListener('input', (e) => { document.getElementById('val-ts').innerText = e.target.value; });
    document.getElementById('ts-slider').addEventListener('change', () => updateSystem());
    document.getElementById('bias-slider').addEventListener('input', (e) => { document.getElementById('val-bias').innerText = e.target.value; });
    document.getElementById('bias-slider').addEventListener('change', () => updateSystem());

    window.addEventListener('resize', () => {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

</script>
</body>
</html>
