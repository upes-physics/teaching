<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transducer Simulator — Signal Flow Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1e2d4a;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; padding: 0; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    letter-spacing: 1px;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 14px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.accent { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .btn.accent:hover { opacity: 0.85; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    background: var(--surface);
  }

  .tab {
    font-family: var(--mono);
    font-size: 10px;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .tab:hover { color: var(--text); background: var(--surface2); }

  .tab.active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  /* Main layout */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr 260px;
    height: calc(100vh - 113px);
  }

  /* Left Panel */
  .panel-left {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--surface);
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .param-row {
    margin-bottom: 14px;
  }

  .param-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }

  .param-name { font-size: 12px; color: var(--text); }
  .param-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    min-width: 70px;
    text-align: right;
  }

  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(0,212,255,0.4);
  }

  select, input[type=number] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 5px;
    font-family: var(--sans);
    font-size: 12px;
    outline: none;
  }

  select:focus, input[type=number]:focus { border-color: var(--accent); }

  /* Center — Signal Flow Canvas */
  .panel-center {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  .signal-canvas {
    flex: 1;
    position: relative;
    padding: 20px;
    overflow: hidden;
  }

  /* Signal flow diagram */
  .flow-container {
    display: flex;
    flex-direction: column;
    gap: 0;
    height: 100%;
  }

  .flow-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    flex: 1;
  }

  .flow-node {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
    position: relative;
    min-width: 110px;
    transition: all 0.3s;
    cursor: pointer;
  }

  .flow-node:hover { transform: translateY(-1px); }

  .flow-node .node-icon {
    font-size: 20px;
    margin-bottom: 4px;
    display: block;
  }

  .flow-node .node-name {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .flow-node .node-val {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    margin-top: 3px;
  }

  .flow-node.physical { background: rgba(124,58,237,0.12); border-color: var(--accent2); }
  .flow-node.physical .node-val { color: var(--accent2); }

  .flow-node.transducer {
    background: rgba(0,212,255,0.08);
    border-color: var(--accent);
    min-width: 140px;
    padding: 14px 20px;
  }

  .flow-node.transducer .node-val { color: var(--accent); font-size: 16px; }

  .flow-node.signal { background: rgba(16,185,129,0.1); border-color: var(--accent3); }
  .flow-node.signal .node-val { color: var(--accent3); }

  .flow-node.output { background: rgba(245,158,11,0.1); border-color: var(--warn); }
  .flow-node.output .node-val { color: var(--warn); }

  .flow-arrow {
    display: flex;
    align-items: center;
    padding: 0 8px;
    color: var(--muted);
    font-size: 18px;
    position: relative;
    min-width: 50px;
    justify-content: center;
  }

  .flow-arrow::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--border);
  }

  .flow-arrow-label {
    position: absolute;
    top: -16px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Animated signal pulse */
  @keyframes pulse-right {
    0% { left: 0; opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }

  .signal-pulse {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    top: 50%;
    transform: translateY(-50%);
    animation: pulse-right 1.8s ease-in-out infinite;
    box-shadow: 0 0 10px var(--accent);
  }

  /* Chart area */
  .chart-area {
    height: 200px;
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--surface);
    position: relative;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .chart-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .noise-badge {
    font-family: var(--mono);
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 3px;
    background: rgba(245,158,11,0.15);
    color: var(--warn);
    border: 1px solid rgba(245,158,11,0.3);
  }

  /* Right panel */
  .panel-right {
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 12px;
  }

  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    transition: border-color 0.2s;
  }

  .stat-card:hover { border-color: var(--accent); }

  .stat-label {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-unit {
    font-size: 9px;
    color: var(--muted);
    font-weight: 400;
  }

  /* Log */
  .log-panel {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .log-entries {
    max-height: 160px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px;
  }

  .log-entry {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    padding: 2px 0;
    border-bottom: 1px solid rgba(30,45,74,0.5);
    display: flex;
    gap: 8px;
    align-items: baseline;
  }

  .log-entry:last-child { border-bottom: none; }

  .log-time { color: var(--accent); min-width: 50px; }
  .log-msg { color: var(--text); }

  /* Indicators row */
  .indicators {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .indicator {
    font-family: var(--mono);
    font-size: 9px;
    padding: 4px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .indicator::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .ind-ok { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.3); }
  .ind-warn { background: rgba(245,158,11,0.1); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
  .ind-err { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }

  /* Info box */
  .info-box {
    margin: 12px;
    background: rgba(0,212,255,0.05);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 6px;
    padding: 12px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text);
  }

  .info-box strong {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* Toggle switch */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .toggle-name { font-size: 12px; color: var(--text); }

  .toggle {
    position: relative;
    width: 36px; height: 20px;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    left: 3px; top: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: 0.2s;
  }

  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--bg); }

  /* Color map for tabs */
  .tab[data-type="temperature"] .dot { background: #ef4444; }
  .tab[data-type="pressure"] .dot { background: #3b82f6; }
  .tab[data-type="magnetic"] .dot { background: #7c3aed; }
  .tab[data-type="vibration"] .dot { background: #f59e0b; }
  .tab[data-type="optical"] .dot { background: #10b981; }
  .tab[data-type="particle"] .dot { background: #ec4899; }

  .tab.active[data-type="temperature"] { background: #ef4444; border-color: #ef4444; }
  .tab.active[data-type="pressure"] { background: #3b82f6; border-color: #3b82f6; }
  .tab.active[data-type="magnetic"] { background: #7c3aed; border-color: #7c3aed; }
  .tab.active[data-type="vibration"] { background: #f59e0b; border-color: #f59e0b; }
  .tab.active[data-type="optical"] { background: #10b981; border-color: #10b981; }
  .tab.active[data-type="particle"] { background: #ec4899; border-color: #ec4899; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Waveform glow on active node */
  .flow-node.active-pulse {
    animation: nodePulse 0.5s ease-out;
  }

  @keyframes nodePulse {
    0% { box-shadow: 0 0 0 0 var(--accent); }
    100% { box-shadow: 0 0 20px 4px transparent; }
  }

  /* Export section */
  .export-section {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .export-btns { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Responsive fix for chart */
  canvas { max-width: 100%; }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .panel-left, .panel-right { height: auto; }
    header { flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">TX</div>
      <div>
        <div class="logo-text">TRANSDUCER LAB</div>
        <div class="logo-sub">Signal Flow Simulator</div>
      </div>
    </div>
    <div class="header-controls">
      <span id="sim-status" class="indicator ind-ok" style="font-size:9px;">● RUNNING</span>
      <button class="btn" onclick="toggleSim()">⏸ Pause</button>
      <button class="btn" onclick="resetSim()">↺ Reset</button>
      <button class="btn accent" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn" onclick="exportJPG()">⬇ JPG</button>
    </div>
  </header>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-type="temperature" onclick="switchTab('temperature',this)"><span class="dot"></span>Temperature</button>
    <button class="tab" data-type="pressure" onclick="switchTab('pressure',this)"><span class="dot"></span>Pressure/Vacuum</button>
    <button class="tab" data-type="magnetic" onclick="switchTab('magnetic',this)"><span class="dot"></span>Magnetic Field</button>
    <button class="tab" data-type="vibration" onclick="switchTab('vibration',this)"><span class="dot"></span>Vibration</button>
    <button class="tab" data-type="optical" onclick="switchTab('optical',this)"><span class="dot"></span>Optical</button>
    <button class="tab" data-type="particle" onclick="switchTab('particle',this)"><span class="dot"></span>Particle Detector</button>
  </div>

  <!-- Main -->
  <div class="main" id="main-panel">
    <!-- Left Controls -->
    <div class="panel-left" id="left-panel"></div>

    <!-- Center Signal Flow + Chart -->
    <div class="panel-center" id="center-panel">
      <div class="signal-canvas" id="signal-flow"></div>
      <div class="chart-area">
        <div class="chart-header">
          <span class="chart-label" id="chart-label">Output Signal — Time Domain</span>
          <span class="noise-badge" id="snr-badge">SNR: --</span>
        </div>
        <div style="position:relative;height:140px;">
          <canvas id="signalChart" role="img" aria-label="Transducer output signal over time"></canvas>
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="panel-right" id="right-panel"></div>
  </div>
</div>

<script>
const TRANSDUCERS = {
  temperature: {
    name: 'Temperature Transducer',
    icon: '🌡️',
    color: '#ef4444',
    typeColor: '#ef4444',
    types: ['Thermocouple (Type K)', 'RTD (Pt100)', 'Thermistor (NTC)', 'Infrared Sensor'],
    physical: { label: 'Heat Source', unit: '°C', min: -50, max: 1200, default: 25, icon: '🔥' },
    params: [
      { id: 'sensitivity', label: 'Sensitivity', min: 0.1, max: 50, step: 0.1, default: 41, unit: 'μV/°C' },
      { id: 'responseTime', label: 'Response Time', min: 0.1, max: 30, step: 0.1, default: 2.5, unit: 's' },
      { id: 'noise', label: 'Noise Level', min: 0, max: 5, step: 0.1, default: 0.5, unit: '%' },
      { id: 'gain', label: 'Amplifier Gain', min: 1, max: 1000, step: 1, default: 100, unit: 'V/V' },
    ],
    toggles: [
      { id: 'coldJunction', label: 'Cold Junction Compensation' },
      { id: 'linearize', label: 'Linearization' },
      { id: 'filter', label: 'Low-pass Filter' },
    ],
    flow: ['Physical Temp.', 'Sensing Element', 'Signal Conditioning', 'ADC', 'Digital Output'],
    flowLabels: ['Seebeck Effect', 'mV → V', 'Filtering', '12-bit'],
    convert: (v, p) => (v * p.sensitivity * p.gain / 1e6).toFixed(4),
    outputUnit: 'V',
    info: `Thermocouples exploit the Seebeck effect — two dissimilar metal junctions generate a voltage proportional to the temperature difference. Type K uses Chromel-Alumel wires and covers -200°C to +1260°C.`,
    waveform: (t, v, p) => {
      const base = v * p.sensitivity * p.gain / 1e6;
      const noise = (Math.random() - 0.5) * p.noise * 0.01 * base;
      const filter = p.filter ? Math.sin(t * 0.2) * 0.002 : 0;
      return parseFloat((base + noise + filter).toFixed(6));
    },
    stats: (v, p) => ({
      'Output V': (v * p.sensitivity * p.gain / 1e6).toFixed(4) + ' V',
      'mV Signal': (v * p.sensitivity / 1000).toFixed(3) + ' mV',
      'SNR': (20 * Math.log10(100 / Math.max(p.noise, 0.01))).toFixed(1) + ' dB',
      'Res.': (p.responseTime).toFixed(1) + ' s',
    })
  },

  pressure: {
    name: 'Pressure / Vacuum Transducer',
    icon: '⊕',
    color: '#3b82f6',
    typeColor: '#3b82f6',
    types: ['Piezoresistive', 'Capacitive', 'Piezoelectric', 'Resonant Wire'],
    physical: { label: 'Pressure', unit: 'kPa', min: -101.3, max: 10000, default: 101.3, icon: '💨' },
    params: [
      { id: 'sensitivity', label: 'Full Scale Range', min: 10, max: 10000, step: 10, default: 1000, unit: 'kPa' },
      { id: 'excitation', label: 'Bridge Excitation', min: 1, max: 15, step: 0.1, default: 5, unit: 'V' },
      { id: 'noise', label: 'Noise Level', min: 0, max: 5, step: 0.1, default: 0.3, unit: '%' },
      { id: 'gain', label: 'Amplifier Gain', min: 1, max: 500, step: 1, default: 100, unit: 'V/V' },
    ],
    toggles: [
      { id: 'differential', label: 'Differential Mode' },
      { id: 'tempComp', label: 'Temperature Compensation' },
      { id: 'filter', label: 'Anti-alias Filter' },
    ],
    flow: ['Pressure Input', 'Diaphragm', 'Wheatstone Bridge', 'Amp & ADC', 'Pressure Output'],
    flowLabels: ['Deformation', 'ΔR → mV', 'Signal Cond.', '16-bit'],
    convert: (v, p) => ((v / p.sensitivity) * p.excitation * 0.002 * p.gain).toFixed(4),
    outputUnit: 'V',
    info: `Piezoresistive sensors use a silicon diaphragm with diffused resistors. Applied pressure deforms the diaphragm, changing resistances in a Wheatstone bridge arrangement to produce a differential voltage.`,
    waveform: (t, v, p) => {
      const base = (v / p.sensitivity) * p.excitation * 0.002 * p.gain;
      const noise = (Math.random() - 0.5) * p.noise * 0.01 * Math.abs(base);
      return parseFloat((base + noise).toFixed(6));
    },
    stats: (v, p) => ({
      'Output V': ((v / p.sensitivity) * p.excitation * 0.002 * p.gain).toFixed(4) + ' V',
      'Bridge ΔV': ((v / p.sensitivity) * p.excitation * 0.002 * 1000).toFixed(2) + ' mV',
      'SNR': (20 * Math.log10(100 / Math.max(p.noise, 0.01))).toFixed(1) + ' dB',
      '%FS': ((v / p.sensitivity) * 100).toFixed(1) + ' %',
    })
  },

  magnetic: {
    name: 'Magnetic Field Transducer',
    icon: '🧲',
    color: '#7c3aed',
    typeColor: '#7c3aed',
    types: ['Hall Effect', 'Fluxgate', 'AMR (Anisotropic)', 'Search Coil'],
    physical: { label: 'Field Strength', unit: 'mT', min: 0, max: 2000, default: 50, icon: '⚡' },
    params: [
      { id: 'sensitivity', label: 'Sensitivity', min: 0.1, max: 100, step: 0.1, default: 14, unit: 'mV/mT' },
      { id: 'supplyV', label: 'Supply Voltage', min: 3, max: 24, step: 0.1, default: 5, unit: 'V' },
      { id: 'noise', label: 'Noise Floor', min: 0, max: 10, step: 0.1, default: 1, unit: '%' },
      { id: 'bandwidth', label: 'Bandwidth', min: 1, max: 1000, step: 1, default: 100, unit: 'kHz' },
    ],
    toggles: [
      { id: 'biasComp', label: 'Offset Compensation' },
      { id: 'chopper', label: 'Chopper Stabilization' },
      { id: 'filter', label: 'EMI Filter' },
    ],
    flow: ['Magnetic Field', 'Hall Plate', 'Differential Amp', 'Signal Proc.', 'Voltage Out'],
    flowLabels: ['Lorentz Force', 'Hall Voltage', 'Conditioning', 'Linearized'],
    convert: (v, p) => (v * p.sensitivity * 0.001).toFixed(4),
    outputUnit: 'V',
    info: `Hall effect sensors place a current-carrying conductor in a magnetic field. The Lorentz force deflects charge carriers sideways, producing a Hall voltage proportional to B·I·d (field × current × thickness).`,
    waveform: (t, v, p) => {
      const base = v * p.sensitivity * 0.001;
      const noise = (Math.random() - 0.5) * p.noise * 0.01 * base;
      const ripple = Math.sin(t * p.bandwidth * 0.01) * 0.0001;
      return parseFloat((base + noise + ripple).toFixed(6));
    },
    stats: (v, p) => ({
      'Output V': (v * p.sensitivity * 0.001).toFixed(4) + ' V',
      'Hall V': (v * p.sensitivity).toFixed(2) + ' mV',
      'BW': p.bandwidth + ' kHz',
      'SNR': (20 * Math.log10(100 / Math.max(p.noise, 0.01))).toFixed(1) + ' dB',
    })
  },

  vibration: {
    name: 'Vibration / Accelerometer',
    icon: '〜',
    color: '#f59e0b',
    typeColor: '#f59e0b',
    types: ['Piezoelectric (IEPE)', 'MEMS Capacitive', 'Piezoresistive', 'Velocity Sensor'],
    physical: { label: 'Acceleration', unit: 'g', min: 0, max: 500, default: 1, icon: '📳' },
    params: [
      { id: 'sensitivity', label: 'Sensitivity', min: 1, max: 1000, step: 1, default: 100, unit: 'mV/g' },
      { id: 'frequency', label: 'Vibration Freq.', min: 1, max: 20000, step: 1, default: 60, unit: 'Hz' },
      { id: 'noise', label: 'Noise Level', min: 0, max: 5, step: 0.1, default: 0.8, unit: '%' },
      { id: 'damping', label: 'Damping Ratio', min: 0.01, max: 2, step: 0.01, default: 0.7, unit: '' },
    ],
    toggles: [
      { id: 'acCoupled', label: 'AC Coupling' },
      { id: 'intFilter', label: 'Integration Filter' },
      { id: 'overload', label: 'Overload Protection' },
    ],
    flow: ['Vibration Input', 'Piezo Crystal', 'Charge Amp', 'Band-pass Filter', 'AC Voltage'],
    flowLabels: ['Stress', 'Charge (pC)', 'mV/g', '±Vout'],
    convert: (v, p) => (v * p.sensitivity * 0.001).toFixed(4),
    outputUnit: 'V pk',
    info: `Piezoelectric accelerometers use a crystal (quartz or PZT) mechanically coupled to a seismic mass. Inertial force under vibration stresses the crystal, generating charge proportional to acceleration.`,
    waveform: (t, v, p) => {
      const base = v * p.sensitivity * 0.001;
      const vibration = base * Math.sin(2 * Math.PI * p.frequency * t * 0.001) *
        Math.exp(-p.damping * t * 0.01);
      const noise = (Math.random() - 0.5) * p.noise * 0.01 * base;
      return parseFloat((vibration + noise).toFixed(6));
    },
    stats: (v, p) => ({
      'Peak V': (v * p.sensitivity * 0.001).toFixed(4) + ' V',
      'Freq': p.frequency + ' Hz',
      'Damping ζ': p.damping.toFixed(2),
      'Charge': (v * 12).toFixed(1) + ' pC',
    })
  },

  optical: {
    name: 'Optical Transducer',
    icon: '◉',
    color: '#10b981',
    typeColor: '#10b981',
    types: ['Photodiode (Si)', 'Phototransistor', 'Avalanche PD', 'CCD Array'],
    physical: { label: 'Irradiance', unit: 'mW/cm²', min: 0, max: 1000, default: 10, icon: '💡' },
    params: [
      { id: 'sensitivity', label: 'Responsivity', min: 0.01, max: 1.2, step: 0.01, default: 0.55, unit: 'A/W' },
      { id: 'reverseVolt', label: 'Reverse Bias', min: 0, max: 100, step: 0.5, default: 5, unit: 'V' },
      { id: 'noise', label: 'Dark Current', min: 0.001, max: 100, step: 0.001, default: 0.01, unit: 'nA' },
      { id: 'wavelength', label: 'Wavelength', min: 300, max: 1100, step: 1, default: 850, unit: 'nm' },
    ],
    toggles: [
      { id: 'avalanche', label: 'Avalanche Mode' },
      { id: 'tia', label: 'Trans-impedance Amp' },
      { id: 'filter', label: 'Optical Filter' },
    ],
    flow: ['Light Input', 'Photodiode', 'I→V Convert', 'Signal Amp', 'Voltage Output'],
    flowLabels: ['Photons', 'Photocurrent', 'TIA Stage', 'Buffered'],
    convert: (v, p) => (v * 0.1 * p.sensitivity * p.reverseVolt * 0.01).toFixed(6),
    outputUnit: 'V',
    info: `Photodiodes operate in reverse bias mode. Incident photons with energy > bandgap generate electron-hole pairs. The resulting photocurrent is proportional to irradiance and converted to voltage via a TIA.`,
    waveform: (t, v, p) => {
      const photocurrent = v * 0.1 * p.sensitivity;
      const voltage = photocurrent * p.reverseVolt * 0.01;
      const noise = p.noise * 1e-9 * (Math.random() - 0.5) * 100;
      return parseFloat((voltage + noise).toFixed(8));
    },
    stats: (v, p) => ({
      'Output V': (v * 0.1 * p.sensitivity * p.reverseVolt * 0.01).toFixed(5) + ' V',
      'I_photo': (v * 0.1 * p.sensitivity * 1000).toFixed(3) + ' mA',
      'λ': p.wavelength + ' nm',
      'Dark I': p.noise.toFixed(3) + ' nA',
    })
  },

  particle: {
    name: 'Particle Detector',
    icon: '◎',
    color: '#ec4899',
    typeColor: '#ec4899',
    types: ['Geiger-Müller', 'Scintillation', 'Semiconductor (Si-PIN)', 'Proportional Counter'],
    physical: { label: 'Activity', unit: 'Bq', min: 0, max: 100000, default: 100, icon: '☢️' },
    params: [
      { id: 'hvBias', label: 'HV Bias Voltage', min: 200, max: 1200, step: 10, default: 500, unit: 'V' },
      { id: 'efficiency', label: 'Detection Efficiency', min: 1, max: 100, step: 1, default: 35, unit: '%' },
      { id: 'noise', label: 'Background Rate', min: 0, max: 200, step: 1, default: 20, unit: 'CPM' },
      { id: 'deadTime', label: 'Dead Time', min: 10, max: 1000, step: 10, default: 100, unit: 'μs' },
    ],
    toggles: [
      { id: 'hv', label: 'HV Supply Enabled' },
      { id: 'shaping', label: 'Pulse Shaping' },
      { id: 'mca', label: 'MCA Mode' },
    ],
    flow: ['Ionizing Particle', 'GM Tube', 'Pulse Amplifier', 'Discriminator', 'Count Rate'],
    flowLabels: ['Ionization', 'Avalanche', 'Shaping', 'CPM'],
    convert: (v, p) => Math.round(v * (p.efficiency / 100) + p.noise / 60),
    outputUnit: 'CPS',
    info: `Geiger-Müller tubes detect ionizing radiation by gas amplification. A single ionizing particle triggers an avalanche discharge, producing a voltage pulse. The tube operates in the Geiger plateau region.`,
    waveform: (t, v, p) => {
      const rate = v * (p.efficiency / 100);
      const poisson = rate + p.noise / 60 + (Math.random() - 0.5) * Math.sqrt(rate + p.noise / 60);
      return Math.max(0, Math.round(poisson * 10) / 10);
    },
    stats: (v, p) => ({
      'Count Rate': Math.round(v * (p.efficiency / 100) + p.noise / 60) + ' CPS',
      'Efficiency': p.efficiency + ' %',
      'Dead Time': p.deadTime + ' μs',
      'BG Rate': p.noise + ' CPM',
    })
  }
};

let currentType = 'temperature';
let params = {};
let toggles = {};
let physicalValue = 0;
let signalChart = null;
let signalData = [];
let running = true;
let simTimer = null;
let logData = [];
let logEntries = [];
let t = 0;
let typeSelect = 0;

function initParams() {
  const tx = TRANSDUCERS[currentType];
  params = {};
  toggles = {};
  tx.params.forEach(p => params[p.id] = p.default);
  tx.toggles.forEach(t => toggles[t.id] = true);
  physicalValue = tx.physical.default;
  typeSelect = 0;
  signalData = [];
  logData = [];
  t = 0;
}

function buildLeftPanel() {
  const tx = TRANSDUCERS[currentType];
  const panel = document.getElementById('left-panel');

  panel.innerHTML = `
    <div class="panel-section">
      <div class="panel-label">Transducer Type</div>
      <select onchange="setType(parseInt(this.value))">
        ${tx.types.map((t,i) => `<option value="${i}" ${i===typeSelect?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>

    <div class="panel-section">
      <div class="panel-label">Physical Input — ${tx.physical.label}</div>
      <div class="param-row">
        <div class="param-header">
          <span class="param-name">${tx.physical.label}</span>
          <span class="param-value" id="pv-display">${physicalValue} ${tx.physical.unit}</span>
        </div>
        <input type="range" min="${tx.physical.min}" max="${tx.physical.max}" step="${(tx.physical.max - tx.physical.min)/500}" value="${physicalValue}"
          oninput="setPhysical(parseFloat(this.value), '${tx.physical.unit}')">
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Transducer Parameters</div>
      ${tx.params.map(p => `
        <div class="param-row">
          <div class="param-header">
            <span class="param-name">${p.label}</span>
            <span class="param-value" id="param-${p.id}">${params[p.id]} ${p.unit}</span>
          </div>
          <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${params[p.id]}"
            oninput="setParam('${p.id}', parseFloat(this.value), '${p.unit}')">
        </div>
      `).join('')}
    </div>

    <div class="panel-section">
      <div class="panel-label">Configuration</div>
      ${tx.toggles.map(tog => `
        <div class="toggle-row">
          <span class="toggle-name">${tog.label}</span>
          <label class="toggle">
            <input type="checkbox" ${toggles[tog.id]?'checked':''} onchange="setToggle('${tog.id}', this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </div>
      `).join('')}
    </div>
  `;
}

function buildRightPanel() {
  const tx = TRANSDUCERS[currentType];
  const panel = document.getElementById('right-panel');
  const stats = tx.stats(physicalValue, params);

  panel.innerHTML = `
    <div class="panel-section">
      <div class="panel-label">Live Measurements</div>
    </div>
    <div class="stats-grid" id="stats-grid">
      ${Object.entries(stats).map(([k,v]) => `
        <div class="stat-card">
          <div class="stat-label">${k}</div>
          <div class="stat-value">${v}</div>
        </div>
      `).join('')}
    </div>

    <div class="indicators" id="indicators">
      <span class="indicator ind-ok">SENSOR OK</span>
      <span class="indicator ind-ok">SIGNAL VALID</span>
      <span class="indicator ind-warn" id="noise-ind">NOISE ${params.noise||0}%</span>
    </div>

    <div class="info-box">
      <strong>How it works</strong>
      ${tx.info}
    </div>

    <div class="log-panel">
      <div class="panel-label" style="margin-bottom:8px;">Data Log</div>
      <div class="log-entries" id="log-entries"></div>
    </div>

    <div class="export-section">
      <div class="panel-label" style="margin-bottom:8px;">Export</div>
      <div class="export-btns">
        <button class="btn accent" onclick="exportCSV()" style="flex:1">⬇ CSV Data</button>
        <button class="btn" onclick="exportJPG()" style="flex:1">⬇ JPG Snapshot</button>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:6px;font-family:var(--mono);">
        ${logData.length} samples recorded
      </div>
    </div>
  `;
}

function buildSignalFlow() {
  const tx = TRANSDUCERS[currentType];
  const el = document.getElementById('signal-flow');
  const color = tx.color;

  el.innerHTML = `
    <div style="height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;">
      <!-- Top info bar -->
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-family:var(--mono);font-size:11px;color:${color};">${tx.icon} ${tx.name}</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--muted);">SIGNAL FLOW DIAGRAM</div>
      </div>

      <!-- Flow nodes -->
      <div style="display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:8px 0;">
        ${tx.flow.map((label, i) => {
          let cls = i === 0 ? 'physical' : i === tx.flow.length-1 ? 'output' : i === 2 ? 'transducer' : 'signal';
          return `
            <div class="flow-node ${cls}" id="node-${i}" onclick="animateNode(${i})">
              <span class="node-name">${label}</span>
              <div class="node-val" id="nval-${i}">—</div>
            </div>
            ${i < tx.flow.length-1 ? `
              <div class="flow-arrow">
                <span class="signal-pulse" style="background:${color};box-shadow:0 0 10px ${color};animation-delay:${i*0.36}s;"></span>
                ${tx.flowLabels[i] ? `<span class="flow-arrow-label">${tx.flowLabels[i]}</span>` : ''}
                <span style="font-size:16px;color:${color};position:relative;z-index:1;">›</span>
              </div>
            ` : ''}
          `;
        }).join('')}
      </div>

      <!-- Transfer function mini display -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-top:4px;">
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:8px;">TRANSFER FUNCTION</div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;">
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Input</div>
            <div style="font-family:var(--mono);font-size:14px;color:${color};" id="tf-input">${physicalValue} ${tx.physical.unit}</div>
          </div>
          <div style="display:flex;align-items:center;font-family:var(--mono);font-size:18px;color:var(--muted);">→ƒ(x) →</div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Output</div>
            <div style="font-family:var(--mono);font-size:14px;color:${color};" id="tf-output">—</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Sensitivity</div>
            <div style="font-family:var(--mono);font-size:14px;color:var(--accent3);" id="tf-sens">—</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">Noise</div>
            <div style="font-family:var(--mono);font-size:14px;color:var(--warn);" id="tf-noise">—</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function buildChart() {
  if (signalChart) { signalChart.destroy(); signalChart = null; }
  const ctx = document.getElementById('signalChart').getContext('2d');
  const color = TRANSDUCERS[currentType].color;

  signalChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array(60).fill(''),
      datasets: [{
        label: 'Output Signal',
        data: Array(60).fill(null),
        borderColor: color,
        backgroundColor: color + '18',
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.4,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: {
          border: { color: 'rgba(255,255,255,0.1)' },
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: {
            color: '#64748b',
            font: { family: "'Space Mono', monospace", size: 9 },
            maxTicksLimit: 5,
          }
        }
      }
    }
  });
}

function updateNodeValues() {
  const tx = TRANSDUCERS[currentType];
  const output = tx.waveform(t, physicalValue, params);

  // Node values along the chain
  const nodeValues = [
    `${physicalValue.toFixed(1)} ${tx.physical.unit}`,
    `${(physicalValue * (params.sensitivity||1) * 0.001).toFixed(3)} mV`,
    `${(output * 0.01).toFixed(5)} V`,
    `${(output * 0.1).toFixed(5)} V`,
    `${output.toFixed(5)} ${tx.outputUnit}`,
  ];

  nodeValues.forEach((v, i) => {
    const el = document.getElementById(`nval-${i}`);
    if (el) el.textContent = v;
  });

  // Transfer function
  const tfInput = document.getElementById('tf-input');
  const tfOutput = document.getElementById('tf-output');
  const tfSens = document.getElementById('tf-sens');
  const tfNoise = document.getElementById('tf-noise');
  if (tfInput) tfInput.textContent = `${physicalValue.toFixed(2)} ${tx.physical.unit}`;
  if (tfOutput) tfOutput.textContent = `${output.toFixed(5)} ${tx.outputUnit}`;
  if (tfSens) tfSens.textContent = `${(params.sensitivity||1).toFixed(1)} ${tx.params[0]?.unit||''}`;
  if (tfNoise) tfNoise.textContent = `${(params.noise||0).toFixed(1)} %`;

  // SNR badge
  const snr = 20 * Math.log10(100 / Math.max(params.noise || params.efficiency || 1, 0.01));
  const badge = document.getElementById('snr-badge');
  if (badge) badge.textContent = `SNR: ${snr.toFixed(1)} dB`;

  // Stats grid
  const stats = tx.stats(physicalValue, params);
  const grid = document.getElementById('stats-grid');
  if (grid) {
    grid.innerHTML = Object.entries(stats).map(([k,v]) => `
      <div class="stat-card">
        <div class="stat-label">${k}</div>
        <div class="stat-value">${v}</div>
      </div>
    `).join('');
  }

  // Noise indicator
  const noiseInd = document.getElementById('noise-ind');
  const noiseLevel = params.noise || 0;
  if (noiseInd) {
    noiseInd.className = `indicator ${noiseLevel < 1 ? 'ind-ok' : noiseLevel < 3 ? 'ind-warn' : 'ind-err'}`;
    noiseInd.textContent = `NOISE ${noiseLevel.toFixed(1)}%`;
  }

  // Chart
  if (signalChart) {
    const data = signalChart.data.datasets[0].data;
    data.push(output);
    if (data.length > 60) data.shift();
    signalChart.update('none');
  }

  // Log data
  const now = new Date();
  const ts = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  const logRow = { ts, type: currentType, input: physicalValue, output, unit: tx.outputUnit, ...params };
  logData.push(logRow);
  if (logData.length > 500) logData.shift();

  // Log display (last 8)
  logEntries.push({ ts, msg: `${tx.physical.label}=${physicalValue.toFixed(1)}${tx.physical.unit} → ${output.toFixed(5)} ${tx.outputUnit}` });
  if (logEntries.length > 20) logEntries.shift();

  const logEl = document.getElementById('log-entries');
  if (logEl) {
    logEl.innerHTML = [...logEntries].reverse().slice(0,8).map(e => `
      <div class="log-entry">
        <span class="log-time">${e.ts}</span>
        <span class="log-msg">${e.msg}</span>
      </div>
    `).join('');
  }
}

function startSim() {
  if (simTimer) clearInterval(simTimer);
  simTimer = setInterval(() => {
    if (!running) return;
    t += 1;
    updateNodeValues();
  }, 150);
}

function switchTab(type, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentType = type;
  initParams();
  buildLeftPanel();
  buildSignalFlow();
  buildChart();
  buildRightPanel();
  logEntries = [];
}

function setType(i) { typeSelect = i; addLog(`Switched to ${TRANSDUCERS[currentType].types[i]}`); }
function setPhysical(v, unit) {
  physicalValue = v;
  document.getElementById('pv-display').textContent = `${v.toFixed(2)} ${unit}`;
}
function setParam(id, v, unit) {
  params[id] = v;
  document.getElementById(`param-${id}`).textContent = `${v} ${unit}`;
}
function setToggle(id, v) { toggles[id] = v; }

function animateNode(i) {
  const el = document.getElementById(`node-${i}`);
  if (!el) return;
  el.classList.remove('active-pulse');
  void el.offsetWidth;
  el.classList.add('active-pulse');
  const tx = TRANSDUCERS[currentType];
  addLog(`Clicked: ${tx.flow[i]}`);
}

function addLog(msg) {
  const now = new Date();
  const ts = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  logEntries.push({ ts, msg });
  if (logEntries.length > 20) logEntries.shift();
}

function toggleSim() {
  running = !running;
  const btn = document.querySelector('button[onclick="toggleSim()"]');
  const status = document.getElementById('sim-status');
  if (running) {
    btn.textContent = '⏸ Pause';
    status.className = 'indicator ind-ok';
    status.textContent = '● RUNNING';
  } else {
    btn.textContent = '▶ Resume';
    status.className = 'indicator ind-warn';
    status.textContent = '◉ PAUSED';
  }
}

function resetSim() {
  signalData = [];
  logData = [];
  logEntries = [];
  t = 0;
  if (signalChart) {
    signalChart.data.datasets[0].data = Array(60).fill(null);
    signalChart.update();
  }
  const logEl = document.getElementById('log-entries');
  if (logEl) logEl.innerHTML = '';
}

function exportCSV() {
  if (logData.length === 0) { alert('No data recorded yet. Let the simulation run for a few seconds.'); return; }
  const tx = TRANSDUCERS[currentType];
  const headers = ['Timestamp', 'TransducerType', `Input_${tx.physical.unit}`, `Output_${tx.outputUnit}`, ...Object.keys(params)];
  const rows = logData.map(r => [r.ts, r.type, r.input, r.output, ...Object.values(params)].join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `transducer_${currentType}_${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportJPG() {
  const el = document.getElementById('main-panel');
  html2canvas(el, { backgroundColor: '#0a0e1a', scale: 2 }).then(canvas => {
    const url = canvas.toDataURL('image/jpeg', 0.92);
    const a = document.createElement('a');
    a.href = url;
    a.download = `transducer_${currentType}_${Date.now()}.jpg`;
    a.click();
  });
}

// Boot
initParams();
buildLeftPanel();
buildSignalFlow();
buildChart();
buildRightPanel();
startSim();
</script>
</body>
</html>
