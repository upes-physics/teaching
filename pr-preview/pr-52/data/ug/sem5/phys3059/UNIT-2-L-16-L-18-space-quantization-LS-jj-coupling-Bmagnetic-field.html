<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Angular Momentum Coupling Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* tailwind slate-900 */
            color: #f8fafc; /* tailwind slate-50 */
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Custom Scrollbar for theory section */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .controls-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .tab-btn.active {
            border-bottom: 2px solid #3b82f6; /* blue-500 */
            color: #60a5fa; /* blue-400 */
            background-color: rgba(59, 130, 246, 0.1);
        }

        input[type=range] {
            -webkit-appearance: none; /* Hides the slider so that custom slider can be made */
            width: 100%; /* Specific width is required for Firefox. */
            background: transparent; /* Otherwise white in Chrome */
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }

        .math-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #93c5fd; /* blue-300 */
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            border: 1px solid #3b82f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md z-10">
        <h1 class="text-2xl font-bold text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">
            Quantum Angular Momentum Coupling
        </h1>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
        
        <!-- Left Panel: Theory & Explanations -->
        <div class="w-full md:w-1/3 lg:w-1/4 bg-slate-900 border-r border-slate-700 flex flex-col h-full z-10 overflow-hidden shadow-lg shadow-black">
            
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-700 shrink-0">
                <button onclick="switchTab('space-quant')" id="tab-space-quant" class="tab-btn active flex-1 py-3 text-xs md:text-sm font-semibold transition-colors duration-200 hover:bg-slate-800">
                    Space Quantization
                </button>
                <button onclick="switchTab('ls-coupling')" id="tab-ls-coupling" class="tab-btn flex-1 py-3 text-xs md:text-sm font-semibold transition-colors duration-200 hover:bg-slate-800">
                    LS Coupling
                </button>
                <button onclick="switchTab('jj-coupling')" id="tab-jj-coupling" class="tab-btn flex-1 py-3 text-xs md:text-sm font-semibold transition-colors duration-200 hover:bg-slate-800">
                    jj Coupling
                </button>
            </div>

            <!-- Global Physics Parameters -->
            <div class="bg-slate-800 border-b border-slate-700 p-4 shrink-0 shadow-inner">
                <h3 class="text-white font-semibold mb-3 text-sm flex items-center justify-between">
                    <span>External Physics</span>
                </h3>
                <div class="flex flex-col mb-2">
                    <div class="flex justify-between mb-1">
                        <label for="global-b-field" class="text-xs font-medium text-slate-300">Magnetic Field (B) [Tesla]</label>
                        <span id="global-b-field-val" class="text-xs font-bold text-blue-400">1.0</span>
                    </div>
                    <input type="range" id="global-b-field" min="0.1" max="5.0" step="0.1" value="1.0" 
                           oninput="updateGlobalBField(this.value)" class="w-full">
                </div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700 mt-2">
                    <div class="text-xs text-slate-400 flex justify-between">
                        <span>Larmor Freq. (&omega;<sub>L</sub>):</span>
                        <span id="larmor-freq-display" class="font-mono text-emerald-400 font-bold">14.00 GHz</span>
                    </div>
                    <div class="text-[10px] text-slate-500 mt-1 leading-tight">
                        &omega;<sub>L</sub> = &gamma;B (assuming &gamma; &approx; e/2m<sub>e</sub> &approx; 14 GHz/T for orbital motion)
                    </div>
                </div>
            </div>

            <!-- Theory Content Container -->
            <div class="flex-1 overflow-y-auto p-5 text-slate-300 text-sm leading-relaxed" id="theory-content">
                <!-- Content injected via JS based on active tab -->
            </div>
        </div>

        <!-- Right Panel: Simulation & Controls -->
        <div class="w-full md:w-2/3 lg:w-3/4 relative flex flex-col">
            
            <!-- 3D Canvas Area -->
            <div class="flex-1 p-4 relative">
                <div id="canvas-container" class="canvas-container relative">
                    <!-- Three.js canvas goes here -->
                    <div id="vector-tooltip" class="tooltip"></div>
                    
                    <!-- View Controls Overlay -->
                    <div class="absolute top-4 right-4 bg-slate-800/80 backdrop-blur rounded p-2 border border-slate-600 shadow-lg text-xs flex gap-2">
                        <button onclick="resetCamera()" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded transition">Reset View</button>
                        <button onclick="togglePrecession()" id="btn-precess" class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded transition text-white shadow shadow-blue-500/50">Stop Precession</button>
                    </div>
                    
                    <!-- Legend Overlay -->
                    <div class="absolute bottom-4 left-4 bg-slate-800/80 backdrop-blur rounded p-3 border border-slate-600 shadow-lg" id="legend-container">
                        <!-- Legend content injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Controls Area (Bottom) -->
            <div class="h-48 bg-slate-800 border-t border-slate-700 p-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-10">
                <div id="controls-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                    <!-- Controls injected via JS based on active tab -->
                </div>
            </div>
        </div>
    </div>

<script>
    // --- Application State ---
    const STATE = {
        currentMode: 'space-quant', // 'space-quant', 'ls-coupling', 'jj-coupling'
        isPrecessing: true,
        animationId: null,
        time: 0,
        
        // Physical Constants (simplified for visualization scaling)
        magneticField: 1.0, // Tesla
        baseLarmorFreqPerTesla: 14.0, // GHz/T (approximate for orbital electron)
        
        // Quantum Numbers
        sq: { l: 2, m: 1 }, // Space Quantization
        ls: { l1: 1, l2: 2, s1: 0.5, s2: 0.5, L: 2, S: 1, J: 2, Mj: 2 }, // LS Coupling
        jj: { l1: 1, s1: 0.5, j1: 1.5, l2: 2, s2: 0.5, j2: 1.5, J: 2, Mj: 2 } // jj Coupling
    };

    // --- Theory Content Database ---
    const THEORY = {
        'space-quant': `
            <h2 class="text-xl font-bold mb-4 text-white">Space Quantization & Larmor Precession</h2>
            <p class="mb-4">
                In classical mechanics, an angular momentum vector <span class="math-text">L</span> can point in any direction. In quantum mechanics, its direction relative to an external magnetic field is restricted.
            </p>
            <div class="bg-slate-800 p-4 rounded-lg mb-4 border border-slate-700">
                <h3 class="font-semibold text-blue-400 mb-2">Quantization Rules:</h3>
                <ul class="list-disc pl-5 space-y-1 text-xs">
                    <li>Magnitude: <span class="math-text">|L| = √[l(l+1)] ℏ</span></li>
                    <li>z-component: <span class="math-text">L<sub>z</sub> = m<sub>l</sub> ℏ</span></li>
                    <li><span class="math-text">m<sub>l</sub></span> ranges from <span class="math-text">-l</span> to <span class="math-text">+l</span></li>
                </ul>
            </div>
            <h3 class="font-semibold text-white mb-2">Larmor Precession</h3>
            <p class="mb-4">
                The external magnetic field <span class="math-text">B</span> exerts a torque on the magnetic dipole moment associated with the angular momentum. This causes the vector to precess (wobble) around the z-axis.
            </p>
            <p class="mb-4 text-xs bg-slate-800/50 p-2 rounded border-l-2 border-emerald-500">
                The frequency of this precession is the <strong>Larmor Frequency (&omega;<sub>L</sub>)</strong>, which is directly proportional to the magnetic field strength <span class="math-text">B</span>.<br><br>
                Try adjusting the Magnetic Field slider to see its effect on the precession speed!
            </p>
        `,
        'ls-coupling': `
            <h2 class="text-xl font-bold mb-4 text-white">Russell-Saunders (LS) Coupling</h2>
            <p class="mb-4">
                Occurs primarily in <strong>lighter atoms</strong> where the electrostatic interaction between electrons is much stronger than the spin-orbit interaction.
            </p>
            <p class="mb-2"><strong>Coupling Scheme:</strong></p>
            <ol class="list-decimal pl-5 space-y-2 mb-4">
                <li>Individual orbital momenta couple: <span class="math-text">L = Σ l<sub>i</sub></span></li>
                <li>Individual spin momenta couple: <span class="math-text">S = Σ s<sub>i</sub></span></li>
                <li>Total L and S couple to form total J: <span class="math-text">J = L + S</span></li>
            </ol>
            <div class="bg-slate-800 p-4 rounded-lg mb-4 border border-slate-700">
                <h3 class="font-semibold text-blue-400 mb-2">Precession Dynamics:</h3>
                <ul class="list-disc pl-5 space-y-2 text-xs">
                    <li><span class="math-text">l<sub>i</sub></span> precess rapidly around <span class="math-text">L</span>.</li>
                    <li><span class="math-text">s<sub>i</sub></span> precess rapidly around <span class="math-text">S</span>.</li>
                    <li><span class="math-text">L</span> and <span class="math-text">S</span> precess slowly around total <span class="math-text">J</span>.</li>
                    <li><span class="math-text">J</span> precesses around an external magnetic field (z-axis).</li>
                </ul>
            </div>
            <p class="text-xs text-slate-400">Note: In the simulation, we simplify by showing L and S coupling directly to J, with J precessing around the z-axis.</p>
        `,
        'jj-coupling': `
            <h2 class="text-xl font-bold mb-4 text-white">jj Coupling</h2>
            <p class="mb-4">
                Occurs primarily in <strong>heavier atoms</strong> where the relativistic spin-orbit interaction for individual electrons dominates over the electrostatic repulsion between different electrons.
            </p>
            <p class="mb-2"><strong>Coupling Scheme:</strong></p>
            <ol class="list-decimal pl-5 space-y-2 mb-4">
                <li>Each electron's orbital (<span class="math-text">l<sub>i</sub></span>) and spin (<span class="math-text">s<sub>i</sub></span>) couple strongly to form individual total angular momentum: <span class="math-text">j<sub>i</sub> = l<sub>i</sub> + s<sub>i</sub></span></li>
                <li>Individual <span class="math-text">j<sub>i</sub></span>'s couple weakly to form the atom's total J: <span class="math-text">J = Σ j<sub>i</sub></span></li>
            </ol>
            <div class="bg-slate-800 p-4 rounded-lg mb-4 border border-slate-700">
                <h3 class="font-semibold text-blue-400 mb-2">Precession Dynamics:</h3>
                <ul class="list-disc pl-5 space-y-2 text-xs">
                    <li><span class="math-text">l<sub>i</sub></span> and <span class="math-text">s<sub>i</sub></span> precess rapidly around their resultant <span class="math-text">j<sub>i</sub></span>.</li>
                    <li>The various <span class="math-text">j<sub>i</sub></span> vectors precess slowly around total <span class="math-text">J</span>.</li>
                    <li><span class="math-text">J</span> precesses around the external magnetic field at the <strong>Larmor frequency</strong> determined by the field strength.</li>
                </ul>
            </div>
        `
    };

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Camera
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(20, 15, 30);
    
    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 50;
    controls.minDistance = 5;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 20, 10);
    scene.add(directionalLight);

    // Coordinate System Group
    const coordGroup = new THREE.Group();
    scene.add(coordGroup);
    
    // Vectors Group (cleared on mode change)
    const vectorsGroup = new THREE.Group();
    scene.add(vectorsGroup);

    // Materials
    const materials = {
        zAxis: new THREE.LineDashedMaterial({ color: 0xff4444, dashSize: 0.5, gapSize: 0.2 }),
        xyPlane: new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.2, side: THREE.DoubleSide }),
        grid: new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.3 }),
        
        l: new THREE.MeshLambertMaterial({ color: 0x3b82f6 }), // Blue
        s: new THREE.MeshLambertMaterial({ color: 0xef4444 }), // Red
        j: new THREE.MeshLambertMaterial({ color: 0x10b981 }), // Green
        j1: new THREE.MeshLambertMaterial({ color: 0xf59e0b }), // Amber
        j2: new THREE.MeshLambertMaterial({ color: 0x8b5cf6 }), // Purple
        cone: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide })
    };

    const vectorColors = {
        l: 0x3b82f6, s: 0xef4444, j: 0x10b981, j1: 0xf59e0b, j2: 0x8b5cf6, totalJ: 0xec4899 // Pink for total J in jj
    };

    // --- 3D Helper Functions ---
    
    function drawCoordinateSystem() {
        coordGroup.clear();
        
        // Z-axis (External B-field direction)
        const zPoints = [];
        zPoints.push(new THREE.Vector3(0, -15, 0));
        zPoints.push(new THREE.Vector3(0, 15, 0));
        const zGeometry = new THREE.BufferGeometry().setFromPoints(zPoints);
        const zLine = new THREE.Line(zGeometry, materials.zAxis);
        zLine.computeLineDistances(); // required for dashed line
        coordGroup.add(zLine);
        
        // Z-axis label
        const sprite = createTextSprite("Z (B-field)", 0xff4444);
        sprite.position.set(0, 16, 0);
        coordGroup.add(sprite);

        // Grid Plane
        const gridHelper = new THREE.GridHelper(20, 20, 0x475569, 0x1e293b);
        coordGroup.add(gridHelper);
    }

    function createArrow(dir, origin, length, hex, labelText) {
        dir.normalize();
        const arrowHelper = new THREE.ArrowHelper(dir, origin, length, hex, length * 0.2, length * 0.1);
        
        // Add invisible cylinder for raycasting (tooltips)
        const cylinderGeo = new THREE.CylinderGeometry(length*0.1, length*0.1, length, 8);
        const cylinderMat = new THREE.MeshBasicMaterial({visible: false});
        const hitBox = new THREE.Mesh(cylinderGeo, cylinderMat);
        
        // Position and rotate hitbox to match arrow
        hitBox.position.copy(origin).add(dir.clone().multiplyScalar(length/2));
        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        hitBox.quaternion.copy(quaternion);
        
        hitBox.userData = { label: labelText }; // Data for tooltip
        
        const group = new THREE.Group();
        group.add(arrowHelper);
        group.add(hitBox);
        
        // Add label at tip
        if (labelText) {
            const sprite = createTextSprite(labelText.split(':')[0], hex); // Just the letter part
            sprite.position.copy(origin).add(dir.clone().multiplyScalar(length + 1));
            group.add(sprite);
        }
        
        return group;
    }

    function createPrecessionCone(origin, dir, length, angle) {
        const radius = length * Math.tan(angle);
        const geometry = new THREE.ConeGeometry(radius, length, 32, 1, true);
        const cone = new THREE.Mesh(geometry, materials.cone);
        
        // Shift geometry so origin is at the tip
        geometry.translate(0, -length/2, 0);
        
        cone.position.copy(origin).add(dir.clone().multiplyScalar(length));
        
        // Align cone along dir
        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir); // Pointing down to origin
        cone.quaternion.copy(quaternion);
        
        return cone;
    }

    function createTextSprite(text, colorHex) {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = 256;
        canvas.height = 128;
        context.font = "Bold 40px Arial";
        context.fillStyle = "#" + colorHex.toString(16).padStart(6, '0');
        context.textAlign = "center";
        context.fillText(text, 128, 64);
        
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(4, 2, 1);
        return sprite;
    }

    function calcMagnitude(qNum) {
        return Math.sqrt(qNum * (qNum + 1));
    }

    // --- Simulation Logic ---

    // Objects references for animation
    let animObjects = {
        sq: { vector: null, cone: null },
        ls: { L: null, S: null, J: null, coneJ: null },
        jj: { j1: null, j2: null, J: null, conej1: null, conej2: null, coneJ: null }
    };

    function buildSpaceQuantization() {
        vectorsGroup.clear();
        const l = STATE.sq.l;
        const m = STATE.sq.m;
        
        const magL = calcMagnitude(l);
        const Lz = m; // Projection on z
        
        // Calculate angle theta
        // cos(theta) = Lz / |L|
        const cosTheta = Lz / magL;
        const theta = Math.acos(cosTheta);
        
        const scale = 2; // Visual scaling
        
        // Base direction at t=0 (in xz plane)
        const dir = new THREE.Vector3(Math.sin(theta), Math.cos(theta), 0);
        
        const LGroup = new THREE.Group();
        const arrow = createArrow(dir, new THREE.Vector3(0,0,0), magL * scale, vectorColors.l, `L (l=${l}, m=${m})`);
        LGroup.add(arrow);
        
        // Draw Precession Cone
        if (magL > Math.abs(Lz)) { // Don't draw cone if perfectly aligned (which physically doesn't happen for L, but protects against math errors)
             const cone = createPrecessionCone(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0), Lz * scale, theta);
             vectorsGroup.add(cone);
             animObjects.sq.cone = cone; // if we want to animate cone
        }

        // Draw possible states phantom arrows
        for(let mi = -l; mi <= l; mi++) {
            if(mi === m) continue;
            const th = Math.acos(mi / magL);
            const d = new THREE.Vector3(Math.sin(th), Math.cos(th), 0);
            const ar = new THREE.ArrowHelper(d, new THREE.Vector3(0,0,0), magL*scale, 0x334155, magL*scale*0.1, magL*scale*0.1);
            ar.line.material.transparent = true; ar.line.material.opacity = 0.3;
            ar.cone.material.transparent = true; ar.cone.material.opacity = 0.3;
            vectorsGroup.add(ar);
        }

        vectorsGroup.add(LGroup);
        
        // Store for animation
        animObjects.sq.vector = LGroup;
        animObjects.sq.theta = theta;
        animObjects.sq.mag = magL * scale;
    }

    function buildLSCoupling() {
        vectorsGroup.clear();
        // L and S precess around J. J precesses around Z.
        const { L, S, J, Mj } = STATE.ls;
        
        const magL = calcMagnitude(L);
        const magS = calcMagnitude(S);
        const magJ = calcMagnitude(J);
        
        const scale = 1.5;
        
        // 1. J vector precessing around Z
        const cosThetaJ = Mj / magJ;
        // Handle floating point inaccuracies
        const safeCosJ = Math.max(-1, Math.min(1, cosThetaJ)); 
        const thetaJ = Math.acos(safeCosJ);
        
        const dirJ = new THREE.Vector3(Math.sin(thetaJ), Math.cos(thetaJ), 0);
        const JGroup = new THREE.Group();
        const arrowJ = createArrow(dirJ, new THREE.Vector3(0,0,0), magJ*scale, vectorColors.totalJ, `J=${J}, Mj=${Mj}`);
        JGroup.add(arrowJ);
        vectorsGroup.add(JGroup);
        
        const coneJ = createPrecessionCone(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0), Mj*scale, thetaJ);
        vectorsGroup.add(coneJ);

        // 2. L and S vectors precessing around J
        // Angle between J and L from law of cosines: S^2 = L^2 + J^2 - 2LJ cos(thetaLJ)
        let cosThetaLJ = 0;
        if (magJ > 0 && magL > 0) {
            cosThetaLJ = (magL*magL + magJ*magJ - magS*magS) / (2 * magL * magJ);
            cosThetaLJ = Math.max(-1, Math.min(1, cosThetaLJ));
        }
        const thetaLJ = Math.acos(cosThetaLJ);

        // Angle between J and S
        let cosThetaSJ = 0;
        if (magJ > 0 && magS > 0) {
            cosThetaSJ = (magS*magS + magJ*magJ - magL*magL) / (2 * magS * magJ);
            cosThetaSJ = Math.max(-1, Math.min(1, cosThetaSJ));
        }
        const thetaSJ = Math.acos(cosThetaSJ);

        // We attach L and S to the J group so they move with J
        // Inside J's local space, J is pointing along local Y (we will rotate JGroup later, actually wait, JGroup currently isn't rotated to align with dirJ, it just contains an arrow pointing to dirJ).
        // Let's restructure: Create a pivot for J that aligns its local Y axis with dirJ.
        
        // Re-do J with Pivot
        vectorsGroup.remove(JGroup);
        const JPivot = new THREE.Group();
        // Point JPivot's Y axis towards dirJ
        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirJ);
        JPivot.quaternion.copy(quaternion);
        
        // Now inside JPivot, J is just straight up (0,1,0)
        const localArrowJ = createArrow(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), magJ*scale, vectorColors.totalJ, `J=${J}`);
        JPivot.add(localArrowJ);
        
        // Add L inside JPivot, precessing around Y axis
        const dirL = new THREE.Vector3(Math.sin(thetaLJ), Math.cos(thetaLJ), 0);
        const LGroup = new THREE.Group();
        LGroup.add(createArrow(dirL, new THREE.Vector3(0,0,0), magL*scale, vectorColors.l, `L=${L}`));
        JPivot.add(LGroup);
        
        // Add S inside JPivot, opposite to L (phase difference pi)
        const dirS = new THREE.Vector3(Math.sin(-thetaSJ), Math.cos(thetaSJ), 0); // Negative X to balance L
        const SGroup = new THREE.Group();
        SGroup.add(createArrow(dirS, new THREE.Vector3(0,0,0), magS*scale, vectorColors.s, `S=${S}`));
        // We shift S origin to tip of L to show vector addition L + S = J ? 
        // Actually physically they are drawn from origin. Let's draw from origin.
        JPivot.add(SGroup);

        vectorsGroup.add(JPivot);

        // Store for animation
        animObjects.ls.JPivot = JPivot; // Precesses around global Y (Z-axis)
        animObjects.ls.LGroup = LGroup; // Precesses around JPivot local Y
        animObjects.ls.SGroup = SGroup; // Precesses around JPivot local Y
        animObjects.ls.thetaJ = thetaJ;
    }

    function buildJJCoupling() {
        vectorsGroup.clear();
        // j1 and j2 precess around J. J precesses around Z.
        const { j1, j2, J, Mj } = STATE.jj;
        
        const magj1 = calcMagnitude(j1);
        const magj2 = calcMagnitude(j2);
        const magJ = calcMagnitude(J);
        
        const scale = 1.2;
        
        // 1. J vector precessing around Z
        const cosThetaJ = Mj / magJ;
        const safeCosJ = Math.max(-1, Math.min(1, cosThetaJ)); 
        const thetaJ = Math.acos(safeCosJ);
        
        const dirJ = new THREE.Vector3(Math.sin(thetaJ), Math.cos(thetaJ), 0);
        
        const JPivot = new THREE.Group();
        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirJ);
        JPivot.quaternion.copy(quaternion);
        
        const localArrowJ = createArrow(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), magJ*scale, vectorColors.totalJ, `J=${J}`);
        JPivot.add(localArrowJ);
        
        const coneJ = createPrecessionCone(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0), Mj*scale, thetaJ);
        vectorsGroup.add(coneJ);

        // 2. j1 and j2 vectors precessing around J
        let cosThetaj1J = 0;
        if (magJ > 0 && magj1 > 0) {
            cosThetaj1J = (magj1*magj1 + magJ*magJ - magj2*magj2) / (2 * magj1 * magJ);
            cosThetaj1J = Math.max(-1, Math.min(1, cosThetaj1J));
        }
        const thetaj1J = Math.acos(cosThetaj1J);

        let cosThetaj2J = 0;
        if (magJ > 0 && magj2 > 0) {
            cosThetaj2J = (magj2*magj2 + magJ*magJ - magj1*magj1) / (2 * magj2 * magJ);
            cosThetaj2J = Math.max(-1, Math.min(1, cosThetaj2J));
        }
        const thetaj2J = Math.acos(cosThetaj2J);

        const dirj1 = new THREE.Vector3(Math.sin(thetaj1J), Math.cos(thetaj1J), 0);
        const j1Group = new THREE.Group();
        j1Group.add(createArrow(dirj1, new THREE.Vector3(0,0,0), magj1*scale, vectorColors.j1, `j1=${j1}`));
        JPivot.add(j1Group);
        
        const dirj2 = new THREE.Vector3(Math.sin(-thetaj2J), Math.cos(thetaj2J), 0); 
        const j2Group = new THREE.Group();
        j2Group.add(createArrow(dirj2, new THREE.Vector3(0,0,0), magj2*scale, vectorColors.j2, `j2=${j2}`));
        JPivot.add(j2Group);

        vectorsGroup.add(JPivot);

        // Store for animation
        animObjects.jj.JPivot = JPivot; 
        animObjects.jj.j1Group = j1Group; 
        animObjects.jj.j2Group = j2Group; 
        animObjects.jj.thetaJ = thetaJ;
    }

    // --- Animation Loop ---
    function animate() {
        STATE.animationId = requestAnimationFrame(animate);
        
        controls.update();
        
        if (STATE.isPrecessing) {
            // Calculate base speed scaled by Magnetic Field (Larmor Frequency analogue)
            // Cap the visual speed so it doesn't get nauseatingly fast
            const visualSpeedFactor = 0.02 * Math.max(0.1, STATE.magneticField); 
            STATE.time += visualSpeedFactor;
            
            if (STATE.currentMode === 'space-quant') {
                if (animObjects.sq.vector) {
                    // Precess around Z axis (global Y in ThreeJS)
                    animObjects.sq.vector.rotation.y = STATE.time;
                }
            } else if (STATE.currentMode === 'ls-coupling') {
                if (animObjects.ls.JPivot) {
                    // J precesses slowly around Z
                    // To precess JPivot around Z, we rotate it relative to origin, but it has a specific quaternion.
                    // Easier way: Put JPivot in another group that rotates.
                    // But we can just calculate new position.
                    const r = STATE.time * 0.5; // Slow precession for J
                    
                    // L and S precess rapidly around J (local Y)
                    const rFast = STATE.time * 2.0;
                    animObjects.ls.LGroup.rotation.y = rFast;
                    animObjects.ls.SGroup.rotation.y = rFast;
                    
                    // Rotate JPivot around global Y axis
                    // Create a rotation matrix around Y, apply to base vector to get new direction, set quaternion
                    const axis = new THREE.Vector3(0,1,0);
                    const angle = r;
                    const q = new THREE.Quaternion().setFromAxisAngle(axis, angle);
                    
                    const baseDir = new THREE.Vector3(Math.sin(animObjects.ls.thetaJ), Math.cos(animObjects.ls.thetaJ), 0);
                    baseDir.applyQuaternion(q);
                    
                    const newQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), baseDir);
                    animObjects.ls.JPivot.quaternion.copy(newQ);
                    
                    // Important: Rotating JPivot changes orientation of local Y.
                    // But L and S are rotating around local Y, which is correct.
                    // However, we also need to apply the rotation around Z to the whole JPivot so it revolves.
                    // Setting quaternion points it right, but doesn't "revolve" its local X/Z.
                    // Let's use a simpler hierarchy.
                }
            } else if (STATE.currentMode === 'jj-coupling') {
                 if (animObjects.jj.JPivot) {
                    const r = STATE.time * 0.5; // Slow precession for J
                    const rFast = STATE.time * 2.0; // Fast for j1, j2
                    
                    animObjects.jj.j1Group.rotation.y = rFast;
                    animObjects.jj.j2Group.rotation.y = rFast;
                    
                    const axis = new THREE.Vector3(0,1,0);
                    const q = new THREE.Quaternion().setFromAxisAngle(axis, r);
                    const baseDir = new THREE.Vector3(Math.sin(animObjects.jj.thetaJ), Math.cos(animObjects.jj.thetaJ), 0);
                    baseDir.applyQuaternion(q);
                    const newQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), baseDir);
                    animObjects.jj.JPivot.quaternion.copy(newQ);
                }
            }
        }
        
        // Raycasting for Tooltips
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(vectorsGroup.children, true);
        
        let foundTooltip = false;
        for (let i = 0; i < intersects.length; i++) {
            if (intersects[i].object.userData && intersects[i].object.userData.label) {
                tooltip.innerHTML = intersects[i].object.userData.label;
                tooltip.style.opacity = 1;
                // Position tooltip near mouse but offset
                tooltip.style.left = (mousePos.x + 15) + 'px';
                tooltip.style.top = (mousePos.y + 15) + 'px';
                foundTooltip = true;
                break;
            }
        }
        if (!foundTooltip) tooltip.style.opacity = 0;

        renderer.render(scene, camera);
    }

    // --- Interaction ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let mousePos = {x: 0, y: 0};
    const tooltip = document.getElementById('vector-tooltip');

    container.addEventListener('mousemove', (event) => {
        const rect = container.getBoundingClientRect();
        mousePos.x = event.clientX - rect.left;
        mousePos.y = event.clientY - rect.top;
        
        mouse.x = (mousePos.x / container.clientWidth) * 2 - 1;
        mouse.y = -(mousePos.y / container.clientHeight) * 2 + 1;
    });
    
    container.addEventListener('mouseleave', () => {
        tooltip.style.opacity = 0;
    });

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function resetCamera() {
        camera.position.set(20, 15, 30);
        controls.target.set(0,0,0);
    }

    function togglePrecession() {
        STATE.isPrecessing = !STATE.isPrecessing;
        const btn = document.getElementById('btn-precess');
        if (STATE.isPrecessing) {
            btn.textContent = "Stop Precession";
            btn.classList.replace("bg-slate-600", "bg-blue-600");
            btn.classList.replace("hover:bg-slate-500", "hover:bg-blue-500");
            btn.classList.add("shadow-blue-500/50");
        } else {
            btn.textContent = "Start Precession";
            btn.classList.replace("bg-blue-600", "bg-slate-600");
            btn.classList.replace("hover:bg-blue-500", "hover:bg-slate-500");
            btn.classList.remove("shadow-blue-500/50");
        }
    }

    // --- UI Update Logic ---
    function updateLegend() {
        const legend = document.getElementById('legend-container');
        let html = '<h4 class="text-white font-semibold mb-2 border-b border-slate-600 pb-1">Legend</h4><div class="space-y-1 text-sm">';
        
        const addLegendItem = (colorHex, label) => {
            const colorStr = '#' + colorHex.toString(16).padStart(6, '0');
            html += `<div class="flex items-center"><div class="w-3 h-3 rounded-full mr-2" style="background-color: ${colorStr}; shadow: 0 0 5px ${colorStr}"></div><span>${label}</span></div>`;
        };
        
        addLegendItem(0xff4444, "B-field (z-axis)");

        if (STATE.currentMode === 'space-quant') {
            addLegendItem(vectorColors.l, "Orbital Ang. Mom. (L)");
        } else if (STATE.currentMode === 'ls-coupling') {
            addLegendItem(vectorColors.l, "Total Orbital (L)");
            addLegendItem(vectorColors.s, "Total Spin (S)");
            addLegendItem(vectorColors.totalJ, "Total J (L+S)");
        } else if (STATE.currentMode === 'jj-coupling') {
            addLegendItem(vectorColors.j1, "Electron 1 (j1)");
            addLegendItem(vectorColors.j2, "Electron 2 (j2)");
            addLegendItem(vectorColors.totalJ, "Total J (j1+j2)");
        }
        
        html += '</div>';
        legend.innerHTML = html;
    }

    function generateControls() {
        const container = document.getElementById('controls-container');
        let html = '';

        const createSlider = (id, label, min, max, step, value, onChangeFunc) => `
            <div class="flex flex-col">
                <div class="flex justify-between mb-1">
                    <label for="${id}" class="text-sm font-medium text-slate-300">${label}</label>
                    <span id="${id}-val" class="text-sm font-bold text-blue-400">${value}</span>
                </div>
                <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" 
                       oninput="${onChangeFunc}(this.value)" class="w-full">
            </div>
        `;

        if (STATE.currentMode === 'space-quant') {
            html += `
                <div class="col-span-1 md:col-span-2"><h3 class="text-white font-semibold mb-2">Parameters:</h3></div>
                ${createSlider('sq-l', 'Orbital Quantum Number (l)', 0, 5, 1, STATE.sq.l, 'updateSQL')}
                ${createSlider('sq-m', 'Magnetic Quantum Number (m<sub>l</sub>)', -STATE.sq.l, STATE.sq.l, 1, STATE.sq.m, 'updateSQM')}
                <div class="col-span-1 md:col-span-2 text-xs text-slate-400 mt-2">
                    Magnitude |L| = √(${STATE.sq.l}(${STATE.sq.l}+1))ℏ ≈ ${(Math.sqrt(STATE.sq.l*(STATE.sq.l+1))).toFixed(2)}ℏ<br>
                    z-component L<sub>z</sub> = ${STATE.sq.m}ℏ
                </div>
            `;
        } else if (STATE.currentMode === 'ls-coupling') {
            // Simplified UI: Select L and S, then J and Mj
            html += `
                <div>
                    <h3 class="text-white font-semibold mb-2">Base Vectors:</h3>
                    ${createSlider('ls-L', 'Total Orbital (L)', 0, 4, 1, STATE.ls.L, 'updateLSL')}
                    ${createSlider('ls-S', 'Total Spin (S)', 0, 2, 0.5, STATE.ls.S, 'updateLSS')}
                </div>
                <div>
                    <h3 class="text-white font-semibold mb-2">Coupled State:</h3>
                    <div id="ls-j-selector" class="mb-3">
                        <!-- J dropdown populated dynamically -->
                    </div>
                    <div id="ls-mj-selector">
                         <!-- Mj dropdown populated dynamically -->
                    </div>
                </div>
            `;
        } else if (STATE.currentMode === 'jj-coupling') {
            html += `
                <div>
                    <h3 class="text-white font-semibold mb-2">Electron j's:</h3>
                    ${createSlider('jj-j1', 'Electron 1 (j1)', 0.5, 3.5, 1, STATE.jj.j1, 'updateJJj1')}
                    ${createSlider('jj-j2', 'Electron 2 (j2)', 0.5, 4.5, 1, STATE.jj.j2, 'updateJJj2')}
                </div>
                <div>
                    <h3 class="text-white font-semibold mb-2">Coupled State:</h3>
                    <div id="jj-j-selector" class="mb-3"></div>
                    <div id="jj-mj-selector"></div>
                </div>
            `;
        }
        
        container.innerHTML = html;
        
        if(STATE.currentMode === 'ls-coupling') updateLSJOptions();
        if(STATE.currentMode === 'jj-coupling') updateJJJOptions();
    }

    // --- Control Handlers ---

    // Space Quantization
    window.updateSQL = function(val) {
        val = parseInt(val);
        STATE.sq.l = val;
        document.getElementById('sq-l-val').innerText = val;
        
        const mSlider = document.getElementById('sq-m');
        mSlider.min = -val;
        mSlider.max = val;
        
        if (STATE.sq.m > val) STATE.sq.m = val;
        if (STATE.sq.m < -val) STATE.sq.m = -val;
        mSlider.value = STATE.sq.m;
        document.getElementById('sq-m-val').innerText = STATE.sq.m;
        
        generateControls(); // refresh text
        buildSpaceQuantization();
    }
    window.updateSQM = function(val) {
        val = parseInt(val);
        STATE.sq.m = val;
        document.getElementById('sq-m-val').innerText = val;
        generateControls();
        buildSpaceQuantization();
    }

    // LS Coupling
    window.updateLSL = function(val) {
        STATE.ls.L = parseInt(val);
        document.getElementById('ls-L-val').innerText = STATE.ls.L;
        updateLSJOptions();
    }
    window.updateLSS = function(val) {
        STATE.ls.S = parseFloat(val);
        document.getElementById('ls-S-val').innerText = STATE.ls.S;
        updateLSJOptions();
    }
    
    function updateLSJOptions() {
        const { L, S } = STATE.ls;
        const jMin = Math.abs(L - S);
        const jMax = L + S;
        
        let jOptions = [];
        for (let j = jMin; j <= jMax; j++) jOptions.push(j);
        
        // Ensure current J is valid
        if (!jOptions.includes(STATE.ls.J)) STATE.ls.J = jOptions[0];
        
        let html = `<label class="text-sm font-medium text-slate-300 block mb-1">Total J (|L-S| to L+S)</label>
                    <select id="ls-j-select" class="w-full bg-slate-700 text-white rounded p-1" onchange="window.handleLSJChange(this.value)">`;
        jOptions.forEach(j => {
            html += `<option value="${j}" ${j === STATE.ls.J ? 'selected' : ''}>${j}</option>`;
        });
        html += `</select>`;
        
        const container = document.getElementById('ls-j-selector');
        if(container) {
            container.innerHTML = html;
            updateLSMjOptions();
        }
    }
    
    window.handleLSJChange = function(val) {
        STATE.ls.J = parseFloat(val);
        updateLSMjOptions();
    }

    function updateLSMjOptions() {
        const J = STATE.ls.J;
        let mjOptions = [];
        for (let mj = -J; mj <= J; mj++) mjOptions.push(mj);
        
        if (!mjOptions.includes(STATE.ls.Mj)) STATE.ls.Mj = mjOptions[mjOptions.length-1]; // Default to max
        
        let html = `<label class="text-sm font-medium text-slate-300 block mb-1">M<sub>J</sub> (-J to J)</label>
                    <select id="ls-mj-select" class="w-full bg-slate-700 text-white rounded p-1" onchange="window.handleLSMjChange(this.value)">`;
        mjOptions.forEach(mj => {
            html += `<option value="${mj}" ${mj === STATE.ls.Mj ? 'selected' : ''}>${mj}</option>`;
        });
        html += `</select>`;
        
        const container = document.getElementById('ls-mj-selector');
        if(container) {
            container.innerHTML = html;
            buildLSCoupling();
        }
    }
    
    window.handleLSMjChange = function(val) {
        STATE.ls.Mj = parseFloat(val);
        buildLSCoupling();
    }

    // JJ Coupling
    window.updateJJj1 = function(val) {
        STATE.jj.j1 = parseFloat(val);
        document.getElementById('jj-j1-val').innerText = STATE.jj.j1;
        updateJJJOptions();
    }
    window.updateJJj2 = function(val) {
        STATE.jj.j2 = parseFloat(val);
        document.getElementById('jj-j2-val').innerText = STATE.jj.j2;
        updateJJJOptions();
    }

    function updateJJJOptions() {
        const { j1, j2 } = STATE.jj;
        const jMin = Math.abs(j1 - j2);
        const jMax = j1 + j2;
        
        let jOptions = [];
        for (let j = jMin; j <= jMax; j++) jOptions.push(j);
        
        if (!jOptions.includes(STATE.jj.J)) STATE.jj.J = jOptions[0];
        
        let html = `<label class="text-sm font-medium text-slate-300 block mb-1">Total J (|j1-j2| to j1+j2)</label>
                    <select id="jj-j-select" class="w-full bg-slate-700 text-white rounded p-1" onchange="window.handleJJJChange(this.value)">`;
        jOptions.forEach(j => {
            html += `<option value="${j}" ${j === STATE.jj.J ? 'selected' : ''}>${j}</option>`;
        });
        html += `</select>`;
        
        const container = document.getElementById('jj-j-selector');
        if(container) {
            container.innerHTML = html;
            updateJJMjOptions();
        }
    }

    window.handleJJJChange = function(val) {
        STATE.jj.J = parseFloat(val);
        updateJJMjOptions();
    }

    function updateJJMjOptions() {
        const J = STATE.jj.J;
        let mjOptions = [];
        for (let mj = -J; mj <= J; mj++) mjOptions.push(mj);
        
        if (!mjOptions.includes(STATE.jj.Mj)) STATE.jj.Mj = mjOptions[mjOptions.length-1]; 
        
        let html = `<label class="text-sm font-medium text-slate-300 block mb-1">M<sub>J</sub> (-J to J)</label>
                    <select id="jj-mj-select" class="w-full bg-slate-700 text-white rounded p-1" onchange="window.handleJJMjChange(this.value)">`;
        mjOptions.forEach(mj => {
            html += `<option value="${mj}" ${mj === STATE.jj.Mj ? 'selected' : ''}>${mj}</option>`;
        });
        html += `</select>`;
        
        const container = document.getElementById('jj-mj-selector');
        if(container) {
             container.innerHTML = html;
             buildJJCoupling();
        }
    }

    window.handleJJMjChange = function(val) {
        STATE.jj.Mj = parseFloat(val);
        buildJJCoupling();
    }

    // Global Physics Controls
    window.updateGlobalBField = function(val) {
        const bField = parseFloat(val);
        STATE.magneticField = bField;
        
        // Update UI displays
        document.getElementById('global-b-field-val').innerText = bField.toFixed(1);
        
        // Calculate and display approximate Larmor frequency (omega = gamma * B)
        const larmorFreq = bField * STATE.baseLarmorFreqPerTesla;
        document.getElementById('larmor-freq-display').innerText = larmorFreq.toFixed(2) + ' GHz';
    }

    // --- App Initialization ---
    window.switchTab = function(mode) {
        STATE.currentMode = mode;
        
        // Update styling
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${mode}`).classList.add('active');
        
        // Update content
        document.getElementById('theory-content').innerHTML = THEORY[mode];
        updateLegend();
        generateControls();
        
        // Build 3D Scene
        STATE.time = 0; // Reset animation time
        if (mode === 'space-quant') buildSpaceQuantization();
        else if (mode === 'ls-coupling') buildLSCoupling();
        else if (mode === 'jj-coupling') buildJJCoupling();
    }

    // Initialize
    window.onload = function() {
        drawCoordinateSystem();
        switchTab('space-quant');
        animate();
    };

</script>
</body>
