name: Build fork stacked PR base

on:
  workflow_dispatch:
    inputs:
      current_pr:
        description: PR to test
        required: true
        type: string
      target_pr:
        description: Fork PR to combine with
        required: true
        type: string
  pull_request_target:
    types:
      - labeled

jobs:
  build:
    name: Build integration base
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'stack-test-request'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Build and apply fork integration base
        uses: actions/github-script@v9
        env:
          INPUT_CURRENT_PR: ${{ inputs.current_pr }}
          INPUT_TARGET_PR: ${{ inputs.target_pr }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- upes-physics-stack-status -->';
            const targetMarkerPattern = /<!-- upes-physics-stack-target:(\d+) -->/;

            let currentNumber;
            let targetNumber;

            if (context.eventName === 'pull_request_target') {
              currentNumber = context.payload.pull_request.number;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: currentNumber, per_page: 100 }
              );
              const requestComment = [...comments].reverse().find(comment =>
                comment.user?.type === 'Bot' &&
                targetMarkerPattern.test(comment.body || '')
              );
              const match = requestComment?.body?.match(targetMarkerPattern);
              targetNumber = match ? Number(match[1]) : NaN;
            } else {
              currentNumber = Number(process.env.INPUT_CURRENT_PR);
              targetNumber = Number(process.env.INPUT_TARGET_PR);
            }

            async function publishStatus(message) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: currentNumber, per_page: 100 }
              );
              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );
              const body = `${marker}\n${message}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: currentNumber, body,
                });
              }
            }

            async function removeRequestLabel() {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: currentNumber,
                  name: 'stack-test-request',
                });
              } catch (error) {
                if (error.status !== 404) {
                  core.warning(`Could not remove request label: ${error.message}`);
                }
              }
            }

            if (!Number.isInteger(currentNumber) || !Number.isInteger(targetNumber)) {
              if (Number.isInteger(currentNumber)) {
                await publishStatus('⛔ Could not determine the fork PR requested for this stacked test.');
                await removeRequestLabel();
              }
              return;
            }

            const current = (await github.rest.pulls.get({
              owner, repo, pull_number: currentNumber,
            })).data;
            const target = (await github.rest.pulls.get({
              owner, repo, pull_number: targetNumber,
            })).data;

            if (current.state !== 'open' || target.state !== 'open') {
              await publishStatus('⛔ Both pull requests must still be open to build a stacked test.');
              await removeRequestLabel();
              return;
            }

            if (target.head.repo?.full_name === `${owner}/${repo}`) {
              await publishStatus([
                '⛔ Fork integration builder received a same-repository target.',
                '',
                'Run the normal `test with PR <number>` command again.',
              ].join('\n'));
              await removeRequestLabel();
              return;
            }

            if (target.base.ref !== 'main') {
              await publishStatus([
                `⛔ Fork PR #${targetNumber} is based on \`${target.base.ref}\`, not \`main\`.`,
                '',
                'Fork-based stacked tests require the target PR to be opened against `main`.',
              ].join('\n'));
              await removeRequestLabel();
              return;
            }

            if (!target.merge_commit_sha) {
              await publishStatus([
                `⛔ GitHub has not produced a mergeable test commit for fork PR #${targetNumber}.`,
                '',
                'Resolve conflicts in the target PR, then run the command again.',
              ].join('\n'));
              await removeRequestLabel();
              return;
            }

            const branch = `pr-stack/pr-${currentNumber}-with-${targetNumber}`;

            try {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                  sha: target.merge_commit_sha,
                  force: true,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branch}`,
                  sha: target.merge_commit_sha,
                });
              }

              try {
                await github.rest.repos.merge({
                  owner,
                  repo,
                  base: branch,
                  head: 'main',
                  commit_message: `Refresh ${branch} with latest main`,
                });
              } catch (error) {
                if (error.status !== 204) throw error;
              }
            } catch (error) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              } catch (_) {}
              await publishStatus([
                '## ⛔ Could not build fork integration base',
                '',
                `PR #${targetNumber} could not be combined cleanly with the latest \`main\`.`,
                '',
                `GitHub reported: ${error.message}`,
              ].join('\n'));
              await removeRequestLabel();
              return;
            }

            const previousBase = current.base.ref;
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: currentNumber,
              base: branch,
            });

            if (
              previousBase?.startsWith(`pr-stack/pr-${currentNumber}-with-`) &&
              previousBase !== branch
            ) {
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${previousBase}`,
                });
              } catch (error) {
                if (error.status !== 404) {
                  core.warning(`Could not delete old integration base: ${error.message}`);
                }
              }
            }

            await removeRequestLabel();
            await publishStatus([
              '## 🧪 Stacked PR test enabled',
              '',
              `PR #${currentNumber} will now be tested together with fork PR #${targetNumber}.`,
              `Fork source: \`${target.head.repo.full_name}:${target.head.ref}\``,
              `Internal test base: \`${branch}\``,
              '',
              `The validation checkout represents \`latest main + PR #${targetNumber} + PR #${currentNumber}\`.`,
              '',
              'The checks and PR preview will rerun automatically.',
              'Use `test with main` on this PR to remove the stack.',
            ].join('\n'));
