name: Finalize PR 40

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.issue.pull_request != null && github.event.issue.number == 40 && github.event.comment.body == '/finalize-pr40'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phys2025
          fetch-depth: 0
      - name: Merge latest main into PR
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit
          git push origin phys2025
      - name: Remove workflow from main
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/finalize-pr40.yml
          git commit -m 'Remove temporary PR 40 finalizer'
          git push origin main
      - name: Merge cleanup commit into PR
        run: |
          set -euo pipefail
          git checkout phys2025
          git fetch origin main
          git merge origin/main --no-edit
          git push origin phys2025
