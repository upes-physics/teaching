name: Remove closed PR preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

concurrency:
  group: pages-branch-write
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove PR preview
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      deployments: read

    steps:
      - name: Create empty deployment directory
        run: mkdir -p empty-preview

      - name: Remove preview from gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: empty-preview
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          clean: true
          force: false
          commit-message: Remove preview for PR ${{ github.event.pull_request.number }}

      - name: Mark preview as removed
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- upes-physics-preview-link -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const body = [
              marker,
              '## 🧹 PR preview removed',
              '',
              'The temporary preview was removed because this pull request is closed.',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
