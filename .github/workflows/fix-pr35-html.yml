name: One-time PHYS8094 HTML repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pr35-html.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair PR 35 HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Normalize PHYS8094 HTML and fix malformed blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('data/pg/sem3/PHYS8094')

          def normalize_attribute_quotes(text: str) -> str:
              # Preserve JavaScript and CSS verbatim. Only rewrite attributes in
              # actual HTML tags outside <script> and <style> blocks.
              blocks = re.split(
                  r'(<(?:script|style)\b[^>]*>.*?</(?:script|style)>)',
                  text,
                  flags=re.IGNORECASE | re.DOTALL,
              )

              def fix_tag(match):
                  tag = match.group(0)

                  def fix_attr(attr_match):
                      name = attr_match.group(1)
                      equals = attr_match.group(2)
                      value = attr_match.group(3).replace('"', '&quot;')
                      return f'{name}{equals}"{value}"'

                  return re.sub(
                      r"(\s[\w:-]+)(\s*=\s*)'([^']*)'",
                      fix_attr,
                      tag,
                  )

              for index in range(0, len(blocks), 2):
                  blocks[index] = re.sub(r'<[^>]+>', fix_tag, blocks[index])
              return ''.join(blocks)

          # Unit 1: remove the extra container-closing div inserted between the
          # force visualization and the tunnelling section.
          unit1 = root / 'msc_unit01.html'
          text = unit1.read_text(encoding='utf-8')
          old = "\n</div>\n\n</div>\n    <div class='section'>"
          new = "\n</div>\n\n    <div class='section'>"
          if old not in text:
              raise SystemExit('Expected Unit 1 malformed div block was not found')
          text = text.replace(old, new, 1)
          unit1.write_text(normalize_attribute_quotes(text), encoding='utf-8')

          # Unit 2: remove an empty <details> wrapper containing a stray </div>.
          # The replacement leaves exactly the two div closures required for
          # the .tight and .card containers.
          unit2 = root / 'msc_unit02.html'
          text = unit2.read_text(encoding='utf-8')
          old = (
              "      <details>\n"
              "        </div>\n"
              "      </details>\n"
              "    </div>\n"
              "  </div>\n\n"
              "  <div class=\"grid\">"
          )
          new = (
              "    </div>\n"
              "  </div>\n\n"
              "  <div class=\"grid\">"
          )
          if old not in text:
              raise SystemExit('Expected Unit 2 malformed details block was not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "function semfTerms(A,Z,coeff,pairEnabled=true){\n  const N = A - Z;\n",
              "function semfTerms(A,Z,coeff,pairEnabled=true){\n",
              1,
          )
          text = text.replace("  let prev = {};\n", "", 1)
          unit2.write_text(normalize_attribute_quotes(text), encoding='utf-8')

          # Unit 3: cls is assigned in every branch before use; avoid an unused
          # initial value while preserving the classifier behaviour.
          unit3 = root / 'msc_unit03.html'
          text = unit3.read_text(encoding='utf-8')
          old = '  let label="", cls="good", text="";'
          new = '  let label="", cls, text="";'
          if old not in text:
              raise SystemExit('Expected Unit 3 cls initialization was not found')
          text = text.replace(old, new, 1)
          unit3.write_text(normalize_attribute_quotes(text), encoding='utf-8')

          # Unit 4: .section and .container are both open at the end, but only
          # one was closed. Add the missing container closure.
          unit4 = root / 'msc_unit04.html'
          text = unit4.read_text(encoding='utf-8')
          old = "    <div class='footer'>Built for teaching notes. Replace placeholders freely. AI-integrated items are highlighted.</div>\n  </div>\n</main>"
          new = "    <div class='footer'>Built for teaching notes. Replace placeholders freely. AI-integrated items are highlighted.</div>\n  </div>\n  </div>\n</main>"
          if old not in text:
              raise SystemExit('Expected Unit 4 closing block was not found')
          text = text.replace(old, new, 1)
          unit4.write_text(normalize_attribute_quotes(text), encoding='utf-8')

          # Units 5 and any future PHYS8094 pages get the same quote-style
          # normalization, without touching their embedded JS/CSS.
          for path in sorted(root.glob('*.html')):
              if path in {unit1, unit2, unit3, unit4}:
                  continue
              path.write_text(
                  normalize_attribute_quotes(path.read_text(encoding='utf-8')),
                  encoding='utf-8',
              )
          PY

      - name: Validate repaired HTML
        shell: bash
        run: |
          set -euo pipefail
          npx --yes htmlhint@1 --format unix --nocolor "data/pg/sem3/PHYS8094/*.html"
          git diff --check

      - name: Commit repairs to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pg/sem3/PHYS8094
          if git diff --cached --quiet; then
            echo "No repairs were necessary."
            exit 0
          fi
          git commit -m "Fix PHYS8094 HTML validation"
          git push origin HEAD:dev
