name: PR labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  issue_comment:
    types:
      - created

jobs:
  auto-label:
    name: Apply path labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Apply configured labels
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const defaultBranch = context.payload.repository.default_branch;

            const configResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/label-rules.json',
              ref: defaultBranch,
            });

            const config = JSON.parse(
              Buffer.from(configResponse.data.content, 'base64').toString('utf8')
            );
            const rules = Array.isArray(config.labels) ? config.labels : [];

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            const activeFiles = files
              .filter(file => file.status !== 'removed')
              .map(file => file.filename);

            const currentLabels = new Set(
              (pr.labels || []).map(label => label.name.toLowerCase())
            );

            async function ensureLabel(rule) {
              let label;
              try {
                const response = await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: rule.name,
                });
                label = response.data;
              } catch (error) {
                if (error.status !== 404) throw error;
                const response = await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: rule.name,
                  color: String(rule.color || 'D4C5F9').replace('#', ''),
                  description: rule.description || '',
                });
                label = response.data;
              }

              if (label.name !== rule.name) {
                const response = await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  new_name: rule.name,
                  color: String(rule.color || label.color || 'D4C5F9').replace('#', ''),
                  description: rule.description ?? label.description ?? '',
                });
                label = response.data;
              }

              return label.name;
            }

            for (const rule of rules) {
              if (!rule?.name) continue;
              const paths = Array.isArray(rule.paths) ? rule.paths : [];
              if (!paths.length) continue;

              const canonicalName = await ensureLabel(rule);
              const shouldHave = activeFiles.some(filename =>
                paths.some(prefix => filename.startsWith(prefix))
              );
              const hasLabel = currentLabels.has(canonicalName.toLowerCase());

              if (shouldHave && !hasLabel) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [canonicalName],
                });
                currentLabels.add(canonicalName.toLowerCase());
              }

              if (!shouldHave && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: canonicalName,
                });
                currentLabels.delete(canonicalName.toLowerCase());
              }
            }

  manual-label:
    name: Handle reviewer label command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Handle label command
        uses: actions/github-script@v9
        with:
          script: |
            const rawBody = context.payload.comment.body.trim();
            const match = rawBody.match(/^label\s+(.+?)\s*$/i);
            if (!match) {
              core.info('Comment is not a label command.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;
            const actor = context.actor;
            let requestedName = match[1].trim();

            if (
              (requestedName.startsWith('"') && requestedName.endsWith('"')) ||
              (requestedName.startsWith("'") && requestedName.endsWith("'"))
            ) {
              requestedName = requestedName.slice(1, -1).trim();
            }

            if (!requestedName) {
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.notice(`PR #${prNumber} is not open.`);
              return;
            }

            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: actor,
              });
              permission = data.permission;
            } catch (error) {
              core.info(`No repository permission record for ${actor}.`);
            }

            const isMaintainer = ['triage', 'write', 'maintain', 'admin'].includes(permission);
            const isRequestedReviewer = (pr.requested_reviewers || [])
              .some(reviewer => reviewer.login === actor);

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );
            const hasReviewed = reviews.some(review => review.user?.login === actor);

            if (!isMaintainer && !isRequestedReviewer && !hasReviewed) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `⛔ @${actor}, the \`label <label name>\` command is restricted to repository maintainers and reviewers of this pull request.`,
              });
              return;
            }

            const defaultBranch = context.payload.repository.default_branch;
            const configResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/label-rules.json',
              ref: defaultBranch,
            });
            const config = JSON.parse(
              Buffer.from(configResponse.data.content, 'base64').toString('utf8')
            );
            const rules = Array.isArray(config.labels) ? config.labels : [];

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              }
            );

            let label = repoLabels.find(
              candidate => candidate.name.toLowerCase() === requestedName.toLowerCase()
            );

            if (!label) {
              const rule = rules.find(
                candidate => candidate?.name?.toLowerCase() === requestedName.toLowerCase()
              );

              if (!rule) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: [
                    `⛔ Label \`${requestedName}\` does not exist.`,
                    '',
                    'Create it in the repository first, or add it to `.github/label-rules.json` so the bot can create it automatically.',
                  ].join('\n'),
                });
                return;
              }

              const response = await github.rest.issues.createLabel({
                owner,
                repo,
                name: rule.name,
                color: String(rule.color || 'D4C5F9').replace('#', ''),
                description: rule.description || '',
              });
              label = response.data;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [label.name],
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `🏷️ @${actor} added label \`${label.name}\` to PR #${prNumber}.`,
            });
