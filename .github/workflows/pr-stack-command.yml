name: PR commands

on:
  issue_comment:
    types:
      - created

jobs:
  commands:
    name: Handle PR comment commands
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Handle PR command
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const labelMatch = body.match(/^label\s+(.+?)\s*$/i);
            const stackMatch = body.match(
              /^test\s+with\s+(?:#\s*)?(?:pr\s*)?#?\s*(\d+)(?:\s+and\s+main)?\s*$/i
            );
            const resetMatch = /^test\s+with\s+main\s*$/i.test(body);

            if (!labelMatch && !stackMatch && !resetMatch) {
              core.info('Comment is not a recognized PR command.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentNumber = context.issue.number;
            const actor = context.actor;

            const current = (await github.rest.pulls.get({
              owner, repo, pull_number: currentNumber,
            })).data;

            if (current.state !== 'open') {
              core.notice(`PR #${currentNumber} is not open.`);
              return;
            }

            let permission = 'none';
            try {
              permission = (await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: actor,
              })).data.permission;
            } catch (error) {
              core.info(`No collaborator permission record for ${actor}.`);
            }

            if (labelMatch) {
              let requestedName = labelMatch[1].trim();
              if (
                (requestedName.startsWith('"') && requestedName.endsWith('"')) ||
                (requestedName.startsWith("'") && requestedName.endsWith("'"))
              ) {
                requestedName = requestedName.slice(1, -1).trim();
              }

              const isMaintainer = ['triage', 'write', 'maintain', 'admin'].includes(permission);
              const isRequestedReviewer = (current.requested_reviewers || [])
                .some(reviewer => reviewer.login === actor);

              let hasReviewed = false;
              try {
                const reviews = await github.paginate(
                  github.rest.pulls.listReviews,
                  { owner, repo, pull_number: currentNumber, per_page: 100 }
                );
                hasReviewed = reviews.some(review => review.user?.login === actor);
              } catch (error) {
                core.warning(`Could not inspect submitted reviews: ${error.message}`);
              }

              if (!isMaintainer && !isRequestedReviewer && !hasReviewed) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: currentNumber,
                  body: `⛔ @${actor}, the \`label <label name>\` command is restricted to repository maintainers and reviewers of this pull request.`,
                });
                return;
              }

              const repoLabels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 }
              );
              let label = repoLabels.find(candidate =>
                candidate.name.toLowerCase() === requestedName.toLowerCase()
              );

              if (!label) {
                const configResponse = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/label-rules.json',
                  ref: context.payload.repository.default_branch,
                });
                const config = JSON.parse(
                  Buffer.from(configResponse.data.content, 'base64').toString('utf8')
                );
                const rules = Array.isArray(config.labels) ? config.labels : [];
                const rule = rules.find(candidate =>
                  candidate?.name?.toLowerCase() === requestedName.toLowerCase()
                );

                if (!rule) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: currentNumber,
                    body: [
                      `⛔ Label \`${requestedName}\` does not exist.`,
                      '',
                      'Create it in the repository first, or add it to `.github/label-rules.json`.',
                    ].join('\n'),
                  });
                  return;
                }

                label = (await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: rule.name,
                  color: String(rule.color || 'D4C5F9').replace('#', ''),
                  description: rule.description || '',
                })).data;
              }

              await github.rest.issues.addLabels({
                owner, repo, issue_number: currentNumber, labels: [label.name],
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: currentNumber,
                body: `🏷️ @${actor} added label \`${label.name}\` to PR #${currentNumber}.`,
              });
              return;
            }

            if (!['admin', 'maintain', 'write'].includes(permission)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: currentNumber,
                body: `⛔ @${actor}, stacked-PR commands are restricted to repository maintainers with write access.`,
              });
              return;
            }

            const marker = '<!-- upes-physics-stack-status -->';
            async function publishStatus(message) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: currentNumber, per_page: 100 }
              );
              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );
              const statusBody = `${marker}\n${message}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: statusBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: currentNumber, body: statusBody,
                });
              }
            }

            async function deleteTemporaryBase(ref) {
              if (!ref?.startsWith(`pr-stack/pr-${currentNumber}-with-`)) return;
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${ref}`,
                });
              } catch (error) {
                core.info(`Temporary base ${ref} will be cleaned up later: ${error.message}`);
              }
            }

            if (resetMatch) {
              if (current.base.ref === 'main') {
                await publishStatus(
                  `ℹ️ PR #${currentNumber} is already tested directly against \`main\`.`
                );
                return;
              }

              const previousBase = current.base.ref;
              await github.rest.pulls.update({
                owner, repo, pull_number: currentNumber, base: 'main',
              });
              await deleteTemporaryBase(previousBase);
              await publishStatus([
                '## 🧪 PR test base updated',
                '',
                `PR #${currentNumber} is now tested directly against \`main\`.`,
                '',
                'The normal validation and preview workflows will rerun automatically.',
              ].join('\n'));
              return;
            }

            const targetNumber = Number(stackMatch[1]);
            if (targetNumber === currentNumber) {
              await publishStatus('⛔ A pull request cannot be stacked on itself.');
              return;
            }

            let target;
            try {
              target = (await github.rest.pulls.get({
                owner, repo, pull_number: targetNumber,
              })).data;
            } catch (error) {
              if (error.status === 404) {
                await publishStatus(`⛔ PR #${targetNumber} does not exist.`);
                return;
              }
              throw error;
            }

            if (target.state !== 'open') {
              await publishStatus(
                `⛔ PR #${targetNumber} is not open. Only open PRs can be used as a stacked test base.`
              );
              return;
            }

            if (
              target.head.ref === current.head.ref &&
              target.head.repo?.full_name === current.head.repo?.full_name
            ) {
              await publishStatus('⛔ Both PRs use the same head branch and cannot be stacked.');
              return;
            }

            if (
              target.base.ref === current.head.ref &&
              target.base.repo?.full_name === `${owner}/${repo}`
            ) {
              await publishStatus([
                '## ⛔ Stacked PR test rejected',
                '',
                `PR #${targetNumber} is based on \`${current.head.ref}\`, which is the head branch of PR #${currentNumber}.`,
                `Stacking PR #${currentNumber} on PR #${targetNumber} would create a circular dependency.`,
                '',
                'Choose another open PR whose base does not depend on this PR.',
              ].join('\n'));
              return;
            }

            const targetIsFork = target.head.repo?.full_name !== `${owner}/${repo}`;

            if (targetIsFork) {
              if (target.base.ref !== 'main') {
                await publishStatus([
                  `⛔ Fork PR #${targetNumber} is based on \`${target.base.ref}\`, not \`main\`.`,
                  '',
                  'Fork-based stacked tests currently require the target PR to be opened against `main`.',
                ].join('\n'));
                return;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'pr-stack-fork-build.yml',
                ref: 'main',
                inputs: {
                  current_pr: String(currentNumber),
                  target_pr: String(targetNumber),
                },
              });

              await publishStatus([
                '## 🧪 Fork stacked PR test requested',
                '',
                `Preparing PR #${currentNumber} together with fork PR #${targetNumber}.`,
                `Fork source: \`${target.head.repo.full_name}:${target.head.ref}\``,
                '',
                'A trusted workflow is building an internal integration base from latest `main` + the fork PR.',
                'The PR checks and preview will start automatically after the test base is ready.',
              ].join('\n'));
              return;
            }

            const mainComparison = (await github.rest.repos.compareCommits({
              owner, repo, base: 'main', head: target.head.sha,
            })).data;
            if (!['ahead', 'identical'].includes(mainComparison.status)) {
              await publishStatus([
                `⛔ PR #${targetNumber} does not contain the latest \`main\`.`,
                '',
                'Update that PR with the latest `main`, then run this command again.',
              ].join('\n'));
              return;
            }

            const desiredBase = target.head.ref;
            if (current.base.ref === desiredBase) {
              await publishStatus([
                '## 🧪 Stacked PR test',
                '',
                `PR #${currentNumber} is already being tested with PR #${targetNumber}.`,
                `Base branch: \`${desiredBase}\``,
                '',
                'Use `test with main` to remove the stack.',
              ].join('\n'));
              return;
            }

            const previousBase = current.base.ref;
            await github.rest.pulls.update({
              owner, repo, pull_number: currentNumber, base: desiredBase,
            });
            await deleteTemporaryBase(previousBase);

            await publishStatus([
              '## 🧪 Stacked PR test enabled',
              '',
              `PR #${currentNumber} will now be tested together with PR #${targetNumber}.`,
              `GitHub base branch changed to \`${desiredBase}\`.`,
              '',
              `The validation checkout represents \`latest main + PR #${targetNumber} + PR #${currentNumber}\`.`,
              '',
              'The checks and PR preview will rerun automatically.',
              'Use `test with main` on this PR to return it to the normal base.',
            ].join('\n'));
