name: Maintain stacked PR bases

on:
  pull_request_target:
    types:
      - closed

jobs:
  advance:
    name: Advance dependent stacked PRs
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Move dependent PRs to the next base
        uses: actions/github-script@v9
        with:
          script: |
            const closed = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (closed.head.repo?.full_name !== `${owner}/${repo}`) {
              core.info('Closed PR head is not a branch in this repository; no stacked base can point to it.');
              return;
            }

            const dependents = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                base: closed.head.ref,
                per_page: 100,
              }
            );

            if (!dependents.length) {
              core.info(`No open PRs are stacked on ${closed.head.ref}.`);
              return;
            }

            for (const dependent of dependents) {
              const nextBase = closed.base.ref;

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: dependent.number,
                base: nextBase,
              });

              const marker = '<!-- upes-physics-stack-status -->';
              const result = closed.merged
                ? `PR #${closed.number} was merged, so this PR has automatically advanced to base \`${nextBase}\`.`
                : `PR #${closed.number} was closed without merging, so this PR has automatically returned to base \`${nextBase}\`.`;
              const body = [
                marker,
                '## 🧪 Stacked PR base advanced',
                '',
                result,
                '',
                'The validation and preview workflows will rerun automatically.',
              ].join('\n');

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: dependent.number,
                  per_page: 100,
                }
              );
              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: dependent.number,
                  body,
                });
              }
            }
