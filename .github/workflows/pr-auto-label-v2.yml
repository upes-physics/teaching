name: PR automatic labels v2

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

jobs:
  auto-label:
    name: Apply path labels
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Apply configured labels
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const defaultBranch = context.payload.repository.default_branch;

            const configResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/label-rules.json',
              ref: defaultBranch,
            });
            const config = JSON.parse(
              Buffer.from(configResponse.data.content, 'base64').toString('utf8')
            );
            const rules = Array.isArray(config.labels) ? config.labels : [];

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            const activeFiles = files
              .filter(file => file.status !== 'removed')
              .map(file => file.filename);

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );
            const labelsByKey = new Map(
              repoLabels.map(label => [label.name.toLowerCase(), label])
            );
            const currentLabels = new Set(
              (pr.labels || []).map(label => label.name.toLowerCase())
            );

            async function ensureLabel(rule) {
              const key = rule.name.toLowerCase();
              let label = labelsByKey.get(key);

              if (!label) {
                label = (await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: rule.name,
                  color: String(rule.color || 'D4C5F9').replace('#', ''),
                  description: rule.description || '',
                })).data;
                labelsByKey.set(key, label);
                return label.name;
              }

              if (
                label.name !== rule.name ||
                (rule.color && label.color.toLowerCase() !== String(rule.color).replace('#', '').toLowerCase()) ||
                (rule.description !== undefined && (label.description || '') !== rule.description)
              ) {
                label = (await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  new_name: rule.name,
                  color: String(rule.color || label.color || 'D4C5F9').replace('#', ''),
                  description: rule.description ?? label.description ?? '',
                })).data;
                labelsByKey.set(key, label);
              }

              return label.name;
            }

            for (const rule of rules) {
              if (!rule?.name) continue;
              const paths = Array.isArray(rule.paths) ? rule.paths : [];
              if (!paths.length) continue;

              const labelName = await ensureLabel(rule);
              const key = labelName.toLowerCase();
              const shouldHave = activeFiles.some(filename =>
                paths.some(prefix => filename.startsWith(prefix))
              );
              const hasLabel = currentLabels.has(key);

              core.info(
                `${labelName}: ${shouldHave ? 'matched' : 'not matched'} ` +
                `for PR #${pr.number}`
              );

              if (shouldHave && !hasLabel) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [labelName],
                });
                currentLabels.add(key);
              } else if (!shouldHave && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: labelName,
                });
                currentLabels.delete(key);
              }
            }
