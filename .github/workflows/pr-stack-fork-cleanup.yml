name: Clean up fork stacked PR bases

on:
  pull_request_target:
    types:
      - closed

jobs:
  cleanup:
    name: Reset dependent stacked PRs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Clean temporary integration branches
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const closed = context.payload.pull_request;
            const marker = '<!-- upes-physics-stack-status -->';

            async function deleteRef(branch) {
              if (!branch?.startsWith('pr-stack/')) return;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
              } catch (error) {
                if (error.status !== 404) {
                  core.warning(`Could not delete ${branch}: ${error.message}`);
                }
              }
            }

            // If the PR being closed was itself using a temporary integration
            // base, its branch is no longer needed.
            if (closed.base.ref?.startsWith(`pr-stack/pr-${closed.number}-with-`)) {
              await deleteRef(closed.base.ref);
            }

            const openPrs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );

            const suffix = `-with-${closed.number}`;
            const dependents = openPrs.filter(pr =>
              pr.base.ref?.startsWith(`pr-stack/pr-${pr.number}-with-`) &&
              pr.base.ref.endsWith(suffix)
            );

            for (const dependent of dependents) {
              const temporaryBase = dependent.base.ref;

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: dependent.number,
                base: 'main',
              });

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: dependent.number,
                  per_page: 100,
                }
              );
              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              const outcome = closed.merged
                ? `PR #${closed.number} was merged.`
                : `PR #${closed.number} was closed without merging.`;
              const body = [
                marker,
                '## 🧪 Stacked PR test ended',
                '',
                outcome,
                `PR #${dependent.number} has been returned to \`main\`.`,
                '',
                'Its normal checks and preview will rerun automatically.',
              ].join('\n');

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: dependent.number,
                  body,
                });
              }

              await deleteRef(temporaryBase);
            }
