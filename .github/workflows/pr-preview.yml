name: PR checks and preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: pages-branch-write
  cancel-in-progress: false

jobs:
  checks:
    name: Static checks

    # No source checks are needed when only removing a closed PR preview.
    if: github.event.action != 'closed'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout proposed merged version
        uses: actions/checkout@v6

      - name: Require dev to main PR
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "dev" ]; then
            echo "Production pull requests must originate from the dev branch."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' \
            -not -path './.git/*' \
            -print0 |
          xargs -0 -r -n1 node --check

      - name: Validate HTML
        run: |
          npx --yes htmlhint@1 "**/*.html"

      - name: Validate JSON and referenced course files
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          errors = []

          # Validate every JSON file.
          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue

              try:
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON: {exc}")

          # Check that every dataCard path in app.js exists.
          app_js = Path("app.js").read_text(encoding="utf-8")

          for relative_path in re.findall(
              r'dataCard\s*:\s*"([^"]+)"',
              app_js
          ):
              if not Path(relative_path).is_file():
                  errors.append(
                      f"app.js references missing data card: {relative_path}"
                  )

          # Check simulator files referenced by datacard.json.
          for card_path in Path("data").rglob("datacard.json"):
              try:
                  card = json.loads(card_path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              for simulator in card.get("simulators", []):
                  link = simulator.get("link", "").strip()

                  if not link:
                      errors.append(
                          f"{card_path}: simulator has no link"
                      )
                      continue

                  parsed = urlsplit(link)

                  # External URLs do not correspond to repository files.
                  if parsed.scheme or parsed.netloc:
                      continue

                  target = card_path.parent / parsed.path

                  if not target.is_file():
                      errors.append(
                          f"{card_path}: missing simulator file: {link}"
                      )

          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors))
              raise SystemExit(1)

          print("All JSON and course-file checks passed.")
          PY

      - name: Create temporary site build
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='README.md' \
            ./ _site/

          touch _site/.nojekyll

  preview:
    name: Deploy PR preview
    needs:
      - checks

    # Deploy only after successful checks.
    # On PR closure, run even though the checks job was skipped.
    if: >
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'dev' &&
      (
        github.event.action == 'closed' ||
        needs.checks.result == 'success'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      deployments: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The checks job has its own runner, so recreate the build here.
      - name: Create preview build
        if: github.event.action != 'closed'
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='README.md' \
            ./ _site/

          touch _site/.nojekyll

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
          qr-code: false
