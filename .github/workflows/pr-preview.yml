name: PR checks and preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout proposed merged version
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare CI report files
        run: |
          mkdir -p .ci
          : > .ci/reviewdog.txt

      - name: Require latest main
        id: freshness
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

          if [ "$BASE_REF" = "main" ]; then
            if ! git merge-base --is-ancestor \
              refs/remotes/origin/main \
              refs/remotes/origin/pr-head; then
              message="This pull request is not based on the latest main branch. Merge or rebase the latest main into the PR branch, then push again."
              echo "$message" | tee .ci/freshness.log
              echo "::error title=PR branch is behind main::$message"
              exit 1
            fi

            echo "PR branch contains the latest main commit." | tee .ci/freshness.log
          else
            git fetch --no-tags origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/test-base"

            if ! git merge-base --is-ancestor \
              refs/remotes/origin/main \
              refs/remotes/origin/test-base; then
              message="This stacked test base does not contain the latest main branch. Refresh the stacked test command and try again."
              echo "$message" | tee .ci/freshness.log
              echo "::error title=Stacked test base is behind main::$message"
              exit 1
            fi

            echo "Stacked test base ${BASE_REF} contains the latest main commit." | tee .ci/freshness.log
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Reviewdog
        id: reviewdog_setup
        continue-on-error: true
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252
        with:
          reviewdog_version: v0.21.0

      - name: Check JavaScript syntax
        id: javascript
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          : > .ci/javascript.log

          while IFS= read -r -d '' file; do
            output="$(node --check "$file" 2>&1)"
            code=$?

            if [ "$code" -ne 0 ]; then
              status=1
              {
                echo "### ${file#./}"
                echo "$output"
                echo
              } >> .ci/javascript.log

              line="$(printf '%s\n' "$output" | sed -nE 's#^.*:([0-9]+)$#\1#p' | head -n 1)"
              message="$(printf '%s\n' "$output" | grep -m 1 'SyntaxError:' | tr '\n' ' ')"
              message="${message:-JavaScript syntax validation failed}"

              printf '%s:%s:1: %s\n' \
                "${file#./}" "${line:-1}" "$message" \
                >> .ci/reviewdog.txt

              echo "::error file=${file#./},line=${line:-1},title=JavaScript syntax::$message"
            fi
          done < <(
            find . -type f -name '*.js' \
              -not -path './.git/*' \
              -not -path './.ci/*' \
              -print0
          )

          if [ "$status" -eq 0 ]; then
            echo "All JavaScript files passed node --check." | tee .ci/javascript.log
          else
            cat .ci/javascript.log
          fi

          exit "$status"

      - name: Validate HTML
        id: html
        continue-on-error: true
        shell: bash
        run: |
          set +e

          npx --yes htmlhint@1 \
            --format unix \
            --nocolor \
            "**/*.html" \
            > .ci/html.log 2>&1
          status=$?

          cat .ci/html.log

          if [ "$status" -ne 0 ]; then
            sed "s#${GITHUB_WORKSPACE}/##g" .ci/html.log \
              >> .ci/reviewdog.txt
            echo "::error title=HTML validation::HTMLHint found invalid markup."
          fi

          exit "$status"

      - name: Validate JSON and referenced course files
        id: json
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          errors = []

          def add_error(path, message, line=1, column=1):
              path_text = str(path)
              errors.append(f"{path_text}:{line}:{column}: {message}")
              safe_message = (
                  str(message)
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )
              print(
                  f"::error file={path_text},line={line},col={column},"
                  f"title=Site validation::{safe_message}"
              )

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts or ".ci" in path.parts:
                  continue

              try:
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              except json.JSONDecodeError as exc:
                  add_error(path, f"Invalid JSON: {exc.msg}", exc.lineno, exc.colno)
              except Exception as exc:
                  add_error(path, f"Could not read JSON: {exc}")

          app_js_path = Path("app.js")
          try:
              app_js = app_js_path.read_text(encoding="utf-8")
          except Exception as exc:
              add_error(app_js_path, f"Could not read app.js: {exc}")
              app_js = ""

          for relative_path in re.findall(r'dataCard\s*:\s*"([^"]+)"', app_js):
              if not Path(relative_path).is_file():
                  add_error(
                      app_js_path,
                      f"Referenced data card does not exist: {relative_path}",
                  )

          for card_path in Path("data").rglob("datacard.json"):
              try:
                  card = json.loads(card_path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              simulators = card.get("simulators", [])
              if not isinstance(simulators, list):
                  add_error(card_path, "'simulators' must be an array")
                  continue

              for index, simulator in enumerate(simulators, start=1):
                  if not isinstance(simulator, dict):
                      add_error(card_path, f"Simulator entry {index} must be an object")
                      continue

                  link = str(simulator.get("link", "")).strip()
                  if not link:
                      add_error(card_path, f"Simulator entry {index} has no link")
                      continue

                  parsed = urlsplit(link)
                  if parsed.scheme or parsed.netloc:
                      continue

                  target = card_path.parent / parsed.path
                  if not target.is_file():
                      add_error(
                          card_path,
                          f"Referenced simulator file does not exist: {link}",
                      )

          log_text = "\n".join(errors)
          Path(".ci/json.log").write_text(
              log_text + ("\n" if log_text else ""), encoding="utf-8"
          )

          if errors:
              with Path(".ci/reviewdog.txt").open("a", encoding="utf-8") as handle:
                  handle.write(log_text + "\n")
              print("\nValidation errors:")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)

          message = "All JSON and referenced course files passed validation."
          Path(".ci/json.log").write_text(message + "\n", encoding="utf-8")
          print(message)
          PY

      - name: Publish Reviewdog diagnostics
        if: >-
          always() &&
          steps.reviewdog_setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s .ci/reviewdog.txt ]; then
            exit 0
          fi

          if [ "$IS_FORK" = "true" ]; then
            reporter="github-pr-annotations"
          else
            reporter="github-pr-review"
          fi

          reviewdog \
            -name="Static validators" \
            -efm="%f:%l:%c: %m" \
            -reporter="$reporter" \
            -filter-mode=file \
            -level=error \
            < .ci/reviewdog.txt

      - name: Create temporary site build
        id: build
        continue-on-error: true
        if: >-
          steps.freshness.outcome == 'success' &&
          steps.javascript.outcome == 'success' &&
          steps.html.outcome == 'success' &&
          steps.json.outcome == 'success'
        shell: bash
        run: |
          {
            rm -rf _site
            mkdir -p _site

            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.ci/' \
              --exclude='_site/' \
              --exclude='README.md' \
              ./ _site/

            touch _site/.nojekyll
            echo "Temporary site build completed successfully."
          } > .ci/build.log 2>&1

          cat .ci/build.log

      - name: Create automated PR report
        if: always()
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FRESHNESS_STATUS: ${{ steps.freshness.outcome }}
          JAVASCRIPT_STATUS: ${{ steps.javascript.outcome }}
          HTML_STATUS: ${{ steps.html.outcome }}
          JSON_STATUS: ${{ steps.json.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          script: |
            const fs = require('fs');

            const statuses = {
              'Latest main included': process.env.FRESHNESS_STATUS || 'skipped',
              'JavaScript syntax': process.env.JAVASCRIPT_STATUS || 'skipped',
              'HTML validation': process.env.HTML_STATUS || 'skipped',
              'JSON and file references': process.env.JSON_STATUS || 'skipped',
              'Temporary build': process.env.BUILD_STATUS || 'skipped',
            };

            const logFiles = {
              'Latest main included': '.ci/freshness.log',
              'JavaScript syntax': '.ci/javascript.log',
              'HTML validation': '.ci/html.log',
              'JSON and file references': '.ci/json.log',
              'Temporary build': '.ci/build.log',
            };

            const readLog = path =>
              fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const icon = status => status === 'success'
              ? '✅'
              : status === 'failure' ? '❌' : '⏭️';

            const failures = Object.entries(statuses)
              .filter(([, status]) => status === 'failure');
            const table = Object.entries(statuses)
              .map(([name, status]) => `| ${name} | ${icon(status)} ${status} |`)
              .join('\n');

            const suggestions = [];
            if (statuses['Latest main included'] === 'failure') {
              suggestions.push(
                process.env.BASE_REF === 'main'
                  ? 'Merge or rebase the latest `main` branch into the pull-request branch, then push again.'
                  : 'Refresh the stacked PR test so its test base contains the latest `main` branch.'
              );
            }

            const allLogs = Object.values(logFiles).map(readLog).join('\n');
            if (/SyntaxError:/i.test(allLogs)) {
              suggestions.push(
                'Inspect the reported JavaScript line and the preceding line for a missing comma, quote, bracket, or parenthesis.'
              );
            }
            if (/Tag must be paired|tag-pair/i.test(allLogs)) {
              suggestions.push(
                'Add the missing closing HTML tag and close nested elements in reverse order.'
              );
            }
            if (/Invalid JSON/i.test(allLogs)) {
              suggestions.push(
                'Correct the JSON at the reported line and column; check commas, quotes, braces, and brackets.'
              );
            }
            if (/Referenced data card does not exist|Referenced simulator file does not exist/i.test(allLogs)) {
              suggestions.push(
                'Correct the referenced path or add the missing file at that exact repository location.'
              );
            }
            if (failures.length && suggestions.length === 0) {
              suggestions.push(
                'Fix the first reported file and line, then push another commit; the checks will rerun automatically.'
              );
            }

            const details = failures.map(([name]) => {
              const log = readLog(logFiles[name]);
              const clipped = log.length > 7000
                ? `${log.slice(0, 7000)}\n\n... log truncated.`
                : log;
              return [
                '<details>',
                `<summary><strong>${name}</strong> error output</summary>`,
                '',
                '```text',
                clipped || 'No detailed log was produced.',
                '```',
                '</details>',
              ].join('\n');
            }).join('\n\n');

            const failed = failures.length > 0;
            const shortSha = (process.env.HEAD_SHA || context.sha).slice(0, 7);
            const sourceNote = process.env.IS_FORK === 'true'
              ? 'This pull request originates from a fork. It was tested with a read-only token.'
              : 'This pull request originates from this repository.';
            const stackNote = process.env.BASE_REF === 'main'
              ? 'Test base: `main`.'
              : `Stacked test base: \`${process.env.BASE_REF}\`. The checked-out merge contains both pull requests.`;

            const body = [
              '<!-- upes-physics-ci-report -->',
              `## ${failed ? '❌' : '✅'} Automated PR checks`,
              '',
              `Checked commit \`${shortSha}\`.`,
              '',
              '| Check | Result |',
              '|---|---|',
              table,
              '',
              failed
                ? `### Suggested fixes\n${suggestions.map(item => `- ${item}`).join('\n')}`
                : 'All required checks passed. A preview can now be published.',
              failed && details ? `\n### Error details\n${details}` : '',
              '',
              stackNote,
              sourceNote,
              '',
              'This comment is updated after every workflow run.',
            ].join('\n');

            fs.writeFileSync('.ci/report.md', body);

      - name: Upload PR report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-report
          path: .ci/report.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload preview site
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-site
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Fail when a required check fails
        if: >-
          always() &&
          (
            steps.freshness.outcome != 'success' ||
            steps.javascript.outcome != 'success' ||
            steps.html.outcome != 'success' ||
            steps.json.outcome != 'success' ||
            steps.build.outcome != 'success'
          )
        run: exit 1
