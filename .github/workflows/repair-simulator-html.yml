name: Repair simulator HTML structure

on:
  push:
    branches:
      - phys2025

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Repair HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/ug/sem3/PHYS2025/Simulator_PN_1.html')
          text = path.read_text(encoding='utf-8')
          original = text

          html = re.search(r'<html\\b[^>]*>', text, re.I)
          if not html:
              raise SystemExit('No <html> opening tag found')

          # Remove the misplaced head block currently occurring after the metadata.
          text, n = re.subn(
              r'\\s*<head>\\s*<title>\\s*UPES Physics Simulator\\s*</title>\\s*</head>\\s*',
              '\\n', text, count=1, flags=re.I
          )
          if n != 1:
              raise SystemExit(f'Expected exactly one misplaced UPES head block, found {n}')

          # Put the document head immediately after <html> and keep the existing title.
          html = re.search(r'<html\\b[^>]*>', text, re.I)
          insertion = '\\n<head>\\n<title>UPES Physics Simulator</title>\\n'
          text = text[:html.end()] + insertion + text[html.end():]

          # Remove only genuinely unmatched closing </aside> tags.
          opens = len(re.findall(r'<aside\\b[^>]*>', text, re.I))
          closes = len(re.findall(r'</aside\\s*>', text, re.I))
          if closes > opens:
              extra = closes - opens
              text = re.sub(r'</aside\\s*>', '', text, count=extra, flags=re.I)

          # Ensure the document has one final body/html closure.
          text = re.sub(r'\\s*</body>\\s*</html>\\s*$', '', text, flags=re.I)
          text = text.rstrip() + '\\n</body>\\n</html>\\n'

          if text == original:
              raise SystemExit('Repair produced no changes')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ug/sem3/PHYS2025/Simulator_PN_1.html .github/workflows/repair-simulator-html.yml
          git rm .github/workflows/repair-simulator-html.yml
          git commit -m 'Fix Simulator_PN_1 HTML document structure'
          git push
