name: PR label command v2

on:
  issue_comment:
    types:
      - created

jobs:
  label:
    name: Handle reviewer label command
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Handle label command
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const match = body.match(/^label\s+(.+?)\s*$/i);
            if (!match) {
              core.info('Comment is not a label command.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;
            const actor = context.actor;
            let requestedName = match[1].trim();

            if (
              (requestedName.startsWith('"') && requestedName.endsWith('"')) ||
              (requestedName.startsWith("'") && requestedName.endsWith("'"))
            ) {
              requestedName = requestedName.slice(1, -1).trim();
            }

            if (!requestedName) return;

            const pr = (await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            })).data;
            if (pr.state !== 'open') {
              core.notice(`PR #${prNumber} is not open.`);
              return;
            }

            let permission = 'none';
            try {
              permission = (await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: actor,
              })).data.permission;
            } catch (error) {
              core.info(`No collaborator permission record for ${actor}: ${error.message}`);
            }

            const isMaintainer = ['triage', 'write', 'maintain', 'admin'].includes(permission);
            const isRequestedReviewer = (pr.requested_reviewers || [])
              .some(reviewer => reviewer.login === actor);
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const hasReviewed = reviews.some(review => review.user?.login === actor);

            if (!isMaintainer && !isRequestedReviewer && !hasReviewed) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `⛔ @${actor}, the \`label <label name>\` command is restricted to repository maintainers and reviewers of this pull request.`,
              });
              return;
            }

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );
            let label = repoLabels.find(candidate =>
              candidate.name.toLowerCase() === requestedName.toLowerCase()
            );

            if (!label) {
              const configResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/label-rules.json',
                ref: context.payload.repository.default_branch,
              });
              const config = JSON.parse(
                Buffer.from(configResponse.data.content, 'base64').toString('utf8')
              );
              const rule = (Array.isArray(config.labels) ? config.labels : [])
                .find(candidate => candidate?.name?.toLowerCase() === requestedName.toLowerCase());

              if (!rule) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `⛔ Label \`${requestedName}\` does not exist. Create it first or add it to \`.github/label-rules.json\`.`,
                });
                return;
              }

              label = (await github.rest.issues.createLabel({
                owner,
                repo,
                name: rule.name,
                color: String(rule.color || 'D4C5F9').replace('#', ''),
                description: rule.description || '',
              })).data;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber, labels: [label.name],
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `🏷️ @${actor} added label \`${label.name}\` to PR #${prNumber}.`,
            });
