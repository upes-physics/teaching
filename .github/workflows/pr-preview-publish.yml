name: Publish PR report and preview

on:
  workflow_run:
    workflows:
      - PR checks and preview
    types:
      - completed

concurrency:
  group: pages-branch-write
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PR results
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      deployments: read

    steps:
      - name: Resolve the current open pull request
        id: current
        uses: actions/github-script@v9
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const run = context.payload.workflow_run;
            let pr = null;

            const eventPr = Array.isArray(run.pull_requests)
              ? run.pull_requests[0]
              : null;

            if (eventPr?.number) {
              try {
                const { data: candidate } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: eventPr.number,
                });
                if (
                  candidate.state === 'open' &&
                  candidate.head.sha === process.env.RUN_HEAD_SHA
                ) {
                  pr = candidate;
                }
              } catch (error) {
                core.warning(`Could not resolve PR from workflow payload: ${error.message}`);
              }
            }

            if (!pr) {
              const head = `${process.env.HEAD_OWNER}:${process.env.HEAD_BRANCH}`;
              const pullRequests = await github.paginate(
                github.rest.pulls.list,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head,
                  per_page: 100,
                }
              );

              pr = pullRequests.find(candidate =>
                candidate.head.sha === process.env.RUN_HEAD_SHA
              );
            }

            const isCurrent = Boolean(pr);
            core.setOutput('is_current', String(isCurrent));
            core.setOutput('pr_number', pr ? String(pr.number) : '');
            core.setOutput('base_ref', pr ? pr.base.ref : '');

            if (!isCurrent) {
              core.notice(
                `Skipping stale or closed PR run at ${process.env.RUN_HEAD_SHA}.`
              );
            }

      - name: Checkout deployment repository
        if: steps.current.outputs.is_current == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download PR report
        if: steps.current.outputs.is_current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pr-report
          path: downloaded-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish automated PR report
        if: steps.current.outputs.is_current == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.current.outputs.pr_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- upes-physics-ci-report -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const reportPath = 'downloaded-report/report.md';

            let body = fs.readFileSync(reportPath, 'utf8').trim();
            body += `\n\n[Open the complete workflow run](${process.env.RUN_URL})`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Download preview site
        if: >-
          steps.current.outputs.is_current == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-site
          path: preview-site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy preview to gh-pages
        if: >-
          steps.current.outputs.is_current == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: preview-site
          target-folder: pr-preview/pr-${{ steps.current.outputs.pr_number }}
          clean: true
          force: false
          commit-message: Deploy preview for PR ${{ steps.current.outputs.pr_number }}

      - name: Publish preview link
        if: >-
          steps.current.outputs.is_current == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.current.outputs.pr_number }}
          BASE_REF: ${{ steps.current.outputs.base_ref }}
          BUILT_AT: ${{ github.event.workflow_run.updated_at }}
        with:
          script: |
            const marker = '<!-- upes-physics-preview-link -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const url =
              `https://${context.repo.owner}.github.io/${context.repo.repo}` +
              `/pr-preview/pr-${prNumber}/`;
            const branchUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/tree/gh-pages`;
            const deploymentsUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/deployments`;

            const builtAt = new Date(process.env.BUILT_AT);
            const builtAtText = Number.isNaN(builtAt.getTime())
              ? 'the latest successful check run'
              : `${builtAt.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
            const stackText = process.env.BASE_REF === 'main'
              ? ''
              : `<br> Stacked test base: <code>${process.env.BASE_REF}</code>.`;

            const body = [
              `[PR Preview](${url})`,
              ':---:',
              `| <p></p> :rocket: View preview at <br> ${url} <br><br>`,
              `| <h6>Built to branch [\`gh-pages\`](${branchUrl}) at ${builtAtText}.${stackText} <br> Preview will be ready when the [GitHub Pages deployment](${deploymentsUrl}) is complete. <br> It is rebuilt after every successful check run and removed when the pull request is closed. <br><br> </h6>`,
              marker,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
